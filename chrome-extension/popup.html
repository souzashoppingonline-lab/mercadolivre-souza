<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>FinanceEcom Monitor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #333;
    }
    .header {
      background: linear-gradient(135deg, #FFE600 0%, #FFC107 100%);
      color: #333;
      padding: 16px;
      text-align: center;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .content {
      padding: 16px;
    }
    .api-config {
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .api-config label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #666;
    }
    .api-config input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 12px;
      font-family: monospace;
    }
    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-save {
      background: #FFE600;
      color: #333;
    }
    .btn-save:hover {
      background: #FFC107;
    }
    .btn-clear {
      background: white;
      border: 1px solid #ddd;
      color: #333;
    }
    .btn-clear:hover {
      background: #f5f5f5;
    }
    .status {
      background: white;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 10px;
      font-size: 12px;
      display: none;
    }
    .status.error {
      background: #ffebee;
      border-color: #f44336;
      color: #c62828;
    }
    .status.success {
      background: #e8f5e9;
      border-color: #4CAF50;
      color: #2e7d32;
    }
    .help {
      background: #e3f2fd;
      border: 1px solid #2196F3;
      border-radius: 4px;
      padding: 10px;
      font-size: 11px;
      color: #1565c0;
      margin-top: 12px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📊 FinanceEcom Monitor</h1>
  </div>

  <div class="content">
    <div class="api-config">
      <label for="apiUrl">URL da API:</label>
      <input type="text" id="apiUrl" placeholder="http://localhost:3000" value="">
    </div>

    <div class="controls">
      <button class="btn-save" id="saveBtn">💾 Salvar</button>
      <button class="btn-clear" id="clearBtn">🗑️ Limpar</button>
    </div>

    <div id="status" class="status"></div>

    <div class="help">
      💡 Após salvar, vá para um produto do Mercado Livre. Um botão amarelo aparecerá no canto inferior direito. Clique para enviar dados.
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
