<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos Amazon — ML Dashboard</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/cards.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>window.PAGE_TITLE='Pedidos'; window.ACTIVE_NAV='amazon-pedidos.html';</script>
  <style>
    .filters-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
    .filters-row select { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); border-radius: 8px; padding: 7px 12px; font-size: 13px; }
  </style>
</head>
<body>
<div class="app-container">
  <div id="app-sidebar"></div>
  <main class="main-content">
    <div id="app-topbar"></div>
    <div class="content-area">

      <div class="filters-row">
        <select id="filterStatus">
          <option value="">Todos os status</option>
          <option value="paid">Pago</option>
          <option value="pending">Pendente</option>
          <option value="shipped">Enviado</option>
          <option value="cancelled">Cancelado</option>
        </select>
      </div>

      <div class="card">
        <div class="card-header">
          <h3>Pedidos Amazon</h3>
          <span id="azPedidosCount" style="font-size:12px;color:var(--text-muted);margin-left:auto"></span>
          <button class="action-btn" onclick="exportTableCSV(document.getElementById('azPedidosTbody').closest('table'), 'amazon-pedidos.csv')"><i class="fas fa-file-csv"></i> CSV</button>
        </div>
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Pedido</th>
                <th>Cliente</th>
                <th>SKU</th>
                <th class="tbl-num">Valor</th>
                <th>Status</th>
                <th>Data</th>
                <th>Conta</th>
              </tr>
            </thead>
            <tbody id="azPedidosTbody">
              <tr><td colspan="7" class="empty-state"><div class="spinner" style="margin:auto"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>
</div>
<script src="../js/db.js"></script>
<script src="../js/tableExport.js"></script>
<script src="../js/websocket.js"></script>
<script src="../js/layout-amazon.js"></script>
<script src="../js/sidebar.js"></script>
<script>
const R = v => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v)||0);
const fmtDt = d => d ? new Date(d).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
const set = (id,v) => { const el=document.getElementById(id); if(el) el.textContent=v; };
const STATUS_LABEL = { paid:'Pago', pending:'Pendente', cancelled:'Cancelado', shipped:'Enviado' };

async function loadPedidos() {
  const tbody = document.getElementById('azPedidosTbody');
  tbody.innerHTML = '<tr><td colspan="7" class="empty-state"><div class="spinner" style="margin:auto"></div></td></tr>';
  const d = await DB.getAmazonPedidos();
  if (!d || d.error) {
    tbody.innerHTML = `<tr><td colspan="7" class="empty-state" style="color:var(--red)">Erro ao carregar pedidos${d?.error ? ': '+d.error : ''}</td></tr>`;
    return;
  }
  const statusFilter = document.getElementById('filterStatus').value;
  const rows = (d.rows || []).filter(r => !statusFilter || r.status === statusFilter);
  set('azPedidosCount', `${rows.length} pedido(s)`);
  tbody.innerHTML = rows.length ? rows.map(r => `
    <tr>
      <td>${r.id || '—'}</td>
      <td>${r.cliente || '—'}</td>
      <td style="font-size:11px;color:var(--text-muted)">${r.sku || '—'}</td>
      <td class="tbl-num">${R(r.valor)}</td>
      <td>${STATUS_LABEL[r.status] || r.status || '—'}</td>
      <td style="white-space:nowrap;font-size:12px">${fmtDt(r.data)}</td>
      <td style="font-size:12px">${r.conta || '—'}</td>
    </tr>`).join('') : '<tr><td colspan="7" class="empty-state">Nenhum pedido Amazon encontrado</td></tr>';
}

WS.on('order_updated', payload => { if (payload?.marketplace === 'AMAZON') loadPedidos(); });
WS.on('_connected', loadPedidos);
setInterval(loadPedidos, 60000);

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('btnRefresh')?.addEventListener('click', loadPedidos);
  document.getElementById('filterStatus').addEventListener('change', loadPedidos);
  loadPedidos();
});
</script>
</body>
</html>
