<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendas Totais Amazon — ML Dashboard</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/cards.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>window.PAGE_TITLE='Vendas Totais'; window.ACTIVE_NAV='amazon-vendas.html';</script>
  <style>
    .amz-kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin-bottom: 20px; }
    .amz-kpi { background: var(--bg-card); border: 1px solid var(--border); border-left: 3px solid #ff9900; border-radius: 12px; padding: 18px 20px; }
    .amz-kpi .lbl { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .amz-kpi .val { font-size: 28px; font-weight: 800; line-height: 1.1; }
    .amz-kpi .sub { font-size: 12px; color: var(--green); margin-top: 6px; }
    .skeleton { background: linear-gradient(90deg, rgba(255,255,255,.04) 25%, rgba(255,255,255,.08) 50%, rgba(255,255,255,.04) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 4px; height: 26px; width: 70%; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  </style>
</head>
<body>
<div class="app-container">
  <div id="app-sidebar"></div>
  <main class="main-content">
    <div id="app-topbar"></div>
    <div class="content-area">

      <div class="amz-kpis">
        <div class="amz-kpi">
          <div class="lbl"><i class="fas fa-dollar-sign"></i> Vendas Totais</div>
          <div class="val" id="azVendas"><div class="skeleton"></div></div>
          <div class="sub">▲ Hoje</div>
        </div>
        <div class="amz-kpi">
          <div class="lbl"><i class="fas fa-shopping-bag"></i> Vendas Pagas</div>
          <div class="val" id="azVendasQtd"><div class="skeleton"></div></div>
          <div class="sub" style="color:var(--text-muted)" id="azVendasSub">de 0 pedidos listados</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h3>Vendas Amazon (pedidos pagos)</h3>
          <span id="azVendasCount" style="font-size:12px;color:var(--text-muted);margin-left:auto"></span>
        </div>
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Pedido</th>
                <th>Cliente</th>
                <th>SKU</th>
                <th class="tbl-num">Valor</th>
                <th>Data</th>
              </tr>
            </thead>
            <tbody id="azVendasTbody">
              <tr><td colspan="5" class="empty-state"><div class="spinner" style="margin:auto"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>
</div>
<script src="../js/db.js"></script>
<script src="../js/websocket.js"></script>
<script src="../js/layout-amazon.js"></script>
<script src="../js/sidebar.js"></script>
<script>
const R = v => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v)||0);
const fmtDt = d => d ? new Date(d).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
const set = (id,v) => { const el=document.getElementById(id); if(el) el.textContent=v; };

async function loadKpi() {
  const d = await DB.getAmazonKpis();
  if (!d || d.error) { set('azVendas','—'); return; }
  set('azVendas', R(d.vendas_hoje));
}

async function loadVendas() {
  const tbody = document.getElementById('azVendasTbody');
  const d = await DB.getAmazonPedidos();
  if (!d || d.error) {
    tbody.innerHTML = `<tr><td colspan="5" class="empty-state" style="color:var(--red)">Erro ao carregar vendas${d?.error ? ': '+d.error : ''}</td></tr>`;
    return;
  }
  const total = d.rows || [];
  const pagas = total.filter(r => r.status === 'paid');
  set('azVendasQtd', pagas.length);
  set('azVendasSub', `de ${total.length} pedidos listados`);
  set('azVendasCount', `${pagas.length} venda(s)`);
  tbody.innerHTML = pagas.length ? pagas.map(r => `
    <tr>
      <td>${r.id || '—'}</td>
      <td>${r.cliente || '—'}</td>
      <td style="font-size:11px;color:var(--text-muted)">${r.sku || '—'}</td>
      <td class="tbl-num">${R(r.valor)}</td>
      <td style="white-space:nowrap;font-size:12px">${fmtDt(r.data)}</td>
    </tr>`).join('') : '<tr><td colspan="5" class="empty-state">Nenhuma venda paga ainda</td></tr>';
}

function loadAll() { loadKpi(); loadVendas(); }

WS.on('order_updated', payload => { if (payload?.marketplace === 'AMAZON') loadAll(); });
WS.on('_connected', loadAll);
setInterval(loadAll, 60000);

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('btnRefresh')?.addEventListener('click', loadAll);
  loadAll();
});
</script>
</body>
</html>
