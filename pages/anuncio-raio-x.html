<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raio-X do anúncio</title>
<!-- Raio-X do anúncio (v189): aberto em ABA NOVA pela foto da "Nova venda!" na
     Tela Telegram (?item=MLB...). Só leitura: DB.getRaioXAnuncio → /api/bi/analista-ecom/item/:id/raio-x
     (banco, nenhuma chamada ao ML). Contas em server/src/raioX.js. -->
<style>
  :root { --primary:#FFE600; --bg:#14171c; --card:#1f232b; --card2:#272c35; --txt:#f0f0f0; --muted:#8d96a3; --border:#323844;
          --green:#2ecc71; --red:#e74c3c; --yellow:#f5c518; --blue:#4da3ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; }
  .wrap { max-width:1180px; margin:0 auto; padding:22px 18px 40px; }
  .topo { display:flex; gap:20px; align-items:center; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:18px; }
  .topo img { width:120px; height:120px; object-fit:contain; background:#fff; border-radius:12px; flex:none; }
  .topo h1 { font-size:21px; margin:0 0 8px; line-height:1.3; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; font-size:13px; }
  .chip { background:var(--card2); border:1px solid var(--border); border-radius:20px; padding:4px 11px; color:var(--muted); }
  .chip b { color:var(--txt); }
  .chip a { color:var(--blue); text-decoration:none; }
  .resumo { margin:16px 0; background:rgba(255,230,0,.07); border:1px solid rgba(255,230,0,.35); border-radius:14px; padding:14px 18px; font-size:15px; line-height:1.7; }
  .resumo b { color:var(--primary); }
  .kpis { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; }
  .kpi { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; }
  .kpi .l { font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); font-weight:700; }
  .kpi .v { font-size:30px; font-weight:900; margin:6px 0 2px; }
  .kpi .s { font-size:12.5px; color:var(--muted); line-height:1.5; }
  .up { color:var(--green); } .down { color:var(--red); } .flat { color:var(--yellow); }
  .nivel-urgente, .nivel-sem_estoque { border-color:var(--red); } .nivel-urgente .v, .nivel-sem_estoque .v { color:var(--red); }
  .nivel-atencao { border-color:var(--yellow); } .nivel-atencao .v { color:var(--yellow); }
  .nivel-ok .v { color:var(--green); }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin:24px 0 10px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; font-size:14px; }
  th, td { padding:11px 14px; text-align:right; border-bottom:1px solid var(--border); }
  th { font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); background:var(--card2); }
  th:first-child, td:first-child { text-align:left; }
  tr:last-child td { border-bottom:none; }
  td.j { font-weight:800; }
  .barra { display:inline-block; height:8px; border-radius:4px; background:var(--primary); vertical-align:middle; margin-left:8px; opacity:.8; }
  .graf { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; height:290px; }
  .nota { font-size:12px; color:var(--muted); margin-top:10px; line-height:1.6; }
  .acoes { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.4fr); gap:14px; margin-top:14px; }
  .box { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 16px; }
  .box .l { font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); font-weight:700; margin-bottom:8px; }
  .custo-row { display:flex; gap:8px; align-items:center; }
  .custo-row input { width:130px; background:var(--card2); border:1px solid var(--border); color:var(--txt); border-radius:8px; padding:9px 10px; font-size:15px; }
  .btn { background:var(--card2); border:1px solid var(--border); color:var(--txt); border-radius:8px; padding:9px 12px; font-size:13px; font-weight:700; cursor:pointer; }
  .btn:hover { border-color:var(--primary); }
  .btn.pri { background:var(--primary); color:#111; border-color:var(--primary); }
  .btn:disabled { opacity:.5; cursor:default; }
  .tarefas { display:flex; flex-wrap:wrap; gap:8px; }
  .msg { font-size:12.5px; margin-top:8px; color:var(--muted); min-height:16px; }
  .msg.ok { color:var(--green); } .msg.err { color:var(--red); }
  .tres { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-top:14px; }
  .tres .box { font-size:13.5px; line-height:1.6; }
  .tres .big { font-size:24px; font-weight:900; margin:2px 0 6px; }
  .tres ul { margin:6px 0 0; padding-left:18px; color:#d3d9e0; }
  .tres .muted { color:var(--muted); }
  .queda { margin-top:14px; background:rgba(231,76,60,.14); border:2px solid var(--red); border-radius:14px; padding:14px 18px; }
  .queda .t { font-size:17px; font-weight:900; color:#ff8a7d; }
  .queda ul { margin:8px 0 0; padding-left:20px; line-height:1.7; }
  .dois { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.3fr); gap:14px; }
  .mes { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:6px; }
  .mes div { background:var(--card2); border-radius:10px; padding:10px; }
  .mes .n { font-size:20px; font-weight:900; } .mes .x { font-size:12px; color:var(--muted); }
  .mini { height:150px; margin-top:8px; }
  .eventos { margin-top:10px; display:flex; flex-direction:column; gap:6px; font-size:13.5px; }
  .eventos span.d { display:inline-block; min-width:52px; color:var(--muted); font-weight:700; }
  /* Margem de contribuição — mesmas colunas do card do Resumo por Venda (Inteligência de Negócio) */
  .mg-linha { display:grid; grid-template-columns:minmax(150px,1.3fr) repeat(5,minmax(70px,.8fr)) minmax(120px,1fr); gap:10px; align-items:center;
    background:var(--card); border:1px solid var(--border); border-radius:12px; padding:10px 14px; margin-bottom:8px; }
  .mg-linha.total { background:var(--card2); border-color:#3b4250; }
  .mg-c { text-align:center; } .mg-c .k { font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); font-weight:700; }
  .mg-c .v { font-size:15px; font-weight:800; margin-top:3px; } .mg-c .v.neg { color:#ff6b6b; }
  .mg-id { font-size:12.5px; color:var(--muted); line-height:1.6; } .mg-id b { color:var(--txt); font-size:14px; }
  .mg-box { border-radius:10px; padding:8px 10px; text-align:center; border:1px solid; }
  .mg-box.pos { background:rgba(46,204,113,.08); border-color:rgba(46,204,113,.35); } .mg-box.neg { background:rgba(231,76,60,.1); border-color:rgba(231,76,60,.45); }
  .mg-box .k { font-size:10.5px; color:var(--muted); } .mg-box .v { font-size:19px; font-weight:900; } .mg-box.pos .v { color:var(--green); } .mg-box.neg .v { color:var(--red); }
  .mg-box .p { display:inline-block; margin-top:3px; font-size:11.5px; font-weight:800; border-radius:10px; padding:1px 8px; }
  .mg-box.pos .p { background:rgba(46,204,113,.18); color:var(--green); } .mg-box.neg .p { background:rgba(231,76,60,.2); color:#ff8a7d; }
  .tag-est { font-size:10px; font-weight:800; color:var(--yellow); border:1px solid rgba(245,197,24,.5); border-radius:8px; padding:0 6px; margin-left:4px; }
  @media (max-width:820px) { .mg-linha { grid-template-columns:repeat(3,minmax(0,1fr)); } .mg-linha .mg-id { grid-column:1 / -1; } .mg-linha .mg-box { grid-column:span 3; } }
  /* Botão destacado + modal da margem (v189.3: a página ficava grande demais com o bloco aberto) */
  .btn-margem { width:100%; margin-top:14px; display:flex; align-items:center; justify-content:space-between; gap:14px; cursor:pointer;
    background:linear-gradient(90deg, rgba(46,204,113,.22), rgba(46,204,113,.08)); border:2px solid var(--green); border-radius:14px;
    padding:16px 20px; color:var(--txt); font-family:inherit; text-align:left; box-shadow:0 0 0 4px rgba(46,204,113,.08); transition:transform .12s, box-shadow .12s; }
  .btn-margem:hover { transform:translateY(-1px); box-shadow:0 0 0 6px rgba(46,204,113,.15); }
  .btn-margem.neg { background:linear-gradient(90deg, rgba(231,76,60,.25), rgba(231,76,60,.08)); border-color:var(--red); box-shadow:0 0 0 4px rgba(231,76,60,.1); }
  .btn-margem .t { font-size:19px; font-weight:900; } .btn-margem .s { font-size:13px; color:var(--muted); margin-top:3px; }
  .btn-margem .r { text-align:right; } .btn-margem .r .v { font-size:24px; font-weight:900; } .btn-margem.pos .r .v { color:var(--green); } .btn-margem.neg .r .v { color:#ff6b6b; }
  .btn-margem .abrir { font-size:12px; font-weight:800; background:var(--primary); color:#111; border-radius:8px; padding:6px 12px; white-space:nowrap; }
  .modal-fundo { position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:1000; display:none; align-items:flex-start; justify-content:center; padding:30px 14px; overflow-y:auto; }
  .modal-fundo.aberto { display:flex; }
  .modal-caixa { width:100%; max-width:1180px; background:var(--bg); border:1px solid var(--border); border-radius:16px; padding:18px 20px 22px; position:relative; }
  .modal-fechar { position:absolute; top:12px; right:14px; background:var(--card2); border:1px solid var(--border); color:var(--txt); border-radius:8px; width:34px; height:34px; font-size:18px; cursor:pointer; }
  .modal-caixa h2 { margin-top:4px; padding-right:44px; }
  .erro { padding:60px 20px; text-align:center; color:var(--muted); }
  @media (max-width:820px) { .kpis { grid-template-columns:repeat(2,minmax(0,1fr)); } .acoes, .tres, .dois { grid-template-columns:1fr; } .mes { grid-template-columns:repeat(2,minmax(0,1fr)); } .topo { flex-direction:column; align-items:flex-start; } }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="erro">Carregando…</div></div>
<div class="modal-fundo" id="modalMargem" onclick="if (event.target === this) fecharMargem()">
  <div class="modal-caixa"><button class="modal-fechar" onclick="fecharMargem()" title="Fechar (Esc)">✕</button><div id="modalMargemCorpo"></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="../js/db.js"></script>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const num = (n) => Number(n || 0).toLocaleString('pt-BR');
const brl = (n) => Number(n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const pct = (n) => Number(n).toLocaleString('pt-BR', { maximumFractionDigits: 1 });
const dataBR = (iso) => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) : '—';

function seta(t) {
  if (!t || t.direcao === 'sem_dados') return { cls: 'flat', txt: '—', s: 'sem vendas nas 2 semanas' };
  if (t.direcao === 'subindo') return { cls: 'up', txt: t.pct == null ? '▲ novo' : `▲ ${pct(t.pct)}%`, s: `${t.atual} un. × ${t.anterior} un. antes` };
  if (t.direcao === 'caindo') return { cls: 'down', txt: `▼ ${pct(Math.abs(t.pct))}%`, s: `${t.atual} un. × ${t.anterior} un. antes` };
  return { cls: 'flat', txt: `● ${t.pct > 0 ? '+' : ''}${pct(t.pct)}%`, s: `estável · ${t.atual} un. × ${t.anterior} un.` };
}

let RX = null;
const neg = (n) => (Number(n) ? `-${brl(Math.abs(n))}` : brl(0));
const LOG_LBL = { self_service: 'Flex', fulfillment: 'Full', xd_drop_off: 'Mercado Envios', cross_docking: 'Mercado Envios', me2: 'Mercado Envios' };
function linhaMargem(id, x) {
  const cls = x.margem >= 0 ? 'pos' : 'neg';
  return `<div class="mg-linha${id.total ? ' total' : ''}">
    <div class="mg-id">${id.html}</div>
    <div class="mg-c"><div class="k">Venda</div><div class="v">${brl(x.faturamento)}</div></div>
    <div class="mg-c"><div class="k">Frete vend.</div><div class="v ${x.frete_vend ? 'neg' : ''}">${neg(x.frete_vend)}</div></div>
    <div class="mg-c"><div class="k">Tarifa</div><div class="v ${x.tarifa ? 'neg' : ''}">${neg(x.tarifa)}</div></div>
    <div class="mg-c"><div class="k">Custo</div><div class="v ${x.custo ? 'neg' : ''}">${neg(x.custo)}</div></div>
    <div class="mg-c"><div class="k">Imposto</div><div class="v ${x.imposto ? 'neg' : ''}">${neg(x.imposto)}</div></div>
    <div class="mg-box ${cls}"><div class="k">Margem</div><div class="v">${brl(x.margem)}</div>${x.mc_pct == null ? '' : `<span class="p">${pct(x.mc_pct)}%</span>`}</div>
  </div>`;
}
// Botão grande com o resumo dos 30 dias; o detalhe abre no modal.
function botaoMargem(m) {
  if (!m) return '';
  const j30 = m.janelas.find((j) => j.dias === 30) || {};
  const cls = !j30.vendas || j30.margem >= 0 ? 'pos' : 'neg';
  return `<button class="btn-margem ${cls}" onclick="abrirMargem()">
    <div><div class="t">💰 Margem de contribuição</div>
      <div class="s">${j30.vendas ? `Últimos 30 dias · ${num(j30.vendas)} vendas · mesma conta do Resumo por Venda${m.custo_ausente ? ' · ⚠️ sem custo cadastrado' : ''}` : 'Sem vendas nos últimos 30 dias'}</div></div>
    <div style="display:flex;align-items:center;gap:16px">${j30.vendas ? `<div class="r"><div class="v">${brl(j30.margem)}</div><div class="s">${j30.mc_pct == null ? '—' : pct(j30.mc_pct) + '% do faturamento'}</div></div>` : ''}
      <span class="abrir">Ver detalhes ▸</span></div>
  </button>`;
}
function abrirMargem() {
  const f = document.getElementById('modalMargem');
  document.getElementById('modalMargemCorpo').innerHTML = blocoMargem(RX && RX.margem);
  f.classList.add('aberto'); document.body.style.overflow = 'hidden';
}
function fecharMargem() { document.getElementById('modalMargem').classList.remove('aberto'); document.body.style.overflow = ''; }
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') fecharMargem(); });

function blocoMargem(m) {
  if (!m) return '';
  const j30 = m.janelas.find((j) => j.dias === 30) || {}, j7 = m.janelas.find((j) => j.dias === 7) || {};
  if (!j30.vendas) return `<h2>💰 Margem de contribuição</h2><div class="box muted">Sem vendas nos últimos 30 dias.</div>`;
  const dt = (iso) => new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit', timeZone: 'America/Sao_Paulo' });
  const totalId = (j) => ({ total: true, html: `<b>Últimos ${j.dias} dias</b><br>${num(j.vendas)} vendas · ${num(j.unidades)} un.<br>${j.confirmadas}/${j.vendas} com tarifa e frete confirmados` });
  return `<h2>💰 Margem de contribuição <span style="text-transform:none;letter-spacing:0;font-weight:600">· mesma conta do Resumo por Venda · imposto da loja ${m.imposto_pct == null ? '—' : pct(m.imposto_pct) + '%'}</span></h2>
    ${m.custo_ausente ? `<div class="queda" style="border-width:1px;margin:0 0 10px;padding:10px 14px">⚠️ Anúncio sem custo cadastrado — a margem abaixo está com custo R$ 0,00. Preencha o custo acima.</div>` : ''}
    ${j7.vendas ? linhaMargem(totalId(j7), j7) : ''}${linhaMargem(totalId(j30), j30)}
    <div class="muted" style="font-size:12px;margin:12px 0 8px">Últimas ${m.ultimas.length} vendas</div>
    ${m.ultimas.map((v) => linhaMargem({ html: `<b>${dt(v.data)}</b><br>Pedido ${esc(v.pedido)} · ${v.unidades}x${v.logistica ? ' · ' + esc(LOG_LBL[v.logistica] || v.logistica) : ''}${v.confirmada ? '' : '<span class="tag-est" title="Tarifa/frete ainda não confirmados pela Conciliação/pagamento — valor estimado do pedido">estimado</span>'}` }, v)).join('')}`;
}
const ICONE_EV = { preco_desce: '🟢', preco_sobe: '🔴', promo_entra: '🏷️', promo_sai: '⚪' };
function corEvento(evs) {
  if (!evs) return 'transparent';
  if (evs.some((e) => e.tipo === 'promo_entra')) return '#e66fb0';
  if (evs.some((e) => e.tipo === 'preco_sobe')) return '#e74c3c';
  if (evs.some((e) => e.tipo === 'preco_desce')) return '#2ecc71';
  return '#c9d1d9';
}
function varTxt(v, sufixo = '%') {
  if (v == null) return '<span class="muted">—</span>';
  const cls = Math.abs(v) < 10 && sufixo === '%' ? 'flat' : v > 0 ? 'up' : v < 0 ? 'down' : 'flat';
  return `<span class="${cls}">${v > 0 ? '▲ +' : v < 0 ? '▼ ' : '● '}${pct(v)}${sufixo}</span>`;
}
function boxMes(m, semVis) {
  if (!m) return `<div class="box"><div class="l">📅 Últimos 30 dias × 30 anteriores</div><div class="muted">Histórico ainda curto para comparar.</div></div>`;
  return `<div class="box"><div class="l">📅 Últimos 30 dias × 30 anteriores</div><div class="mes">
    <div><div class="x">Vendas</div><div class="n">${num(m.atual.pedidos)}</div><div class="x">antes ${num(m.anterior.pedidos)} · ${varTxt(m.var.pedidos)}</div></div>
    <div><div class="x">Unidades</div><div class="n">${num(m.atual.unidades)}</div><div class="x">antes ${num(m.anterior.unidades)} · ${varTxt(m.var.unidades)}</div></div>
    <div><div class="x">Visitas</div><div class="n">${semVis ? '—' : num(m.atual.visitas)}</div><div class="x">${semVis ? 'sem dado na Shopee' : `antes ${num(m.anterior.visitas)} · ${varTxt(m.var.visitas)}`}</div></div>
    <div><div class="x">Conversão</div><div class="n">${m.atual.conversao == null ? '—' : pct(m.atual.conversao) + '%'}</div><div class="x">${m.anterior.conversao == null ? '—' : `antes ${pct(m.anterior.conversao)}% · ${varTxt(m.var.conversao_pp, ' p.p.')}`}</div></div>
  </div></div>`;
}
function boxQuando(q) {
  if (!q || !q.total) return `<div class="box"><div class="l">🕐 Quando vende · ${q ? q.dias : 90} dias</div><div class="muted">Sem vendas no período.</div></div>`;
  const h = (n) => String(n).padStart(2, '0') + 'h';
  return `<div class="box"><div class="l">🕐 Quando vende · ${q.dias} dias (${num(q.total)} un.)</div>
    <div>Vende mais na <b>${q.melhor_dia.nome}</b> (${q.melhor_dia.pct}%) e entre <b>${h(q.melhor_faixa.de)} e ${h(q.melhor_faixa.ate)}</b> (${q.melhor_faixa.pct}%).</div>
    <div class="dois" style="gap:10px"><div class="mini"><canvas id="grafSemana"></canvas></div><div class="mini"><canvas id="grafHora"></canvas></div></div></div>`;
}

function boxDevolucoes(v) {
  if (!v) return '';
  const cor = v.taxa == null ? '' : v.taxa >= 5 ? 'down' : v.taxa >= 2 ? 'flat' : 'up';
  return `<div class="box"><div class="l">↩️ Devoluções · ${v.dias} dias</div>
    <div class="big ${cor}">${v.total} ${v.total === 1 ? 'devolução' : 'devoluções'}</div>
    <div class="muted">${v.taxa == null ? 'sem vendas no período' : `taxa ${pct(v.taxa)}% · ${num(v.pedidos)} vendas`}</div>
    ${v.motivos.length ? `<ul>${v.motivos.map((m) => `<li>${esc(m.motivo)} <b>(${m.qtd})</b></li>`).join('')}</ul>` : '<div class="muted" style="margin-top:6px">Nenhuma devolução 👍</div>'}</div>`;
}
const BOOST = { free_shipping: 'frete grátis', fulfillment: 'Full', same_day_shipping: 'entrega no mesmo dia', installments: 'parcelamento sem juros' };
function boxBuybox(b) {
  if (!b) return `<div class="box"><div class="l">🥊 Concorrência (buy box)</div><div class="muted">Não é anúncio de catálogo — não disputa buy box.</div></div>`;
  const st = b.ganhando === true ? '<span class="up">GANHANDO</span>' : b.ganhando === false ? '<span class="down">PERDENDO</span>' : '<span class="flat">sem vencedor</span>';
  return `<div class="box"><div class="l">🥊 Concorrência (buy box)</div><div class="big">${st}</div>
    <div>Meu preço: <b>${b.meu_preco == null ? '—' : brl(b.meu_preco)}</b></div>
    ${b.ganhando === false ? `<div>Quem ganha: <b>${b.preco_vencedor == null ? '—' : brl(b.preco_vencedor)}</b></div>` : ''}
    ${b.preco_para_ganhar != null && b.ganhando === false ? `<div>Preço para ganhar: <b class="flat">${brl(b.preco_para_ganhar)}</b></div>` : ''}
    ${b.falta.length ? `<div class="muted" style="margin-top:4px">Também ajuda: ${b.falta.map((x) => esc(BOOST[x] || x)).join(', ')}</div>` : ''}</div>`;
}
function boxQualidade(q) {
  if (!q) return `<div class="box"><div class="l">⭐ Qualidade do anúncio</div><div class="muted">Nota ainda não calculada (o cálculo roda 1x por dia).</div></div>`;
  const cor = q.score == null ? '' : q.score >= 80 ? 'up' : q.score >= 60 ? 'flat' : 'down';
  return `<div class="box"><div class="l">⭐ Qualidade do anúncio</div><div class="big ${cor}">${q.score == null ? '—' : q.score}<span class="muted" style="font-size:14px"> / 100</span></div>
    ${q.pendencias.length ? `<div class="muted">O que falta arrumar:</div><ul>${q.pendencias.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : '<div class="up">Nada pendente 👍</div>'}</div>`;
}

// Custo: mesmo caminho do Recebíveis/Resumo por Venda — grava items.cost e recalcula a margem das vendas.
function lerCusto(txt) {
  const s = String(txt || '').trim().replace(/[R$\s]/g, '');
  const n = Number(s.includes(',') ? s.replace(/\./g, '').replace(',', '.') : s);
  return Number.isFinite(n) && n > 0 ? Math.round(n * 100) / 100 : null;
}
async function salvarCusto() {
  const inp = document.getElementById('custoIn'), btn = document.getElementById('custoBtn'), msg = document.getElementById('custoMsg');
  const v = lerCusto(inp.value);
  if (v == null) { msg.className = 'msg err'; msg.textContent = 'Digite o custo por unidade, ex.: 36,50'; inp.focus(); return; }
  btn.disabled = true; msg.className = 'msg'; msg.textContent = 'Salvando…';
  const r = await DB.updateItemCusto(RX.item.ml_id, v);
  if (!r || r.error) { btn.disabled = false; msg.className = 'msg err'; msg.textContent = 'Não consegui salvar: ' + ((r && r.error) || DB.lastError || 'sem resposta'); return; }
  const g = await DB.regravarMargemItem(RX.item.ml_id);
  btn.disabled = false; msg.className = 'msg ok';
  msg.textContent = g && !g.error ? `✅ Custo ${brl(v)} salvo — já vale no Resumo por Venda (margem recalculada em ${(g.gravados || 0) + (g.restantes || 0)} venda(s)).`
    : `✅ Custo ${brl(v)} salvo — o Resumo por Venda já usa. A margem guardada atualiza na próxima gravação (05:35).`;
  const novo = await DB.getRaioXAnuncio(RX.item.ml_id);   // redesenha com a margem já usando o custo novo
  if (novo && !novo.error) { const txt = msg.textContent; render(novo); const m2 = document.getElementById('custoMsg'); if (m2) { m2.className = 'msg ok'; m2.textContent = txt; } }
}

async function criarTarefa(acao, prioridade) {
  const msg = document.getElementById('tarefaMsg');
  if (!acao) { acao = (prompt('O que fazer com este anúncio?') || '').trim(); if (!acao) return; }
  const it = RX.item;
  const c = RX.cobertura, t = RX.tendencia.unidades_7;
  const desc = [`Anúncio ${it.ml_id} · ${it.loja || ''}`, `Estoque: ${it.available_quantity ?? '—'}${c && c.dias != null ? ` (~${Math.round(c.dias)} dias)` : ''}`,
    `Vendas 7 dias: ${t.atual} un. (${t.direcao}${t.pct != null ? ' ' + pct(t.pct) + '%' : ''})`, 'Criada pelo Raio-X do anúncio.'].join('\n');
  msg.className = 'msg'; msg.textContent = 'Criando…';
  const r = await DB.createTask({ title: `${acao}: ${it.title}`.slice(0, 200), description: desc, priority: prioridade,
    marketplace: it.marketplace, store_id: it.store_id, item_id: it.ml_id, link: it.permalink || undefined });
  if (!r || r.error) { msg.className = 'msg err'; msg.textContent = 'Não consegui criar: ' + ((r && r.error) || DB.lastError || 'sem resposta'); return; }
  msg.className = 'msg ok'; msg.innerHTML = `✅ Tarefa "${esc(acao)}" criada em A Fazer — Manual. <a href="agenda-trello.html" target="_blank" rel="noopener" style="color:var(--blue)">Abrir Agenda ↗</a>`;
}

function render(d) {
  const it = d.item, c = d.cobertura || {}, p = d.previsao, t7 = seta(d.tendencia.unidades_7), t15 = seta(d.tendencia.unidades_15), tv = seta(d.tendencia.visitas_7);
  document.title = `Raio-X · ${it.title}`;
  const maxUn = Math.max(1, ...d.janelas.map((j) => j.unidades / j.dias));
  const cobTxt = c.nivel === 'sem_estoque' ? 'SEM ESTOQUE' : c.dias == null ? '—' : `${Math.round(c.dias)} dias`;
  const cobSub = c.nivel === 'sem_estoque' ? 'repor agora' : c.dias == null ? 'sem vendas recentes — estoque parado'
    : `${num(c.estoque)} un. em estoque · acaba ~${dataBR(c.acaba_em)}`;
  const j7 = d.janelas.find((j) => j.dias === 7) || {};
  RX = d;   // usado por salvarCusto/criarTarefa
  const semVis = !!d.sem_visitas;   // Shopee: sem visitas diárias no sistema
  const vis = (n) => semVis ? '—' : num(n);
  document.getElementById('app').innerHTML = `
    <div class="topo">
      ${it.thumbnail ? `<img src="${esc(it.thumbnail)}" alt="">` : ''}
      <div>
        <h1>${esc(it.title)}</h1>
        <div class="chips">
          <span class="chip">🏪 <b>${esc(it.loja || '—')}</b></span>
          <span class="chip">💰 <b>${brl(it.price)}</b></span>
          <span class="chip">📦 Estoque <b>${num(it.available_quantity)}</b></span>
          <span class="chip">${esc(it.ml_id)}</span>
          ${it.permalink ? `<span class="chip"><a href="${esc(it.permalink)}" target="_blank" rel="noopener">Ver no Mercado Livre ↗</a></span>` : ''}
        </div>
      </div>
    </div>
    ${d.alerta_queda ? `<div class="queda"><div class="t">🚨 Vendas caíram ${pct(Math.abs(d.alerta_queda.pct))}% nesta semana (${d.alerta_queda.atual} un. × ${d.alerta_queda.anterior} un. na semana anterior)</div>
      <div class="muted" style="margin-top:4px">Motivo provável:</div><ul>${d.alerta_queda.motivos.map((m) => `<li>${esc(m)}</li>`).join('')}</ul></div>` : ''}
    <div class="acoes">
      <div class="box">
        <div class="l">💵 Custo do produto (por unidade)</div>
        ${it.marketplace === 'SHOPEE' ? `<div class="muted" style="font-size:13px">Na Shopee o custo é por variação — continua na página de custos da Shopee.</div>` : `
        <div class="custo-row"><input id="custoIn" inputmode="decimal" placeholder="ex.: 36,50" value="${it.custo != null ? String(it.custo.toFixed(2)).replace('.', ',') : ''}">
          <button class="btn pri" id="custoBtn" onclick="salvarCusto()">Salvar custo</button></div>
        <div class="msg" id="custoMsg">${it.custo != null ? `Custo atual ${brl(it.custo)} — usado no Resumo por Venda (Inteligência de Negócio).` : 'Sem custo cadastrado — o Resumo por Venda está calculando a margem com custo R$ 0,00.'}</div>`}
      </div>
      <div class="box">
        <div class="l">✅ Criar tarefa na Agenda Trello (A Fazer — Manual)</div>
        <div class="tarefas">
          <button class="btn" onclick="criarTarefa('Repor estoque', 'alta')">📦 Repor estoque</button>
          <button class="btn" onclick="criarTarefa('Rever preço', 'media')">💲 Rever preço</button>
          <button class="btn" onclick="criarTarefa('Melhorar anúncio', 'media')">🛠️ Melhorar anúncio</button>
          <button class="btn" onclick="criarTarefa(null, 'media')">✏️ Outra…</button>
        </div>
        <div class="msg" id="tarefaMsg"></div>
      </div>
    </div>
    ${botaoMargem(d.margem)}
    <div class="resumo">🧠 ${d.frases.map((f) => esc(f).replace(/(\d+(?:,\d+)?%|~\d+ (?:dias|unidades))/g, '<b>$1</b>')).join('<br>🧠 ')}</div>
    <div class="kpis">
      <div class="kpi"><div class="l">Tendência · 7 dias</div><div class="v ${t7.cls}">${t7.txt}</div><div class="s">${t7.s}<br>15 dias: <span class="${t15.cls}">${t15.txt}</span></div></div>
      <div class="kpi nivel-${c.nivel || 'ok'}"><div class="l">Dias para repor</div><div class="v">${cobTxt}</div><div class="s">${cobSub}</div></div>
      <div class="kpi"><div class="l">Previsão de vendas</div><div class="v">${num(p.d7)} <span style="font-size:15px;color:var(--muted)">un. / 7 dias</span></div><div class="s">15 dias: <b>${num(p.d15)}</b> · 30 dias: <b>${num(p.d30)}</b><br>~${String(p.por_dia).replace('.', ',')} un. por dia</div></div>
      <div class="kpi"><div class="l">Conversão · 7 dias</div><div class="v">${j7.conversao == null ? '—' : String(j7.conversao).replace('.', ',') + '%'}</div><div class="s">${semVis ? `Shopee: visitas por dia não chegam ao sistema<br>${num(j7.pedidos)} vendas em 7 dias` : `${num(j7.visitas)} visitas · ${num(j7.pedidos)} vendas<br>visitas: <span class="${tv.cls}">${tv.txt}</span>`}</div></div>
    </div>
    ${d.qualidade || d.buybox || d.devolucoes ? `<div class="tres">${boxDevolucoes(d.devolucoes)}${boxBuybox(d.buybox)}${boxQualidade(d.qualidade)}</div>` : ''}
    <h2>Vendas, visitas e conversão por período</h2>
    <table>
      <thead><tr><th>Período</th><th>Vendas</th><th>Unidades</th><th>Visitas</th><th>Conversão</th><th>Média / dia</th></tr></thead>
      <tbody>${d.janelas.map((j) => `<tr><td class="j">Últimos ${j.dias} dias</td><td>${num(j.pedidos)}</td><td>${num(j.unidades)}</td><td>${vis(j.visitas)}</td>
        <td>${j.conversao == null ? '—' : String(j.conversao).replace('.', ',') + '%'}</td>
        <td>${String(j.media_dia).replace('.', ',')}<span class="barra" style="width:${Math.round((j.unidades / j.dias) / maxUn * 70)}px"></span></td></tr>`).join('')}</tbody>
    </table>
    <div class="dois" style="margin-top:14px">${boxMes(d.mes_passado, semVis)}${boxQuando(d.quando_vende)}</div>
    <h2>Últimos 30 dias, dia a dia ${d.eventos && d.eventos.length ? '<span style="text-transform:none;letter-spacing:0;font-weight:600">· ◆ = mudança de preço/promoção</span>' : ''}</h2>
    <div class="graf"><canvas id="graf"></canvas></div>
    ${d.eventos && d.eventos.length ? `<div class="box" style="margin-top:10px"><div class="l">📌 O que mudou no período</div><div class="eventos">${d.eventos.map((e) => `<div><span class="d">${dataBR(e.data)}</span>${ICONE_EV[e.tipo] || '•'} ${esc(e.texto)}</div>`).join('')}</div></div>` : ''}
    <div class="nota">Vendas e visitas de cada período incluem hoje. Conversão, média por dia, tendência e previsão usam só dias fechados (até ontem), porque as visitas de hoje entram no sistema amanhã.
      Previsão = 60% da média dos últimos 7 dias + 40% da média dos últimos 30. Tendência compara com o mesmo número de dias logo antes (±10% = estável).</div>`;
  if (window.Chart && d.quando_vende && d.quando_vende.total) {
    const q = d.quando_vende, opt = { maintainAspectRatio: false, plugins: { legend: { display: false } },
      scales: { x: { ticks: { color: '#8d96a3', maxRotation: 0, autoSkip: true }, grid: { display: false } }, y: { display: false, beginAtZero: true } } };
    const cor = (arr) => { const m = Math.max(...arr); return arr.map((v) => (v === m && m > 0 ? '#ffe600' : 'rgba(255,230,0,.35)')); };
    new Chart(document.getElementById('grafSemana'), { type: 'bar', data: { labels: ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'], datasets: [{ data: q.semana, backgroundColor: cor(q.semana), borderRadius: 4 }] }, options: opt });
    new Chart(document.getElementById('grafHora'), { type: 'bar', data: { labels: q.horas.map((_, h) => h + 'h'), datasets: [{ data: q.horas, backgroundColor: cor(q.horas), borderRadius: 3 }] }, options: opt });
  }
  if (window.Chart) {
    const dias = d.dias;
    const maxUn = Math.max(1, ...dias.map((x) => x.unidades));
    const evPorDia = {}; (d.eventos || []).forEach((e) => { (evPorDia[e.data] = evPorDia[e.data] || []).push(e); });
    const marcas = dias.map((x) => (evPorDia[x.data] ? maxUn * 1.12 : null));
    new Chart(document.getElementById('graf'), {
      data: { labels: dias.map((x) => dataBR(x.data)), datasets: [
        { type: 'line', label: 'Preço / promoção', data: marcas, showLine: false, yAxisID: 'y', pointStyle: 'rectRot', pointRadius: 8, pointHoverRadius: 10,
          backgroundColor: dias.map((x) => corEvento(evPorDia[x.data])), borderColor: '#111', borderWidth: 1, order: 0 },
        { type: 'bar', label: 'Unidades vendidas', data: dias.map((x) => x.unidades), backgroundColor: 'rgba(255,230,0,.75)', yAxisID: 'y', borderRadius: 4 },
        ...(semVis ? [] : [{ type: 'line', label: 'Visitas', data: dias.map((x, i) => (i === dias.length - 1 ? null : x.visitas)), spanGaps: false, borderColor: '#4da3ff', backgroundColor: '#4da3ff', yAxisID: 'y2', tension: .3, pointRadius: 2 }]),
      ] },
      options: { maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#c9d1d9', filter: (it) => it.text !== 'Preço / promoção' } },
          tooltip: { callbacks: { label: (c) => c.dataset.label === 'Preço / promoção' ? (evPorDia[dias[c.dataIndex].data] || []).map((e) => e.texto) : `${c.dataset.label}: ${c.formattedValue}` } } },
        scales: { x: { ticks: { color: '#8d96a3', maxRotation: 0, autoSkip: true } , grid: { color: '#262b33' } },
          y: { beginAtZero: true, suggestedMax: maxUn * 1.2, ticks: { color: '#ffe600', precision: 0 }, grid: { color: '#262b33' }, title: { display: true, text: 'unidades', color: '#ffe600' } },
          y2: { display: !semVis, beginAtZero: true, position: 'right', ticks: { color: '#4da3ff' }, grid: { display: false }, title: { display: true, text: 'visitas', color: '#4da3ff' } } } },
    });
  }
}

(async () => {
  const id = new URLSearchParams(location.search).get('item');
  const app = document.getElementById('app');
  if (!id) { app.innerHTML = '<div class="erro">Abra pela foto de uma venda na Tela Telegram (falta o código do anúncio).</div>'; return; }
  const d = await DB.getRaioXAnuncio(id);
  if (!d || d.error) { app.innerHTML = `<div class="erro">Não consegui carregar o anúncio ${esc(id)}.<br>${esc(d?.error || DB.lastError || '')}</div>`; return; }
  render(d);
})();
</script>
</body>
</html>
