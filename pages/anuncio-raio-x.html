<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raio-X do anúncio</title>
<!-- Raio-X do anúncio (v189): aberto em ABA NOVA pela foto da "Nova venda!" na
     Tela Telegram (?item=MLB...). Só leitura: DB.getRaioXAnuncio → /api/bi/analista-ecom/item/:id/raio-x
     (banco, nenhuma chamada ao ML). Contas em server/src/raioX.js. -->
<style>
  :root { --primary:#FFE600; --bg:#14171c; --card:#1f232b; --card2:#272c35; --txt:#f0f0f0; --muted:#8d96a3; --border:#323844;
          --green:#2ecc71; --red:#e74c3c; --yellow:#f5c518; --blue:#4da3ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; }
  .wrap { max-width:1180px; margin:0 auto; padding:22px 18px 40px; }
  .topo { display:flex; gap:20px; align-items:center; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:18px; }
  .topo img { width:120px; height:120px; object-fit:contain; background:#fff; border-radius:12px; flex:none; }
  .topo h1 { font-size:21px; margin:0 0 8px; line-height:1.3; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; font-size:13px; }
  .chip { background:var(--card2); border:1px solid var(--border); border-radius:20px; padding:4px 11px; color:var(--muted); }
  .chip b { color:var(--txt); }
  .chip a { color:var(--blue); text-decoration:none; }
  .resumo { margin:16px 0; background:rgba(255,230,0,.07); border:1px solid rgba(255,230,0,.35); border-radius:14px; padding:14px 18px; font-size:15px; line-height:1.7; }
  .resumo b { color:var(--primary); }
  .kpis { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; }
  .kpi { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; }
  .kpi .l { font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); font-weight:700; }
  .kpi .v { font-size:30px; font-weight:900; margin:6px 0 2px; }
  .kpi .s { font-size:12.5px; color:var(--muted); line-height:1.5; }
  .up { color:var(--green); } .down { color:var(--red); } .flat { color:var(--yellow); }
  .nivel-urgente, .nivel-sem_estoque { border-color:var(--red); } .nivel-urgente .v, .nivel-sem_estoque .v { color:var(--red); }
  .nivel-atencao { border-color:var(--yellow); } .nivel-atencao .v { color:var(--yellow); }
  .nivel-ok .v { color:var(--green); }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin:24px 0 10px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; font-size:14px; }
  th, td { padding:11px 14px; text-align:right; border-bottom:1px solid var(--border); }
  th { font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); background:var(--card2); }
  th:first-child, td:first-child { text-align:left; }
  tr:last-child td { border-bottom:none; }
  td.j { font-weight:800; }
  .barra { display:inline-block; height:8px; border-radius:4px; background:var(--primary); vertical-align:middle; margin-left:8px; opacity:.8; }
  .graf { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; height:290px; }
  .nota { font-size:12px; color:var(--muted); margin-top:10px; line-height:1.6; }
  .erro { padding:60px 20px; text-align:center; color:var(--muted); }
  @media (max-width:820px) { .kpis { grid-template-columns:repeat(2,minmax(0,1fr)); } .topo { flex-direction:column; align-items:flex-start; } }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="erro">Carregando…</div></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="../js/db.js"></script>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const num = (n) => Number(n || 0).toLocaleString('pt-BR');
const brl = (n) => Number(n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const pct = (n) => Number(n).toLocaleString('pt-BR', { maximumFractionDigits: 1 });
const dataBR = (iso) => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) : '—';

function seta(t) {
  if (!t || t.direcao === 'sem_dados') return { cls: 'flat', txt: '—', s: 'sem vendas nas 2 semanas' };
  if (t.direcao === 'subindo') return { cls: 'up', txt: t.pct == null ? '▲ novo' : `▲ ${pct(t.pct)}%`, s: `${t.atual} un. × ${t.anterior} un. antes` };
  if (t.direcao === 'caindo') return { cls: 'down', txt: `▼ ${pct(Math.abs(t.pct))}%`, s: `${t.atual} un. × ${t.anterior} un. antes` };
  return { cls: 'flat', txt: `● ${t.pct > 0 ? '+' : ''}${pct(t.pct)}%`, s: `estável · ${t.atual} un. × ${t.anterior} un.` };
}

function render(d) {
  const it = d.item, c = d.cobertura || {}, p = d.previsao, t7 = seta(d.tendencia.unidades_7), t15 = seta(d.tendencia.unidades_15), tv = seta(d.tendencia.visitas_7);
  document.title = `Raio-X · ${it.title}`;
  const maxUn = Math.max(1, ...d.janelas.map((j) => j.unidades / j.dias));
  const cobTxt = c.nivel === 'sem_estoque' ? 'SEM ESTOQUE' : c.dias == null ? '—' : `${Math.round(c.dias)} dias`;
  const cobSub = c.nivel === 'sem_estoque' ? 'repor agora' : c.dias == null ? 'sem vendas recentes — estoque parado'
    : `${num(c.estoque)} un. em estoque · acaba ~${dataBR(c.acaba_em)}`;
  const j7 = d.janelas.find((j) => j.dias === 7) || {};
  document.getElementById('app').innerHTML = `
    <div class="topo">
      ${it.thumbnail ? `<img src="${esc(it.thumbnail)}" alt="">` : ''}
      <div>
        <h1>${esc(it.title)}</h1>
        <div class="chips">
          <span class="chip">🏪 <b>${esc(it.loja || '—')}</b></span>
          <span class="chip">💰 <b>${brl(it.price)}</b></span>
          <span class="chip">📦 Estoque <b>${num(it.available_quantity)}</b></span>
          <span class="chip">${esc(it.ml_id)}</span>
          ${it.permalink ? `<span class="chip"><a href="${esc(it.permalink)}" target="_blank" rel="noopener">Ver no Mercado Livre ↗</a></span>` : ''}
        </div>
      </div>
    </div>
    <div class="resumo">🧠 ${d.frases.map((f) => esc(f).replace(/(\d+(?:,\d+)?%|~\d+ (?:dias|unidades))/g, '<b>$1</b>')).join('<br>🧠 ')}</div>
    <div class="kpis">
      <div class="kpi"><div class="l">Tendência · 7 dias</div><div class="v ${t7.cls}">${t7.txt}</div><div class="s">${t7.s}<br>15 dias: <span class="${t15.cls}">${t15.txt}</span></div></div>
      <div class="kpi nivel-${c.nivel || 'ok'}"><div class="l">Dias para repor</div><div class="v">${cobTxt}</div><div class="s">${cobSub}</div></div>
      <div class="kpi"><div class="l">Previsão de vendas</div><div class="v">${num(p.d7)} <span style="font-size:15px;color:var(--muted)">un. / 7 dias</span></div><div class="s">15 dias: <b>${num(p.d15)}</b> · 30 dias: <b>${num(p.d30)}</b><br>~${String(p.por_dia).replace('.', ',')} un. por dia</div></div>
      <div class="kpi"><div class="l">Conversão · 7 dias</div><div class="v">${j7.conversao == null ? '—' : String(j7.conversao).replace('.', ',') + '%'}</div><div class="s">${num(j7.visitas)} visitas · ${num(j7.pedidos)} vendas<br>visitas: <span class="${tv.cls}">${tv.txt}</span></div></div>
    </div>
    <h2>Vendas, visitas e conversão por período</h2>
    <table>
      <thead><tr><th>Período</th><th>Vendas</th><th>Unidades</th><th>Visitas</th><th>Conversão</th><th>Média / dia</th></tr></thead>
      <tbody>${d.janelas.map((j) => `<tr><td class="j">Últimos ${j.dias} dias</td><td>${num(j.pedidos)}</td><td>${num(j.unidades)}</td><td>${num(j.visitas)}</td>
        <td>${j.conversao == null ? '—' : String(j.conversao).replace('.', ',') + '%'}</td>
        <td>${String(j.media_dia).replace('.', ',')}<span class="barra" style="width:${Math.round((j.unidades / j.dias) / maxUn * 70)}px"></span></td></tr>`).join('')}</tbody>
    </table>
    <h2>Últimos 30 dias, dia a dia</h2>
    <div class="graf"><canvas id="graf"></canvas></div>
    <div class="nota">Vendas e visitas de cada período incluem hoje. Conversão, média por dia, tendência e previsão usam só dias fechados (até ontem), porque as visitas de hoje entram no sistema amanhã.
      Previsão = 60% da média dos últimos 7 dias + 40% da média dos últimos 30. Tendência compara com o mesmo número de dias logo antes (±10% = estável).</div>`;
  if (window.Chart) {
    const dias = d.dias;
    new Chart(document.getElementById('graf'), {
      data: { labels: dias.map((x) => dataBR(x.data)), datasets: [
        { type: 'bar', label: 'Unidades vendidas', data: dias.map((x) => x.unidades), backgroundColor: 'rgba(255,230,0,.75)', yAxisID: 'y', borderRadius: 4 },
        { type: 'line', label: 'Visitas', data: dias.map((x, i) => (i === dias.length - 1 ? null : x.visitas)), spanGaps: false, borderColor: '#4da3ff', backgroundColor: '#4da3ff', yAxisID: 'y2', tension: .3, pointRadius: 2 },
      ] },
      options: { maintainAspectRatio: false, plugins: { legend: { labels: { color: '#c9d1d9' } } },
        scales: { x: { ticks: { color: '#8d96a3', maxRotation: 0, autoSkip: true } , grid: { color: '#262b33' } },
          y: { beginAtZero: true, ticks: { color: '#ffe600', precision: 0 }, grid: { color: '#262b33' }, title: { display: true, text: 'unidades', color: '#ffe600' } },
          y2: { beginAtZero: true, position: 'right', ticks: { color: '#4da3ff' }, grid: { display: false }, title: { display: true, text: 'visitas', color: '#4da3ff' } } } },
    });
  }
}

(async () => {
  const id = new URLSearchParams(location.search).get('item');
  const app = document.getElementById('app');
  if (!id) { app.innerHTML = '<div class="erro">Abra pela foto de uma venda na Tela Telegram (falta o código do anúncio).</div>'; return; }
  const d = await DB.getRaioXAnuncio(id);
  if (!d || d.error) { app.innerHTML = `<div class="erro">Não consegui carregar o anúncio ${esc(id)}.<br>${esc(d?.error || DB.lastError || '')}</div>`; return; }
  render(d);
})();
</script>
</body>
</html>
