<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anúncios Problema — ML Dashboard</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/cards.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>window.PAGE_TITLE='Anúncios com Problema'; window.ACTIVE_NAV='anuncios-problema.html';</script>
</head>
<body>
<div class="app-container">
  <div id="app-sidebar"></div>
  <main class="main-content">
    <div id="app-topbar"></div>
    <div class="content-area">
      <div class="card-grid">
        <div class="stat-card"><div class="label">Sem Vendas (30d)</div><div class="value" id="semVendas" style="color:var(--orange)">—</div></div>
        <div class="stat-card"><div class="label">Reputação Baixa</div><div class="value" id="repBaixa" style="color:var(--red)">—</div></div>
        <div class="stat-card"><div class="label">Sem Imagem/Descrição</div><div class="value" id="semInfo" style="color:var(--orange)">—</div></div>
        <div class="stat-card"><div class="label">Preço Fora do Mercado</div><div class="value" id="precoAlto" style="color:var(--red)">—</div></div>
      </div>
      <div class="card">
        <div class="card-header">
          <h3>Anúncios com Problemas</h3>
          <select class="filter-select" id="tipoFilter">
            <option value="">Todos</option>
            <option value="no_sales">Sem vendas</option>
            <option value="low_reputation">Reputação baixa</option>
            <option value="missing_info">Info incompleta</option>
            <option value="price">Preço fora do mercado</option>
          </select>
        </div>
        <div class="table-responsive">
          <table class="data-table">
            <thead><tr><th>Anúncio</th><th>Problema</th><th>Gravidade</th><th>Sugestão</th></tr></thead>
            <tbody id="probTable"><tr><td colspan="5" class="empty-state">Carregando...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="../js/db.js"></script>
<script src="../js/websocket.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/sidebar.js"></script>
<script>
const tipoLabel = { no_sales:'Sem vendas', low_reputation:'Reputação baixa', missing_info:'Info incompleta', price:'Preço fora do mercado' };
async function load() {
  const tipo = document.getElementById('tipoFilter').value;
  const data = await DB.getAnunciosProblema() || { items:[], summary:{} };
  const s = data.summary || {};
  document.getElementById('semVendas').textContent = s.no_sales ?? '—';
  document.getElementById('repBaixa').textContent = s.low_reputation ?? '—';
  document.getElementById('semInfo').textContent = s.missing_info ?? '—';
  document.getElementById('precoAlto').textContent = s.price ?? '—';
  let rows = data.items || [];
  if (tipo) rows = rows.filter(r=>r.problem_type===tipo);
  document.getElementById('probTable').innerHTML = rows.length
    ? rows.map(r=>`<tr>
        <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.title}</td>
        <td>${tipoLabel[r.problem_type]||r.problem_type}</td>
        <td><span class="tag ${r.severity==='high'?'red':'yellow'}">${r.severity==='high'?'Alta':'Média'}</span></td>
        <td style="font-size:12px;color:var(--text-muted)">${r.suggestion||'—'}</td>
      </tr>`).join('')
    : '<tr><td colspan="5" class="empty-state">Nenhum problema encontrado</td></tr>';
}
document.getElementById('tipoFilter').addEventListener('change', load);
WS.on('anuncio_updated', load);
WS.on('_connected', ()=>{ const el=document.getElementById('wsStatus'); if(el) el.innerHTML='<i class="fas fa-circle" style="color:var(--green);font-size:8px"></i> ao vivo'; });
load();
</script>
</body>
</html>
