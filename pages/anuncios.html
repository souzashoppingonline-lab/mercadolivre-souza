<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anúncios — ML Dashboard</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/cards.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>window.PAGE_TITLE='Anúncios'; window.ACTIVE_NAV='anuncios.html';</script>
  <style>
    .store-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .store-tab {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;
      border: 1px solid var(--border); background: var(--card-bg); color: var(--text-muted);
      transition: all 0.2s;
    }
    .store-tab:hover { border-color: var(--primary); color: var(--text-primary); }
    .store-tab.active { background: var(--primary); color: #000; border-color: var(--primary); }
    .store-tab .tab-avatar {
      width: 22px; height: 22px; border-radius: 50%;
      background: rgba(0,0,0,0.2); display: flex; align-items: center;
      justify-content: center; font-size: 9px; font-weight: 800;
    }
    .store-tab.active .tab-avatar { background: rgba(0,0,0,0.25); }
    .store-section { display: none; }
    .store-section.active { display: block; }
    .section-title-bar {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
    }
    .section-avatar {
      width: 36px; height: 36px; border-radius: 10px;
      background: rgba(39,174,96,0.2); color: var(--green);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 800;
    }
  </style>
</head>
<body>
<div class="app-container">
  <div id="app-sidebar"></div>
  <main class="main-content">
    <div id="app-topbar"></div>
    <div class="content-area">
      <div class="store-tabs" id="storeTabs">
        <div class="store-tab active" data-store="" data-name="Todas as lojas">
          <i class="fas fa-store" style="font-size:12px"></i> Todas as lojas
        </div>
      </div>
      <div id="storeContent"></div>
    </div>
  </main>
</div>
<script src="../js/db.js"></script>
<script src="../js/websocket.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/sidebar.js"></script>
<script>
const fmt = v => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);
const fmtDt = d => d ? new Date(d).toLocaleString('pt-BR') : '—';

function initials(name) {
  return (name||'?').replace(/[_-]/g,' ').split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
}

function buildSection(storeId, storeName) {
  const id = storeId || 'all';
  return `
    <div class="store-section ${id === 'all' ? 'active' : ''}" id="section-${id}">
      ${storeId ? `
      <div class="section-title-bar">
        <div class="section-avatar">${initials(storeName)}</div>
        <div>
          <div style="font-weight:700;font-size:15px">${storeName}</div>
          <div style="font-size:11px;color:var(--text-muted)">ID: ${storeId}</div>
        </div>
      </div>` : ''}
      <div class="card-grid" style="margin-bottom:16px">
        <div class="stat-card"><div class="label">Total</div><div class="value" id="total-${id}">—</div></div>
        <div class="stat-card"><div class="label">Ativos</div><div class="value" id="active-${id}" style="color:var(--green)">—</div></div>
        <div class="stat-card"><div class="label">Pausados</div><div class="value" id="paused-${id}" style="color:var(--orange)">—</div></div>
        <div class="stat-card"><div class="label">Encerrados</div><div class="value" id="closed-${id}" style="color:var(--red)">—</div></div>
      </div>
      <div class="card">
        <div class="card-header">
          <h3>Anúncios${storeName && id !== 'all' ? ' — ' + storeName : ''}</h3>
          <div class="filters-bar" style="margin:0">
            <div class="search-box"><i class="fas fa-search"></i><input type="text" id="search-${id}" placeholder="Buscar..."></div>
            <select class="filter-select" id="status-${id}">
              <option value="">Todos</option>
              <option value="active">Ativo</option>
              <option value="paused">Pausado</option>
              <option value="closed">Encerrado</option>
            </select>
          </div>
        </div>
        <div class="table-responsive">
          <table class="data-table">
            <thead><tr><th>#</th><th>Título</th><th>Preço</th><th>Estoque</th><th>Vendas</th><th>Status</th><th>Atualizado</th></tr></thead>
            <tbody id="tbody-${id}"><tr><td colspan="7" class="empty-state">Carregando...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>`;
}

async function loadSection(storeId) {
  const id = storeId || 'all';
  const status = document.getElementById(`status-${id}`)?.value || '';
  const search = document.getElementById(`search-${id}`)?.value || '';
  const data = await DB.getAnuncios({ status, search, store_id: storeId }) || { results: [], summary: {} };
  const s = data.summary || {};
  const set = (elId, val) => { const el = document.getElementById(elId); if (el) el.textContent = val ?? '—'; };
  set(`total-${id}`, s.total);
  set(`active-${id}`, s.active);
  set(`paused-${id}`, s.paused);
  set(`closed-${id}`, s.closed);
  const tbody = document.getElementById(`tbody-${id}`);
  if (!tbody) return;
  const rows = data.results || [];
  tbody.innerHTML = rows.length ? rows.map(r => `
    <tr>
      <td style="font-size:11px;color:var(--text-muted)">${r.ml_id}</td>
      <td>${r.title}</td>
      <td>${fmt(r.price)}</td>
      <td>${r.available_quantity ?? '—'}</td>
      <td>${r.sold_quantity ?? '—'}</td>
      <td><span class="badge ${r.status}">${r.status === 'active' ? 'Ativo' : r.status === 'paused' ? 'Pausado' : 'Encerrado'}</span></td>
      <td>${fmtDt(r.updated_at)}</td>
    </tr>`).join('')
    : '<tr><td colspan="7" class="empty-state">Nenhum anúncio encontrado</td></tr>';
}

function switchTab(storeId) {
  document.querySelectorAll('.store-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.store-section').forEach(s => s.classList.remove('active'));
  const id = storeId || 'all';
  document.querySelector(`.store-tab[data-store="${storeId}"]`)?.classList.add('active');
  document.getElementById(`section-${id}`)?.classList.add('active');
  loadSection(storeId);
}

async function init() {
  const data = await DB.getLojas() || { stores: [] };
  const stores = data.stores || [];
  const tabs = document.getElementById('storeTabs');
  const content = document.getElementById('storeContent');

  // Build "all" section
  content.innerHTML = buildSection('', 'Todas as lojas');

  // Build per-store tabs and sections
  stores.forEach(s => {
    const tab = document.createElement('div');
    tab.className = 'store-tab';
    tab.dataset.store = s.id;
    tab.dataset.name = s.nickname;
    tab.innerHTML = `<span class="tab-avatar">${initials(s.nickname)}</span>${s.nickname}`;
    tab.addEventListener('click', () => switchTab(s.id));
    tabs.appendChild(tab);
    content.insertAdjacentHTML('beforeend', buildSection(s.id, s.nickname));

    document.getElementById(`search-${s.id}`)?.addEventListener('input', () => loadSection(s.id));
    document.getElementById(`status-${s.id}`)?.addEventListener('change', () => loadSection(s.id));
  });

  // Bind "all" section filters
  document.getElementById('search-all')?.addEventListener('input', () => loadSection(''));
  document.getElementById('status-all')?.addEventListener('change', () => loadSection(''));

  // First tab click on "Todas"
  document.querySelector('.store-tab[data-store=""]')?.addEventListener('click', () => switchTab(''));

  // Load active tab
  const activeStore = localStorage.getItem('ml_active_store') || '';
  if (activeStore && stores.find(s => String(s.id) === activeStore)) {
    switchTab(activeStore);
  } else {
    loadSection('');
  }
}

WS.on('anuncio_updated', () => {
  const activeTab = document.querySelector('.store-tab.active');
  loadSection(activeTab?.dataset.store || '');
});
WS.on('_connected', () => {
  const el = document.getElementById('wsStatus');
  if (el) el.innerHTML = '<i class="fas fa-circle" style="color:var(--green);font-size:8px"></i> ao vivo';
});

window.addEventListener('storeChanged', e => switchTab(e.detail.storeId));
init();
</script>
</body>
</html>
