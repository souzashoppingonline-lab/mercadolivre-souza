<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inteligência de Margem — Portfólio</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/cards.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>window.PAGE_TITLE='Inteligência de Margem'; window.ACTIVE_NAV='bi-margem.html';</script>
  <style>
    .bi-sub { font-size:13px; color:var(--text-muted); margin:-8px 0 16px; }
    .im-filters { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
    .im-filters select { background:var(--bg-card2); color:var(--text-main); border:1px solid var(--border); border-radius:10px; padding:9px 12px; font-size:13px; }
    .im-status { font-size:12px; color:var(--text-muted); margin-left:auto; }
    .im-tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:5px; }
    .im-tab { background:transparent; border:0; color:var(--text-muted); padding:9px 16px; border-radius:9px; font-size:12.5px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:7px; white-space:nowrap; text-decoration:none; }
    .im-tab.on { background:#8b5cf6; color:#fff; }
    .im-tab .n { background:rgba(255,255,255,.2); border-radius:999px; padding:0 6px; font-size:10.5px; }
    .im-tab.on .n { background:rgba(255,255,255,.3); }
    .im-tab:not(.on) .n { background:var(--bg-card2); }
    .bi-kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-bottom:16px; }
    .bi-kpi { background:var(--bg-card); border:1px solid var(--border); border-radius:14px; padding:15px 17px; border-left:4px solid #8b5cf6; }
    .bi-kpi .k { font-size:11px; color:var(--text-muted); font-weight:700; text-transform:uppercase; letter-spacing:.3px; }
    .bi-kpi .v { font-size:23px; font-weight:900; margin-top:6px; }
    .im-card { background:var(--bg-card); border:1px solid var(--border); border-radius:14px; padding:16px 18px; margin-bottom:16px; }
    .im-card h3 { font-size:14.5px; font-weight:800; margin:0 0 12px; display:flex; align-items:center; gap:8px; }
    .im-card .hint { font-size:11.5px; color:var(--text-muted); font-weight:500; margin-left:auto; }
    .im-bars { display:flex; flex-direction:column; gap:9px; }
    .im-bar-row { display:grid; grid-template-columns:90px 1fr 190px; gap:10px; align-items:center; font-size:12.5px; }
    @media(max-width:640px){ .im-bar-row { grid-template-columns:70px 1fr; } .im-bar-row .num { grid-column:1/-1; text-align:left; } }
    .im-bar-track { height:16px; border-radius:8px; background:var(--bg-card2); overflow:hidden; }
    .im-bar-fill { height:100%; border-radius:8px; }
  </style>
</head>
<body>
<div class="app-container">
  <div id="app-sidebar"></div>
  <main class="main-content">
    <div id="app-topbar"></div>
    <div class="content-area">
      <p class="bi-sub">Motor determinístico — nenhum número aqui é estimado por IA. Limiares/fórmulas em <code>business-rules.md</code>.</p>

      <div class="im-filters">
        <select id="imDays">
          <option value="7">Últimos 7 dias</option>
          <option value="30" selected>Últimos 30 dias</option>
          <option value="60">Últimos 60 dias</option>
          <option value="90">Últimos 90 dias</option>
        </select>
        <select id="imLoja"><option value="">Todas as empresas</option></select>
        <button class="btn-primary" onclick="carregar()"><i class="fas fa-sync"></i> Atualizar</button>
        <span class="im-status" id="imStatus"></span>
      </div>

      <div class="im-tabs" id="imTabs"></div>

      <div class="bi-kpis" id="imConcentracao"></div>
      <div class="im-card">
        <h3><i class="fas fa-chart-pie"></i> % do faturamento por faixa de margem <span class="hint">quanto do faturamento vem de produtos com margem perigosa</span></h3>
        <div class="im-bars" id="imBandas"></div>
      </div>
    </div>
  </main>
</div>

<script src="../js/db.js"></script>
<script src="../js/layout-bi.js"></script>
<script src="../js/sidebar.js"></script>
<script src="../js/biMargemTabs.js"></script>
<script>
const BRL = n => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n)||0);
const INT = n => new Intl.NumberFormat('pt-BR').format(Number(n)||0);
const PCT1 = n => `${(Number(n)||0).toFixed(1)}%`;
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dataBR = iso => { if(!iso) return '—'; const [y,m,d]=String(iso).slice(0,10).split('-'); return `${d}/${m}/${y}`; };

let DADOS = null;

async function popularLojas(selecionado){
  try{ const d=await DB.getLojas(); const sel=document.getElementById('imLoja');
    (d.stores||[]).forEach(s=>{ const o=document.createElement('option'); o.value=s.id; o.textContent=s.nickname; sel.appendChild(o); });
    if (selecionado) sel.value = selecionado;
  }catch(e){}
}

function atualizarTabs(){ document.getElementById('imTabs').innerHTML = renderBiMargemTabs('bi-margem-portfolio.html'); }

async function carregar(){
  atualizarTabs();
  document.getElementById('imStatus').textContent = 'Carregando…';
  const d = await DB.getBiMargem(document.getElementById('imDays').value, document.getElementById('imLoja').value);
  if(!d || d.error){ document.getElementById('imStatus').innerHTML = `<span style="color:var(--red)">Erro: ${esc(d&&d.error||'sem resposta')}</span>`; return; }
  DADOS = d;
  document.getElementById('imStatus').textContent = `${INT(d.produtos.length)} anúncio(s) no período · ${d.periodo.dias} dia(s), de ${dataBR(d.periodo.de)} a ${dataBR(d.periodo.ate)}.`;
  atualizarTabs();
  renderPortfolio();
}

function renderPortfolio(){
  const c = DADOS.concentracao;
  document.getElementById('imConcentracao').innerHTML = `
    <div class="bi-kpi"><div class="k">Total de anúncios ativos</div><div class="v">${INT(c.total_skus)}</div></div>
    <div class="bi-kpi"><div class="k">Top 10 — % do faturamento</div><div class="v">${PCT1(c.top10_pct_faturamento)}</div></div>
    <div class="bi-kpi"><div class="k">Top 10 — % do lucro</div><div class="v">${PCT1(c.top10_pct_lucro)}</div></div>`;
  const max = Math.max(...DADOS.bandas_margem.map(b => b.pct_faturamento), 1);
  const CORES = ['#f87171','#f59e0b','#eab308','#60a5fa','#3fb950','#22c55e'];
  document.getElementById('imBandas').innerHTML = DADOS.bandas_margem.map((b,i) => `
    <div class="im-bar-row">
      <span>${esc(b.faixa)}</span>
      <span class="im-bar-track"><span class="im-bar-fill" style="width:${(b.pct_faturamento/max*100).toFixed(1)}%;background:${CORES[i]}"></span></span>
      <span class="num">${BRL(b.faturamento)} · ${PCT1(b.pct_faturamento)} · ${INT(b.qtd_skus)} anúncio(s)</span>
    </div>`).join('');
}

const qInit = biMargemQueryAtual();
document.getElementById('imDays').value = qInit.days;
popularLojas(qInit.store_id).then(carregar);
atualizarTabs();
</script>
</body>
</html>
