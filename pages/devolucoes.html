<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devoluções — ML Dashboard</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/cards.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>window.PAGE_TITLE='Devoluções'; window.ACTIVE_NAV='devolucoes.html';</script>
</head>
<body>
<div class="app-container">
  <div id="app-sidebar"></div>
  <main class="main-content">
    <div id="app-topbar"></div>
    <div class="content-area">
      <div class="card-grid">
        <div class="stat-card"><div class="label">Em Análise</div><div class="value" id="analise" style="color:var(--orange)">—</div></div>
        <div class="stat-card"><div class="label">Aprovadas</div><div class="value" id="aprovadas" style="color:var(--green)">—</div></div>
        <div class="stat-card"><div class="label">Rejeitadas</div><div class="value" id="rejeitadas" style="color:var(--red)">—</div></div>
        <div class="stat-card"><div class="label">Valor Total</div><div class="value" id="valorTotal">—</div></div>
      </div>
      <div class="card">
        <div class="card-header"><h3>Solicitações de Devolução</h3></div>
        <div class="table-responsive">
          <table class="data-table">
            <thead><tr><th>Pedido</th><th>Produto</th><th>Motivo</th><th>Valor</th><th>Status</th><th>Data</th></tr></thead>
            <tbody id="devTable"><tr><td colspan="6" class="empty-state">Carregando...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="../js/db.js"></script>
<script src="../js/websocket.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/sidebar.js"></script>
<script>
const fmt = v => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);
const fmtD = d => d ? new Date(d).toLocaleDateString('pt-BR') : '—';
const statusMap = { analysis:{l:'Em Análise',c:'paused'}, approved:{l:'Aprovada',c:'active'}, rejected:{l:'Rejeitada',c:'closed'} };
async function load() {
  const data = await DB.getDevolucoes() || { items:[], summary:{} };
  const s = data.summary || {};
  document.getElementById('analise').textContent = s.in_analysis ?? '—';
  document.getElementById('aprovadas').textContent = s.approved ?? '—';
  document.getElementById('rejeitadas').textContent = s.rejected ?? '—';
  document.getElementById('valorTotal').textContent = fmt(s.total_value);
  const rows = data.items || [];
  document.getElementById('devTable').innerHTML = rows.length
    ? rows.map(r=>{ const st=statusMap[r.status]||{l:r.status,c:''}; return `<tr>
        <td style="font-size:11px">#${r.order_id}</td>
        <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.title}</td>
        <td>${r.reason||'—'}</td><td>${fmt(r.amount)}</td>
        <td><span class="badge ${st.c}">${st.l}</span></td><td>${fmtD(r.date)}</td>
      </tr>`; }).join('')
    : '<tr><td colspan="6" class="empty-state">Nenhuma devolução</td></tr>';
}
WS.on('order_updated', load);
WS.on('_connected', ()=>{ const el=document.getElementById('wsStatus'); if(el) el.innerHTML='<i class="fas fa-circle" style="color:var(--green);font-size:8px"></i> ao vivo'; });
load();
</script>
</body>
</html>
