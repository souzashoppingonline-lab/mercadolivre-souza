<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devoluções — ML Dashboard</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/cards.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>window.PAGE_TITLE='Devoluções'; window.ACTIVE_NAV='devolucoes.html';</script>
  <style>
    .note-cell { display:flex; align-items:center; gap:6px; min-width:180px; }
    .note-input { flex:1; background:var(--bg-card); border:1px solid var(--border); border-radius:6px; color:var(--text-main); padding:4px 8px; font-size:.8rem; }
    .note-input:focus { outline:none; border-color:var(--primary); }
    .btn-save-note { background:var(--primary); color:#000; border:none; border-radius:6px; padding:4px 10px; font-size:.75rem; font-weight:700; cursor:pointer; white-space:nowrap; }
    .btn-save-note:hover { opacity:.85; }
    .saved-note { font-size:.78rem; color:var(--text-muted); font-style:italic; }
    .periodo-btn.active { background:var(--primary) !important; color:#000 !important; border-color:var(--primary) !important; }
    .dev-modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .dev-modal-backdrop.open { display: flex; }
    .dev-modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 720px; padding: 18px; }
    .dev-modal h3 { font-size: 14px; font-weight: 800; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
    .dev-modal h3 .close { cursor: pointer; color: var(--text-muted); }
    .dev-modal video { width: 100%; border-radius: 10px; background: #000; max-height: 70vh; }
    .dev-modal.detail { max-width: 640px; max-height: 85vh; overflow-y: auto; }
    .dev-detail-head { display: flex; gap: 14px; align-items: center; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    .dev-detail-head img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; background: var(--bg-card2); flex-shrink: 0; }
    .dev-detail-head .prod-title { font-size: .95rem; font-weight: 700; }
    .dev-detail-head .prod-sub { font-size: .78rem; color: var(--text-muted); margin-top: 2px; }
    .dev-detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; margin-bottom: 16px; }
    .dev-detail-item .lbl { font-size: .68rem; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted); margin-bottom: 2px; }
    .dev-detail-item .val { font-size: .85rem; font-weight: 600; }
    .dev-detail-item .val.big { font-size: 1.1rem; color: var(--primary); }
    .dev-detail-section { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
    .dev-detail-section h4 { font-size: .8rem; margin-bottom: 8px; color: var(--text-muted); }
    .dev-raw-toggle { cursor: pointer; font-size: .75rem; color: var(--primary); margin-top: 14px; display: inline-block; }
    .dev-raw-json { display: none; background: var(--bg-card2); border-radius: 8px; padding: 10px; font-size: .68rem; font-family: monospace; white-space: pre-wrap; word-break: break-all; max-height: 260px; overflow-y: auto; margin-top: 8px; }
    .dev-raw-json.open { display: block; }
    .dev-player-row { display: flex; align-items: center; gap: 8px; font-size: .8rem; padding: 4px 0; }
    .dev-player-row .role-tag { background: var(--bg-card2); border-radius: 6px; padding: 2px 8px; font-size: .68rem; font-weight: 700; text-transform: uppercase; }
  </style>
</head>
<body>
<div class="app-container">
  <div id="app-sidebar"></div>
  <main class="main-content">
    <div id="app-topbar"></div>
    <div class="content-area">

      <div class="filters-row" style="margin-bottom:16px">
        <div class="search-box" style="flex:1;max-width:400px">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="Buscar por ID do pedido, comprador ou produto...">
        </div>
        <button class="btn-save-note" style="padding:8px 18px;font-size:.85rem" onclick="load()">Buscar</button>
        <button class="btn-save-note" id="btnSync" style="padding:8px 18px;font-size:.85rem;background:var(--bg-card);color:var(--text-main);border:1px solid var(--border)" onclick="syncRetroativo()">
          <i class="fas fa-sync-alt"></i> Importar histórico ML
        </button>
      </div>

      <div class="filters-row" style="margin-bottom:16px">
        <select id="filtroLoja" class="btn-save-note" style="background:var(--bg-card);color:var(--text-main);border:1px solid var(--border);font-weight:400;padding:8px 12px" onchange="load()">
          <option value="">Todas as lojas</option>
        </select>
        <div id="periodoBtns" style="display:flex;gap:6px">
          <button class="btn-save-note periodo-btn" data-periodo="hoje" style="background:var(--bg-card);color:var(--text-main);border:1px solid var(--border);padding:8px 14px;font-size:.8rem" onclick="setPeriodo('hoje')">Hoje</button>
          <button class="btn-save-note periodo-btn" data-periodo="ontem" style="background:var(--bg-card);color:var(--text-main);border:1px solid var(--border);padding:8px 14px;font-size:.8rem" onclick="setPeriodo('ontem')">Ontem</button>
          <button class="btn-save-note periodo-btn" data-periodo="7" style="background:var(--bg-card);color:var(--text-main);border:1px solid var(--border);padding:8px 14px;font-size:.8rem" onclick="setPeriodo(7)">7 dias</button>
          <button class="btn-save-note periodo-btn" data-periodo="15" style="background:var(--bg-card);color:var(--text-main);border:1px solid var(--border);padding:8px 14px;font-size:.8rem" onclick="setPeriodo(15)">15 dias</button>
          <button class="btn-save-note periodo-btn" data-periodo="30" style="background:var(--bg-card);color:var(--text-main);border:1px solid var(--border);padding:8px 14px;font-size:.8rem" onclick="setPeriodo(30)">30 dias</button>
          <button class="btn-save-note periodo-btn" data-periodo="" style="background:var(--bg-card);color:var(--text-main);border:1px solid var(--border);padding:8px 14px;font-size:.8rem" onclick="setPeriodo('')">Tudo</button>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <span style="font-size:.75rem;color:var(--text-muted)">De</span>
          <input type="date" id="dataDe" class="note-input" style="max-width:150px" onchange="setPeriodoCustom()">
          <span style="font-size:.75rem;color:var(--text-muted)">Até</span>
          <input type="date" id="dataAte" class="note-input" style="max-width:150px" onchange="setPeriodoCustom()">
        </div>
      </div>

      <div class="card-grid" style="margin-bottom:16px">
        <div class="stat-card"><div class="label">Total</div><div class="value" id="kpi-total">—</div></div>
        <div class="stat-card"><div class="label"><i class="fas fa-clock" style="color:var(--orange)"></i> Em Análise</div><div class="value" id="kpi-analise" style="color:var(--orange)">—</div></div>
        <div class="stat-card"><div class="label"><i class="fas fa-check" style="color:var(--green)"></i> Aprovadas</div><div class="value" id="kpi-aprovadas" style="color:var(--green)">—</div></div>
        <div class="stat-card"><div class="label"><i class="fas fa-times" style="color:var(--red)"></i> Rejeitadas</div><div class="value" id="kpi-rejeitadas" style="color:var(--red)">—</div></div>
        <div class="stat-card"><div class="label">Valor Total</div><div class="value" id="kpi-valor">—</div></div>
        <div class="stat-card" style="border-color:var(--red)"><div class="label"><i class="fas fa-hand-holding-usd" style="color:var(--red)"></i> Prejuízo Total <span style="font-weight:400">(no período filtrado)</span></div><div class="value" id="kpi-prejuizo" style="color:var(--red)">—</div><div class="sub" id="kpi-prejuizo-qtd">—</div></div>
      </div>

      <div class="card">
        <div class="card-header"><h3>Solicitações de Devolução</h3></div>
        <div class="table-responsive">
          <table class="data-table">
            <thead><tr><th>Pedido</th><th>Loja</th><th>Comprador</th><th>Produto</th><th>Motivo</th><th>Valor</th><th>Status</th><th>Data</th><th>Vídeo</th><th>Prejuízo (R$)</th><th>Observação</th></tr></thead>
            <tbody id="devTable"><tr><td colspan="11" class="empty-state">Carregando...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="dev-modal-backdrop" id="devVideoBackdrop">
  <div class="dev-modal">
    <h3>Vídeo da embalagem <span class="close" onclick="closeDevVideo()"><i class="fas fa-times"></i></span></h3>
    <video id="devVideoPlayer" controls></video>
  </div>
</div>

<div class="dev-modal-backdrop" id="devDetailBackdrop" onclick="if(event.target===this) closeDevDetail()">
  <div class="dev-modal detail">
    <h3>Detalhes da devolução <span class="close" onclick="closeDevDetail()"><i class="fas fa-times"></i></span></h3>
    <div id="devDetailBody"></div>
  </div>
</div>

<script src="../js/db.js"></script>
<script src="../js/websocket.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/sidebar.js"></script>
<script>
const fmt  = v => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);
const fmtD = d => d ? new Date(d).toLocaleDateString('pt-BR') : '—';
// Traduções de campos que vêm em inglês/código da API do ML — reason_detail
// já vem traduzido pelo backend (endpoint /marketplace/v2/claims/reasons,
// ver worker.js). stage/type são um conjunto pequeno e conhecido de valores,
// traduzidos aqui direto; valor desconhecido cai no fallback (capitaliza o
// texto cru) em vez de sumir ou quebrar.
const TYPE_LABEL = { mediations: 'Mediação', returns: 'Devolução', cancel_purchase: 'Cancelamento de compra' };
const STAGE_LABEL = { claim: 'Reclamação', dispute: 'Disputa', mediation: 'Mediação', recontact: 'Recontato', dispute_recontact: 'Disputa (recontato)' };
function traduzido(mapa, valor) {
  if (!valor) return null;
  return mapa[valor] || (valor.charAt(0).toUpperCase() + valor.slice(1).replace(/_/g, ' '));
}
const statusMap = {
  opened:   { l:'Em Análise', c:'paused' },
  analysis: { l:'Em Análise', c:'paused' },
  approved: { l:'Aprovada',   c:'active' },
  resolved: { l:'Resolvida',  c:'active' },
  rejected: { l:'Rejeitada',  c:'closed' },
  closed:   { l:'Encerrada',  c:'closed' },
};

async function saveNote(id, btn) {
  const input = document.getElementById(`note-${id}`);
  const note  = input.value.trim();
  btn.disabled = true;
  btn.textContent = '...';
  const r = await DB.saveDevolucaoNote(id, note);
  if (r) {
    btn.textContent = '✓';
    btn.style.background = 'var(--green)';
    setTimeout(() => { btn.textContent = 'Salvar'; btn.style.background = ''; btn.disabled = false; }, 1500);
  } else {
    btn.textContent = 'Erro';
    btn.style.background = 'var(--red)';
    setTimeout(() => { btn.textContent = 'Salvar'; btn.style.background = ''; btn.disabled = false; }, 2000);
  }
}

// Prejuízo é digitado manualmente pelo usuário (não vem da API do ML) — ver
// business-rules.md. Salva, depois recarrega a listagem pra atualizar o
// card "Prejuízo Total" com o novo valor, mesmo padrão de saveNote() mas
// com esse passo extra (a observação não afeta nenhum KPI, o prejuízo sim).
async function savePrejuizo(id, btn) {
  const input = document.getElementById(`prejuizo-${id}`);
  const valor = input.value.trim();
  btn.disabled = true;
  btn.textContent = '...';
  const r = await DB.saveDevolucaoPrejuizo(id, valor);
  if (r) {
    btn.textContent = '✓';
    btn.style.background = 'var(--green)';
    setTimeout(() => { btn.textContent = 'Salvar'; btn.style.background = ''; btn.disabled = false; }, 1500);
    load();
  } else {
    btn.textContent = 'Erro';
    btn.style.background = 'var(--red)';
    setTimeout(() => { btn.textContent = 'Salvar'; btn.style.background = ''; btn.disabled = false; }, 2000);
  }
}

let periodoAtual = { date_from: '', date_to: '' };
let allDevRows = [];

async function loadLojasFiltro() {
  const sel = document.getElementById('filtroLoja');
  if (sel.dataset.loaded) return;
  const data = await DB.getLojas();
  (data?.stores || []).forEach(l => sel.insertAdjacentHTML('beforeend', `<option value="${l.id}">${l.nickname}</option>`));
  sel.dataset.loaded = '1';
}

function todayISO(d = new Date()) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

// Hoje/Ontem/7/15/30 dias — botões de atalho pro filtro de data. "Tudo"
// (dias === '') limpa o filtro de período sem mexer no resto (loja/busca).
function setPeriodo(dias) {
  const hoje = new Date();
  if (dias === '') {
    periodoAtual = { date_from: '', date_to: '' };
  } else if (dias === 'hoje') {
    periodoAtual = { date_from: todayISO(hoje), date_to: todayISO(hoje) };
  } else if (dias === 'ontem') {
    const d = new Date(hoje); d.setDate(d.getDate() - 1);
    periodoAtual = { date_from: todayISO(d), date_to: todayISO(d) };
  } else {
    const d = new Date(hoje); d.setDate(d.getDate() - Number(dias));
    periodoAtual = { date_from: todayISO(d), date_to: todayISO(hoje) };
  }
  document.querySelectorAll('.periodo-btn').forEach(b => b.classList.toggle('active', b.dataset.periodo === String(dias)));
  document.getElementById('dataDe').value = '';
  document.getElementById('dataAte').value = '';
  load();
}

// Filtro de data livre (ex: "01/07/2026 até 31/07/2026") — complementa os
// botões de atalho pra períodos que eles não cobrem (um mês específico,
// uma faixa arbitrária). Desativa os botões de atalho enquanto ativo, pra
// não dar a entender que os dois filtros estão combinados.
function setPeriodoCustom() {
  const de = document.getElementById('dataDe').value;
  const ate = document.getElementById('dataAte').value;
  if (!de && !ate) return;
  periodoAtual = { date_from: de || '', date_to: ate || de };
  document.querySelectorAll('.periodo-btn').forEach(b => b.classList.remove('active'));
  load();
}

async function load() {
  await loadLojasFiltro();
  const q = document.getElementById('searchInput').value.trim();
  const storeId = document.getElementById('filtroLoja').value;
  const params = { q, store_id: storeId || undefined };
  if (periodoAtual.date_from) { params.date_from = periodoAtual.date_from; params.date_to = periodoAtual.date_to + 'T23:59:59'; }
  const data = await DB.getDevolucoes(params) || { items:[], summary:{} };
  const s = data.summary || {};

  document.getElementById('kpi-total').textContent     = s.total ?? '—';
  document.getElementById('kpi-analise').textContent   = s.in_analysis ?? '—';
  document.getElementById('kpi-aprovadas').textContent = s.approved ?? '—';
  document.getElementById('kpi-rejeitadas').textContent= s.rejected ?? '—';
  document.getElementById('kpi-valor').textContent     = fmt(s.total_value);
  document.getElementById('kpi-prejuizo').textContent  = fmt(s.prejuizo_total);
  document.getElementById('kpi-prejuizo-qtd').textContent = `${s.prejuizo_qtd ?? 0} devolução(ões) com prejuízo lançado`;

  const rows = data.items || [];
  allDevRows = rows;
  document.getElementById('devTable').innerHTML = rows.length
    ? rows.map(r => {
        const st = statusMap[r.status] || { l: r.status, c: '' };
        const produto = r.item_title || r.title || '—';
        return `<tr onclick="openDevDetail(${r.id})" style="cursor:pointer">
          <td style="font-size:11px;white-space:nowrap">#${r.order_id||'—'}</td>
          <td style="font-size:.75rem;color:var(--text-muted)">${r.conta||'—'}</td>
          <td style="white-space:nowrap">${r.buyer_nickname||'—'}</td>
          <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${produto}">${produto}</td>
          <td style="max-width:180px" title="${r.reason||''}">
            <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.reason_detail || r.reason || '—'}</div>
            ${(r.type || r.stage) ? `<div style="font-size:10px;color:var(--text-muted)">${[traduzido(TYPE_LABEL, r.type), traduzido(STAGE_LABEL, r.stage)].filter(Boolean).join(' • ')}</div>` : ''}
          </td>
          <td style="white-space:nowrap">${fmt(r.order_amount ?? r.amount)}</td>
          <td><span class="badge ${st.c}">${st.l}</span></td>
          <td style="white-space:nowrap">${fmtD(r.date)}</td>
          <td id="video-cell-${r.order_id}" style="white-space:nowrap" onclick="event.stopPropagation()">—</td>
          <td onclick="event.stopPropagation()">
            <div class="note-cell">
              <input class="note-input prejuizo-input" id="prejuizo-${r.id}" type="number" step="0.01" min="0" inputmode="decimal" value="${r.prejuizo ?? ''}" placeholder="0,00" style="max-width:90px">
              <button class="btn-save-note" onclick="savePrejuizo(${r.id}, this)">Salvar</button>
            </div>
          </td>
          <td onclick="event.stopPropagation()">
            <div class="note-cell">
              <input class="note-input" id="note-${r.id}" value="${(r.note||'').replace(/"/g,'&quot;')}" placeholder="Adicionar observação...">
              <button class="btn-save-note" onclick="saveNote(${r.id}, this)">Salvar</button>
            </div>
          </td>
        </tr>`;
      }).join('')
    : '<tr><td colspan="11" class="empty-state">Nenhuma devolução encontrada</td></tr>';

  loadVideoLinks(rows.map(r => r.order_id).filter(Boolean));
}

// Lookup em lote (1 chamada, não N+1) de quais pedidos têm vídeo de
// embalagem gravado — preenche a coluna "Vídeo" com um botão "Assistir"
// só onde houver match. Ver .claude/embalagem.md.
async function loadVideoLinks(orderIds) {
  if (!orderIds.length) return;
  const map = await DB.getVideosPorPedidos(orderIds);
  if (!map || map.error) return;
  Object.entries(map).forEach(([orderId, v]) => {
    const cell = document.getElementById(`video-cell-${orderId}`);
    if (cell) cell.innerHTML = `<button class="btn-save-note" style="background:var(--bg-card);color:var(--text-main);border:1px solid var(--border)" onclick="playDevVideo(${v.id})"><i class="fas fa-play"></i> Assistir</button>`;
  });
}

function playDevVideo(id) {
  document.getElementById('devVideoPlayer').src = DB.videoEmbalagemUrl(id);
  document.getElementById('devVideoBackdrop').classList.add('open');
}
function closeDevVideo() {
  const player = document.getElementById('devVideoPlayer');
  player.pause();
  player.removeAttribute('src');
  document.getElementById('devVideoBackdrop').classList.remove('open');
}

// Mesma classificação usada em pages/embalagem.html/top-vendas-online.html.
function logLabel(tipo) {
  const l = (tipo || '').toLowerCase();
  if (l.includes('fulfillment')) return 'Full';
  if (l.includes('self_service') || l.includes('flex')) return 'Flex';
  if (l.includes('xd_drop_off') || l.includes('me2') || l.includes('me1') || l.includes('cross_docking')) return 'Mercado Envios';
  return tipo || '—';
}
const fmtDT = d => d ? new Date(d).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : '—';
const PLAYER_ROLE_LABEL = { complainant: 'Comprador', respondent: 'Vendedor', mediator: 'Mercado Livre' };

// Modal de detalhe — abre com o que já veio na listagem (sem chamada nova),
// mostra todo campo estruturado que a claim traz + o pedido/produto
// associado (via JOIN orders/items no backend, ver .claude/decisions.md) +
// um "ver dados brutos" com o JSON completo da claim, pra nenhum detalhe
// ficar de fora mesmo que não tenha um campo dedicado na UI.
function openDevDetail(id) {
  const r = allDevRows.find(x => String(x.id) === String(id));
  if (!r) return;
  const st = statusMap[r.status] || { l: r.status, c: '' };
  const raw = r.raw_data || {};
  const players = Array.isArray(raw.players) ? raw.players : [];
  const resolution = raw.resolution;

  const produtoHtml = r.item_permalink
    ? `<a href="${r.item_permalink}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${escapeHtmlDev(r.item_title || r.title || 'Produto')} <i class="fas fa-external-link-alt" style="font-size:10px;color:var(--primary)"></i></a>`
    : escapeHtmlDev(r.item_title || r.title || 'Produto não identificado');

  let html = `
    <div class="dev-detail-head">
      ${r.item_thumbnail ? `<img src="${r.item_thumbnail}" onerror="this.style.display='none'">` : ''}
      <div>
        <div class="prod-title">${produtoHtml}</div>
        <div class="prod-sub">${r.item_id ? `SKU/ID: ${r.item_id}` : 'Sem anúncio associado a este pedido'}${r.order_quantity ? ` · Qtd: ${r.order_quantity}` : ''}</div>
      </div>
    </div>
    <div class="dev-detail-grid">
      <div class="dev-detail-item"><div class="lbl">Valor do pedido</div><div class="val big">${fmt(r.order_amount ?? r.amount)}</div></div>
      <div class="dev-detail-item"><div class="lbl">Prejuízo lançado</div><div class="val big" style="color:var(--red)">${r.prejuizo != null ? fmt(r.prejuizo) : 'Não lançado'}</div></div>
      <div class="dev-detail-item"><div class="lbl">Status</div><div class="val"><span class="badge ${st.c}">${st.l}</span></div></div>
      <div class="dev-detail-item"><div class="lbl">Pedido</div><div class="val">#${r.order_id || '—'}</div></div>
      <div class="dev-detail-item"><div class="lbl">Comprador</div><div class="val">${r.buyer_nickname || '—'}</div></div>
      <div class="dev-detail-item"><div class="lbl">Loja</div><div class="val">${r.conta || '—'}</div></div>
      <div class="dev-detail-item"><div class="lbl">Logística</div><div class="val">${logLabel(r.shipping_type)}</div></div>
      <div class="dev-detail-item"><div class="lbl">Motivo</div><div class="val">${r.reason_detail || r.reason || '—'}</div></div>
      <div class="dev-detail-item"><div class="lbl">Estágio</div><div class="val">${traduzido(STAGE_LABEL, r.stage) || '—'}</div></div>
      <div class="dev-detail-item"><div class="lbl">Tipo</div><div class="val">${traduzido(TYPE_LABEL, r.type) || '—'}</div></div>
      <div class="dev-detail-item"><div class="lbl">Aberta em</div><div class="val">${fmtDT(r.date)}</div></div>
      <div class="dev-detail-item"><div class="lbl">Última atualização</div><div class="val">${fmtDT(r.last_updated)}</div></div>
      <div class="dev-detail-item"><div class="lbl">Data da venda</div><div class="val">${fmtDT(r.order_date)}</div></div>
    </div>`;

  if (resolution) {
    html += `
    <div class="dev-detail-section">
      <h4>Resolução</h4>
      <div class="dev-detail-item"><div class="val">${resolution.description || resolution.reason || 'Sem descrição'}</div></div>
      ${resolution.date ? `<div class="dev-detail-item" style="margin-top:6px"><div class="lbl">Data da resolução</div><div class="val">${fmtDT(resolution.date)}</div></div>` : ''}
    </div>`;
  }

  if (players.length) {
    html += `
    <div class="dev-detail-section">
      <h4>Envolvidos</h4>
      ${players.map(p => `<div class="dev-player-row"><span class="role-tag">${PLAYER_ROLE_LABEL[p.role] || p.role || '—'}</span> ID: ${p.user_id ?? '—'}</div>`).join('')}
    </div>`;
  }

  if (r.note) {
    html += `
    <div class="dev-detail-section">
      <h4>Observação interna</h4>
      <div class="dev-detail-item"><div class="val">${escapeHtmlDev(r.note)}</div></div>
    </div>`;
  }

  html += `
    <span class="dev-raw-toggle" onclick="document.getElementById('devRawJson').classList.toggle('open')"><i class="fas fa-code"></i> Ver dados brutos da claim</span>
    <pre class="dev-raw-json" id="devRawJson">${escapeHtmlDev(JSON.stringify(raw, null, 2))}</pre>`;

  document.getElementById('devDetailBody').innerHTML = html;
  document.getElementById('devDetailBackdrop').classList.add('open');
}
function closeDevDetail() { document.getElementById('devDetailBackdrop').classList.remove('open'); }
function escapeHtmlDev(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }

document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') load(); });

async function syncRetroativo() {
  const btn = document.getElementById('btnSync');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Importando...';
  const r = await DB._post('/schedule/jobs/syncReturns/trigger', {});
  if (r) {
    btn.innerHTML = '<i class="fas fa-check"></i> Iniciado — aguarde...';
    btn.style.color = 'var(--green)';
    setTimeout(() => { load(); btn.innerHTML = '<i class="fas fa-sync-alt"></i> Importar histórico ML'; btn.style.color=''; btn.disabled=false; }, 15000);
  } else {
    btn.innerHTML = 'Erro';
    setTimeout(() => { btn.innerHTML = '<i class="fas fa-sync-alt"></i> Importar histórico ML'; btn.disabled=false; }, 3000);
  }
}

WS.on('devolucao_recebida', load);
WS.on('order_updated', load);
WS.on('_connected', () => { const el=document.getElementById('wsStatus'); if(el) el.innerHTML='<i class="fas fa-circle" style="color:var(--green);font-size:8px"></i> ao vivo'; });
load();
</script>
</body>
</html>
