<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estoque Parado — ML Dashboard</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/cards.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>window.PAGE_TITLE='Estoque Parado'; window.ACTIVE_NAV='estoque-parado.html';</script>
  <style>
    .ep-row { display:flex; align-items:center; gap:14px; padding:10px 0; border-bottom:1px solid var(--border); }
    .ep-row:last-child { border-bottom:none; }
    .ep-thumb { width:48px; height:48px; border-radius:8px; object-fit:cover; background:var(--surface); flex-shrink:0; }
    .ep-thumb-ph { width:48px; height:48px; border-radius:8px; background:var(--surface); flex-shrink:0; display:flex; align-items:center; justify-content:center; color:var(--text-muted); font-size:1.1rem; }
    .ep-info { flex:1; min-width:0; }
    .ep-title { font-size:.85rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .ep-sub { font-size:.72rem; color:var(--text-muted); margin-top:2px; display:flex; align-items:center; gap:8px; }
    .ep-cols { display:flex; gap:16px; flex-shrink:0; align-items:center; }
    .ep-col { text-align:center; min-width:72px; }
    .ep-col .lbl { font-size:.6rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; }
    .ep-col .val { font-size:.88rem; font-weight:700; margin-top:2px; }
    /* badges de situação */
    .badge-nunca    { padding:3px 9px; border-radius:10px; font-size:.7rem; font-weight:700; background:rgba(255,59,48,.15); color:#ff3b30; }
    .badge-parado   { padding:3px 9px; border-radius:10px; font-size:.7rem; font-weight:700; background:rgba(255,159,10,.15); color:#ff9f0a; }
    .badge-recente  { padding:3px 9px; border-radius:10px; font-size:.7rem; font-weight:700; background:rgba(48,209,88,.15); color:#30d158; }
    @media(max-width:700px){ .ep-cols{ flex-wrap:wrap; gap:8px; } .ep-col{ min-width:60px; } }
  </style>
</head>
<body>
<div class="app-container">
  <div id="app-sidebar"></div>
  <main class="main-content">
    <div id="app-topbar"></div>
    <div class="content-area">

      <div class="filters-row" style="margin-bottom:16px">
        <select class="filter-select" id="daysFilter">
          <option value="3">Sem venda nos últimos 3 dias</option>
          <option value="5">Sem venda nos últimos 5 dias</option>
          <option value="7">Sem venda nos últimos 7 dias</option>
          <option value="10">Sem venda nos últimos 10 dias</option>
          <option value="15">Sem venda nos últimos 15 dias</option>
          <option value="21">Sem venda nos últimos 21 dias</option>
          <option value="30" selected>Sem venda nos últimos 30 dias</option>
        </select>
        <select class="filter-select" id="storeFilter">
          <option value="">Todas as lojas</option>
        </select>
        <div class="search-box" style="flex:1;max-width:320px">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="Buscar produto...">
        </div>
      </div>

      <div class="card-grid" style="margin-bottom:16px">
        <div class="stat-card">
          <div class="label">Anúncios parados</div>
          <div class="value" id="kpi-total" style="color:var(--red)">—</div>
        </div>
        <div class="stat-card">
          <div class="label">Estoque total parado</div>
          <div class="value" id="kpi-estoque" style="color:var(--orange)">—</div>
        </div>
        <div class="stat-card">
          <div class="label">Capital parado</div>
          <div class="value" id="kpi-valor">—</div>
        </div>
        <div class="stat-card">
          <div class="label">Nunca venderam</div>
          <div class="value" id="kpi-nunca" style="color:#ff3b30">—</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h3>Anúncios sem venda no período</h3>
          <span id="subtitulo" style="font-size:.8rem;color:var(--text-muted)"></span>
        </div>
        <div id="epList" style="padding:4px 8px">
          <div class="empty-state">Carregando...</div>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="../js/db.js"></script>
<script src="../js/websocket.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/sidebar.js"></script>
<script>
const fmt  = v => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);
const fmtN = v => new Intl.NumberFormat('pt-BR').format(v||0);

function ultimaVendaBadge(ultimoDia, soldQty) {
  // sold_quantity vem direto do ML — mais confiável que o join local
  if (Number(soldQty) === 0) return '<span class="badge-nunca">⛔ Nunca vendeu</span>';
  if (!ultimoDia) return '<span class="badge-parado">⚠️ Parado (sem data)</span>';
  const diffDias = Math.floor((Date.now() - new Date(ultimoDia)) / 86400000);
  if (diffDias > 15) return `<span class="badge-parado">⚠️ Parado ${diffDias}d</span>`;
  return `<span class="badge-recente">✅ ${diffDias}d atrás</span>`;
}

async function load() {
  const days     = document.getElementById('daysFilter').value;
  const store_id = document.getElementById('storeFilter').value;
  const search   = document.getElementById('searchInput').value.toLowerCase();

  document.getElementById('epList').innerHTML = '<div class="empty-state">Carregando...</div>';

  const data = await DB.getEstoqueParado({ days, store_id }) || { items: [] };
  if (data.error) {
    document.getElementById('epList').innerHTML = `<div class="empty-state" style="color:var(--red)">Erro: ${data.error}</div>`;
    return;
  }
  let rows = data.items || [];
  if (search) rows = rows.filter(r => r.title?.toLowerCase().includes(search));

  const totalEstoque = rows.reduce((a, r) => a + Number(r.estoque || 0), 0);
  const totalValor   = rows.reduce((a, r) => a + Number(r.estoque || 0) * Number(r.price || 0), 0);
  const nuncaVendeu  = rows.filter(r => Number(r.sold_quantity) === 0).length;

  document.getElementById('kpi-total').textContent   = fmtN(rows.length);
  document.getElementById('kpi-estoque').textContent = fmtN(totalEstoque);
  document.getElementById('kpi-valor').textContent   = fmt(totalValor);
  document.getElementById('kpi-nunca').textContent   = fmtN(nuncaVendeu);
  document.getElementById('subtitulo').textContent   = `${rows.length} anúncio(s) ativos sem venda nos últimos ${days} dias`;

  const list = document.getElementById('epList');
  if (!rows.length) {
    list.innerHTML = '<div class="empty-state"><i class="fas fa-check-circle" style="color:var(--green);margin-right:8px"></i>Nenhum anúncio parado neste período!</div>';
    return;
  }

  list.innerHTML = rows.map(r => {
    const capital = Number(r.estoque) * Number(r.price);
    const thumb = r.thumbnail
      ? `<img class="ep-thumb" src="${r.thumbnail}" onerror="this.outerHTML='<div class=\\'ep-thumb-ph\\'><i class=\\'fas fa-tag\\'></i></div>'">`
      : `<div class="ep-thumb-ph"><i class="fas fa-tag"></i></div>`;
    const link = r.permalink
      ? `<a href="${r.permalink}" target="_blank" style="color:var(--primary);font-size:.7rem;margin-left:6px"><i class="fas fa-external-link-alt"></i></a>`
      : '';
    return `
      <div class="ep-row">
        ${thumb}
        <div class="ep-info">
          <div class="ep-title" title="${r.title}">${r.title}${link}</div>
          <div class="ep-sub">
            <span><i class="fas fa-store" style="margin-right:3px"></i>${r.loja}</span>
            ${ultimaVendaBadge(r.ultimo_dia_venda, r.sold_quantity)}
          </div>
        </div>
        <div class="ep-cols">
          <div class="ep-col">
            <div class="lbl">Preço</div>
            <div class="val">${fmt(r.price)}</div>
          </div>
          <div class="ep-col">
            <div class="lbl">Estoque</div>
            <div class="val" style="color:var(--orange)">${fmtN(r.estoque)}</div>
          </div>
          <div class="ep-col">
            <div class="lbl">Capital</div>
            <div class="val" style="color:var(--red)">${fmt(capital)}</div>
          </div>
          <div class="ep-col">
            <div class="lbl">Qtd Vendida</div>
            <div class="val" style="color:var(--text-muted)">${fmtN(r.vendas_periodo)}</div>
          </div>
        </div>
      </div>`;
  }).join('');
}

async function initStores() {
  const data = await DB.getLojas() || { stores: [] };
  const sel  = document.getElementById('storeFilter');
  (data.stores || []).forEach(s => {
    const o = document.createElement('option');
    o.value = s.id; o.textContent = s.nickname;
    sel.appendChild(o);
  });
}

document.getElementById('daysFilter').addEventListener('change', load);
document.getElementById('storeFilter').addEventListener('change', load);
let t; document.getElementById('searchInput').addEventListener('input', () => { clearTimeout(t); t = setTimeout(load, 300); });

WS.on('anuncio_updated', load);
WS.on('_connected', () => { const el=document.getElementById('wsStatus'); if(el) el.innerHTML='<i class="fas fa-circle" style="color:var(--green);font-size:8px"></i> ao vivo'; });

initStores().then(load);
</script>
</body>
</html>
