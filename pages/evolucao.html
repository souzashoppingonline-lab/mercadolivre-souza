<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evolução Diária — ML Dashboard</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/cards.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>window.PAGE_TITLE='Evolução Diária'; window.ACTIVE_NAV='evolucao.html';</script>
</head>
<body>
<div class="app-container">
  <div id="app-sidebar"></div>
  <main class="main-content">
    <div id="app-topbar"></div>
    <div class="content-area">
      <div class="card" style="margin-bottom:16px">
        <div class="card-header">
          <h3>Evolução Diária de Vendas</h3>
          <div style="display:flex;gap:6px">
            <button class="chart-btn active" data-days="30">30D</button>
            <button class="chart-btn" data-days="60">60D</button>
            <button class="chart-btn" data-days="90">90D</button>
          </div>
        </div>
        <canvas id="evolucaoChart" height="80"></canvas>
      </div>
      <div class="card">
        <div class="card-header"><h3>Dados Diários</h3></div>
        <div class="table-responsive">
          <table class="data-table">
            <thead><tr><th>Data</th><th>Pedidos</th><th>Receita</th><th>Var. Dia Anterior</th></tr></thead>
            <tbody id="evolTable"><tr><td colspan="5" class="empty-state">Carregando...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="../js/db.js"></script>
<script src="../js/websocket.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/sidebar.js"></script>
<script>
const fmt = v => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);
let chart;
async function load(days=30) {
  const data = await DB.getEvolucaoDiaria(days) || { rows:[] };
  const rows = data.rows || [];
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('evolucaoChart'), {
    type:'line',
    data:{ labels:rows.map(r=>r.date), datasets:[
      { label:'Receita', data:rows.map(r=>r.revenue||0), borderColor:'#FFE600', backgroundColor:'rgba(255,230,0,0.07)', fill:true, tension:0.4 }
    ]},
    options:{
      responsive:true,
      plugins:{ legend:{ labels:{ color:'#f0f0f0' } }, tooltip:{ callbacks:{ label:c=>fmt(c.raw) } } },
      scales:{ x:{ ticks:{ color:'#888',maxRotation:45 }, grid:{ color:'rgba(255,255,255,0.05)' } }, y:{ ticks:{ color:'#888', callback:v=>'R$'+(v/1000).toFixed(0)+'k' }, grid:{ color:'rgba(255,255,255,0.05)' } } }
    }
  });
  document.getElementById('evolTable').innerHTML = rows.length
    ? rows.slice().reverse().map((r,i,arr)=>{
        const prev = arr[i+1];
        const diff = prev && prev.revenue ? ((r.revenue-prev.revenue)/prev.revenue*100).toFixed(1) : null;
        return `<tr><td>${r.date}</td><td>${r.orders||0}</td><td>${fmt(r.revenue)}</td>
          <td style="color:${diff==null?'inherit':diff>=0?'var(--green)':'var(--red)'}">${diff==null?'—':(diff>=0?'▲':'▼')+Math.abs(diff)+'%'}</td></tr>`;
      }).join('')
    : '<tr><td colspan="5" class="empty-state">Sem dados</td></tr>';
}
document.querySelectorAll('.chart-btn').forEach(btn=>{
  btn.addEventListener('click', function(){
    document.querySelectorAll('.chart-btn').forEach(b=>b.classList.remove('active'));
    this.classList.add('active');
    load(Number(this.dataset.days));
  });
});
WS.on('_connected', ()=>{ const el=document.getElementById('wsStatus'); if(el) el.innerHTML='<i class="fas fa-circle" style="color:var(--green);font-size:8px"></i> ao vivo'; });
load();
</script>
</body>
</html>
