<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a1d23">
  <title>Dívidas do Dia</title>
  <!-- PWA: app instalável "Dívidas do Dia" + push das 07:00 (sw.js na raiz, o mesmo do painel). Ver .claude/frontend.md -->
  <link rel="manifest" href="/dividas.webmanifest">
  <link rel="apple-touch-icon" href="/assets/dividas-apple-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dívidas">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { margin:0; background:var(--bg-dark); color:var(--text-main); font-size:14px; -webkit-text-size-adjust:100%; }
    .dm-wrap { max-width:560px; margin:0 auto; padding:14px 14px 96px; }
    .dm-head { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
    .dm-head h1 { font-size:19px; margin:0; font-weight:800; }
    .dm-head .sub { font-size:12px; color:var(--text-muted); }
    .dm-ic { margin-left:auto; display:flex; gap:8px; }
    .dm-ic a, .dm-ic button { width:40px; height:40px; border-radius:12px; border:1px solid var(--border); background:var(--bg-card); color:var(--text-main); display:flex; align-items:center; justify-content:center; font-size:15px; text-decoration:none; cursor:pointer; }
    .dm-sino { position:relative; }
    .dm-sino.on { color:#3fb950 !important; border-color:rgba(63,185,80,.5) !important; }
    .dm-sino.aviso::after { content:''; position:absolute; top:7px; right:7px; width:8px; height:8px; border-radius:50%; background:#f59e0b; box-shadow:0 0 0 2px var(--bg-card); }
    .dm-sheet .bloco { background:var(--bg-card2); border:1px solid var(--border); border-radius:12px; padding:12px; margin-top:10px; font-size:13px; line-height:1.45; }
    .dm-sheet .bloco b.t { display:block; font-size:14px; margin-bottom:4px; }
    .dm-sheet .bloco button { margin-top:10px; width:100%; border:0; border-radius:10px; padding:12px; font-size:14px; font-weight:800; cursor:pointer; background:#3fb950; color:#06281a; }
    .dm-sheet .bloco button.sec { background:var(--bg-card); color:var(--text-main); border:1px solid var(--border); }
    .dm-sheet .bloco .lado2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    /* Botão fino "Calendário do mês" embaixo das 3 abas — mesmo visual da barra de progresso */
    .dm-mesbtn { display:block; width:100%; box-sizing:border-box; text-align:left; background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:8px 12px 9px; margin:0 0 12px; color:var(--text-main); font:inherit; cursor:pointer; }
    .dm-mesbtn .t { display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; margin-bottom:6px; }
    .dm-mesbtn .t b { margin-left:auto; color:#f59e0b; white-space:nowrap; }
    .dm-mesbtn .t i { font-style:normal; color:var(--text-muted); font-size:14px; }
    .dm-mesbtn .trilho { height:6px; border-radius:999px; background:var(--bg-card2); overflow:hidden; }
    .dm-mesbtn .trilho span { display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,#2ea043,#3fb950,#56d364); }
    .dm-mesbtn.on { border-color:#f59e0b; box-shadow:inset 0 0 0 1px #f59e0b; }
    .dm-mesbtn.on .t b { color:#3fb950; }
    /* Calendário do mês (botão 📆 Calendário do mês): cor = peso do dia (verde leve → vermelho pesado) */
    .dm-cal { background:var(--bg-card); border:1px solid var(--border); border-radius:14px; padding:10px; margin-bottom:12px; }
    .dm-cal .cab { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
    .dm-cal .cab b { font-size:15px; }
    .dm-cal .cab button { width:38px; height:34px; border-radius:10px; border:1px solid var(--border); background:var(--bg-card2); color:var(--text-main); font-size:18px; cursor:pointer; }
    .dm-cal .nomes, .dm-cal .grade { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
    .dm-cal .nomes span { text-align:center; font-size:10.5px; color:var(--text-muted); font-weight:700; padding-bottom:2px; }
    .dm-cal .dia { position:relative; min-height:48px; border-radius:9px; border:1px solid var(--border); background:var(--bg-card2); color:var(--text-main); padding:3px 2px 4px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:space-between; font:inherit; }
    .dm-cal .dia.vazio { visibility:hidden; }
    .dm-cal .dia .n { font-size:11px; font-weight:700; color:var(--text-muted); }
    .dm-cal .dia .v { font-size:11.5px; font-weight:800; white-space:nowrap; }
    .dm-cal .dia.pesa { background:hsla(var(--h),78%,45%,var(--a)); border-color:hsl(var(--h),70%,48%); }
    .dm-cal .dia.pesa .n { color:var(--text-main); }
    .dm-cal .dia.ok .v { color:#3fb950; }
    .dm-cal .dia.hoje { box-shadow:inset 0 0 0 2px #f59e0b; }
    .dm-cal .dia.sel { box-shadow:0 0 0 2px var(--text-main); }
    .dm-cal .dia.hoje.sel { box-shadow:inset 0 0 0 2px #f59e0b, 0 0 0 2px var(--text-main); }
    .dm-cal .dia .flag { position:absolute; top:-5px; right:-4px; width:15px; height:15px; border-radius:50%; font-size:10px; font-weight:900; line-height:15px; text-align:center; background:#f87171; color:#1a1d23; }
    .dm-cal .leg { display:flex; align-items:center; gap:6px; font-size:10.5px; color:var(--text-muted); margin-top:8px; flex-wrap:wrap; }
    .dm-cal .leg i { display:inline-block; width:70px; height:8px; border-radius:99px; background:linear-gradient(90deg,hsl(120,70%,42%),hsl(60,80%,45%),hsl(0,75%,50%)); }
    .dm-sems { background:var(--bg-card); border:1px solid var(--border); border-radius:14px; padding:10px 12px; margin-bottom:12px; }
    .dm-sems .tit { font-size:12px; font-weight:800; color:var(--text-muted); margin-bottom:6px; }
    .dm-sem { display:grid; grid-template-columns:104px 1fr auto; gap:8px; align-items:center; font-size:12px; padding:4px 0; }
    .dm-sem > span:first-child { white-space:nowrap; }
    .dm-sem .bar { height:9px; border-radius:99px; background:var(--bg-card2); overflow:hidden; }
    .dm-sem .bar span { display:block; height:100%; border-radius:99px; background:hsl(var(--h),70%,48%); }
    .dm-sem b { white-space:nowrap; }
    .dm-sem.pesada { color:#f87171; font-weight:800; }
    .dm-emp { font-size:11px; font-weight:800; color:var(--text-muted); text-transform:uppercase; letter-spacing:.4px; margin:10px 2px 6px; }
    .dm-item { position:relative; transition:opacity .5s; background:var(--bg-card); border:1px solid var(--border); border-left:4px solid var(--c); border-radius:12px; padding:10px 12px; margin-bottom:8px; display:flex; gap:10px; align-items:center; }
    .dm-item .info { flex:1; min-width:0; }
    .dm-item .desc { font-weight:700; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; }
    .dm-item .meta { font-size:11.5px; color:var(--text-muted); margin-top:2px; }
    .dm-item .val { font-weight:800; font-size:15px; white-space:nowrap; }
    .dm-vazio { background:var(--bg-card); border:1px dashed var(--border); border-radius:12px; padding:14px; text-align:center; color:var(--text-muted); font-size:13px; }
    .dm-bar { position:fixed; left:0; right:0; bottom:0; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); background:linear-gradient(transparent, var(--bg-dark) 30%); }
    .dm-bar button { width:100%; max-width:560px; display:block; margin:0 auto; border:0; border-radius:14px; padding:14px; font-size:15px; font-weight:800; background:#25d366; color:#06281a; cursor:pointer; }
    .dm-msg { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(78px + env(safe-area-inset-bottom)); width:calc(100% - 28px); max-width:532px; box-sizing:border-box; background:var(--bg-card2); border:1px solid var(--border); border-radius:12px; padding:10px 12px; font-size:13px; text-align:center; box-shadow:0 8px 24px rgba(0,0,0,.4); z-index:40; display:none; }
    .dm-atr { display:flex; align-items:center; gap:10px; background:rgba(248,113,113,.12); border:1px solid rgba(248,113,113,.45); color:#f87171; border-radius:12px; padding:10px 12px; margin-bottom:12px; font-size:13px; font-weight:700; cursor:pointer; }
    .dm-atr b { margin-left:auto; font-size:15px; }
    .dm-atr.on { background:#f87171; color:#1a1d23; }
    .dm-tabs { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; background:var(--bg-card); border:1px solid var(--border); border-radius:14px; padding:5px; margin-bottom:8px; }
    .dm-tabs button { border:0; background:transparent; color:var(--text-muted); border-radius:10px; padding:11px 4px; font-size:13.5px; font-weight:800; cursor:pointer; line-height:1.15; }
    .dm-tabs button small { display:block; font-size:10.5px; font-weight:600; margin-top:2px; }
    .dm-tabs button.on { background:#f59e0b; color:#1a1d23; }
    .dm-tabs button.on small { color:#1a1d23; }
    .dm-res { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
    .dm-res > div { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:9px 8px; text-align:center; }
    .dm-res .l { font-size:11px; color:var(--text-muted); }
    .dm-res .v { font-size:15px; font-weight:800; margin-top:2px; white-space:nowrap; }
    .dm-res .n { font-size:10.5px; color:var(--text-muted); }
    .dm-dia { font-size:13px; font-weight:800; margin:14px 2px 4px; display:flex; }
    .dm-dia span { margin-left:auto; color:var(--text-muted); font-weight:700; }
    .dm-item.pago { opacity:.55; }
    .dm-item.pago .val { text-decoration:line-through; }
    .dm-st { display:inline-block; font-size:10.5px; font-weight:800; border-radius:999px; padding:1px 7px; margin-right:4px; }
    .dm-st.pago { background:rgba(63,185,80,.18); color:#3fb950; }
    .dm-st.pend { background:rgba(245,158,11,.18); color:#f59e0b; }
    .dm-st.atr { background:rgba(248,113,113,.18); color:#f87171; }
    .dm-item .lado { display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
    .dm-pagar { border:0; border-radius:9px; background:#3fb950; color:#06281a; font-weight:800; font-size:12.5px; padding:7px 14px; cursor:pointer; }
    .dm-desfazer { border:0; background:none; color:var(--text-muted); font-size:11px; text-decoration:underline; cursor:pointer; padding:0; }
    .dm-item.pago .dm-desfazer { text-decoration:underline; }
    .dm-ov { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:flex-end; justify-content:center; z-index:50; }
    .dm-sheet { background:var(--bg-card); border:1px solid var(--border); border-radius:18px 18px 0 0; width:100%; max-width:560px; padding:18px 16px calc(16px + env(safe-area-inset-bottom)); }
    .dm-sheet h3 { margin:0 0 4px; font-size:16px; }
    .dm-sheet .sub { color:var(--text-muted); font-size:12.5px; margin-bottom:12px; }
    .dm-sheet label { display:block; font-size:12px; color:var(--text-muted); margin:10px 0 4px; }
    .dm-sheet select, .dm-sheet input { width:100%; box-sizing:border-box; background:var(--bg-card2); color:var(--text-main); border:1px solid var(--border); border-radius:10px; padding:12px; font-size:15px; }
    .dm-sheet .acoes { display:grid; grid-template-columns:1fr 2fr; gap:8px; margin-top:16px; }
    .dm-sheet .acoes button { border:0; border-radius:12px; padding:14px; font-size:15px; font-weight:800; cursor:pointer; }
    .dm-sheet .cancelar { background:var(--bg-card2); color:var(--text-main); }
    .dm-sheet .confirmar { background:#3fb950; color:#06281a; }
    .dm-sheet .confirmar:disabled { opacity:.6; }
    .dm-sheet .erro { color:#f87171; font-size:12.5px; margin-top:8px; min-height:16px; }
    /* Animação de pagamento: ✅ desenhado + "Pago!" + confete + card piscando verde */
    .dm-cel { position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; background:rgba(10,12,16,.72); overflow:hidden; animation:dmFade .25s ease-out; }
    .dm-cel.saindo { animation:dmFadeOut .5s ease-in forwards; }
    .dm-cel-box { position:relative; z-index:2; text-align:center; background:var(--bg-card); border:1px solid rgba(63,185,80,.5); border-radius:22px; padding:26px 30px 22px; max-width:300px; box-shadow:0 0 0 0 rgba(63,185,80,.5), 0 20px 60px rgba(0,0,0,.5); animation:dmPop .8s cubic-bezier(.2,1.4,.4,1), dmGlow 1.8s ease-out .4s 3; }
    .dm-cel svg { width:88px; height:88px; display:block; margin:0 auto 10px; }
    .dm-cel .circ { fill:none; stroke:#3fb950; stroke-width:5; stroke-dasharray:252; stroke-dashoffset:252; animation:dmDraw .9s ease-out .2s forwards; }
    .dm-cel .chk { fill:none; stroke:#3fb950; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:60; stroke-dashoffset:60; animation:dmDraw .6s ease-out 1s forwards; }
    .dm-cel h2 { margin:0; font-size:26px; color:#3fb950; letter-spacing:.5px; }
    .dm-cel .nome { font-size:13px; color:var(--text-muted); margin-top:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .dm-cel .valor { font-size:22px; font-weight:800; margin-top:4px; }
    .dm-cel .extra { font-size:12px; color:var(--text-muted); margin-top:8px; }
    .dm-conf { position:absolute; top:-12px; width:9px; height:14px; border-radius:2px; z-index:1; animation:dmCai linear forwards; }
    .dm-din { position:absolute; bottom:-60px; z-index:1; line-height:1; pointer-events:none; animation:dmVoa ease-in-out forwards; }
    .dm-mao { position:absolute; left:50%; bottom:7vh; z-index:3; font-size:64px; line-height:1; pointer-events:none; transform:translate(-50%,180%); transition:transform .5s cubic-bezier(.2,1.3,.4,1); filter:drop-shadow(0 6px 12px rgba(0,0,0,.45)); }
    .dm-mao.entra { transform:translate(-50%,0); }
    .dm-mao.pega { transform:translate(-50%,0) scale(1.25); transition:transform .15s ease-out; }
    .dm-mao.sai { transform:translate(-50%,220%); transition:transform .6s ease-in; }
    .dm-item.recem-pago { animation:dmFlash 2.5s ease-out; }
    @keyframes dmFade { from { opacity:0 } to { opacity:1 } }
    @keyframes dmFadeOut { to { opacity:0 } }
    @keyframes dmPop { 0% { transform:scale(.4); opacity:0 } 70% { transform:scale(1.06); opacity:1 } 100% { transform:scale(1) } }
    @keyframes dmGlow { 0% { box-shadow:0 0 0 0 rgba(63,185,80,.55), 0 20px 60px rgba(0,0,0,.5) } 100% { box-shadow:0 0 0 28px rgba(63,185,80,0), 0 20px 60px rgba(0,0,0,.5) } }
    @keyframes dmDraw { to { stroke-dashoffset:0 } }
    @keyframes dmCai { 0% { transform:translate3d(0,0,0) rotate(0) } 100% { transform:translate3d(var(--dx),110vh,0) rotate(var(--rot)) } }
    @keyframes dmVoa { 0% { transform:translate3d(0,0,0) rotate(0) scale(.7); opacity:0 } 10% { opacity:1 } 50% { transform:translate3d(calc(var(--dx) * -.6),-55vh,0) rotate(calc(var(--rot) * -.5)) scale(1.1) } 85% { opacity:1 } 100% { transform:translate3d(var(--dx),-115vh,0) rotate(var(--rot)) scale(1); opacity:0 } }
    @keyframes dmFlash { 0%,30% { background:rgba(63,185,80,.35); box-shadow:0 0 0 3px rgba(63,185,80,.55) } 100% { background:var(--bg-card); box-shadow:none } }
    /* Carimbo PAGO (fica no card pago), texto riscado, barra de progresso, resumo contando */
    .dm-carimbo { position:absolute; left:56%; top:50%; transform:translate(-50%,-50%) rotate(-12deg); border:3px solid #3fb950; box-shadow:inset 0 0 0 2px rgba(63,185,80,.35); color:#3fb950; border-radius:8px; padding:0 12px; font-size:22px; font-weight:900; letter-spacing:4px; line-height:1.35; opacity:.9; pointer-events:none; background:rgba(63,185,80,.07); }
    .dm-item.espera-carimbo .dm-carimbo { opacity:0; }
    .dm-carimbo.bate { animation:dmCarimbo .45s cubic-bezier(.55,0,.75,.2) both; }
    .dm-item .tx { background:linear-gradient(currentColor,currentColor) no-repeat 0 56% / 0% 2px; transition:background-size .55s ease-out; }
    .dm-item.pago .tx { background-size:100% 2px; }
    .dm-item.espera-risco { opacity:1; }
    .dm-item.espera-risco .tx { background-size:0% 2px; }
    .dm-wrap.treme { animation:dmTreme .35s linear; }
    .dm-prog { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:9px 12px 10px; margin:-4px 0 14px; }
    .dm-prog .t { display:flex; font-size:12.5px; font-weight:700; margin-bottom:6px; }
    .dm-prog .t b { margin-left:auto; color:#3fb950; }
    .dm-prog .trilho { height:10px; border-radius:999px; background:var(--bg-card2); overflow:hidden; }
    .dm-prog .enche { position:relative; height:100%; border-radius:999px; background:linear-gradient(90deg,#2ea043,#3fb950,#56d364); transition:width .9s cubic-bezier(.4,0,.2,1); overflow:hidden; }
    .dm-prog .enche.enchendo::after { content:''; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent); animation:dmBrilho 1s ease-in-out 2; }
    .dm-prog.cheio .enche { background:linear-gradient(90deg,#f59e0b,#facc15,#3fb950); box-shadow:0 0 12px rgba(250,204,21,.6); }
    .dm-prog.cheio .t b { color:#facc15; }
    .dm-res > div.pulsa, .dm-atr.ok { animation:dmPulsa .6s ease-out; }
    .dm-atr { max-height:90px; transition:background .6s, color .6s, border-color .6s, max-height .5s, opacity .5s, margin .5s, padding .5s; }
    .dm-atr.ok { background:rgba(63,185,80,.15); border-color:rgba(63,185,80,.5); color:#3fb950; cursor:default; }
    .dm-atr.some { max-height:0; opacity:0; margin:0; padding-top:0; padding-bottom:0; border-width:0; }
    /* Caixa "Pago!": frase, troféu e fogos (tudo pago) */
    .dm-cel .frase { font-size:14px; font-weight:700; margin-top:8px; color:#facc15; animation:dmFade .5s ease-out 1.4s both; }
    .dm-fogos { position:absolute; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
    .dm-trofeu { position:absolute; left:50%; bottom:calc(100% + 12px); transform:translateX(-50%); text-align:center; white-space:nowrap; animation:dmTrofeu 1.3s cubic-bezier(.3,1.25,.5,1) .6s both; }
    .dm-trofeu span { display:block; font-size:64px; line-height:1; animation:dmGira 1.3s ease-out .6s both; filter:drop-shadow(0 0 14px rgba(250,204,21,.65)); }
    .dm-trofeu b { display:block; color:#facc15; font-size:20px; font-weight:900; margin-top:4px; text-shadow:0 2px 10px rgba(0,0,0,.6); }
    @keyframes dmCarimbo { 0% { transform:translate(-50%,-50%) rotate(-32deg) scale(3.4); opacity:0 } 60% { transform:translate(-50%,-50%) rotate(-12deg) scale(.9); opacity:1 } 80% { transform:translate(-50%,-50%) rotate(-12deg) scale(1.07) } 100% { transform:translate(-50%,-50%) rotate(-12deg) scale(1); opacity:.9 } }
    @keyframes dmTreme { 0%,100% { transform:translate(0,0) } 20% { transform:translate(-6px,2px) } 40% { transform:translate(6px,-2px) } 60% { transform:translate(-4px,1px) } 80% { transform:translate(3px,-1px) } }
    @keyframes dmBrilho { from { transform:translateX(-100%) } to { transform:translateX(100%) } }
    @keyframes dmPulsa { 50% { transform:scale(1.06); border-color:#3fb950 } }
    @keyframes dmTrofeu { 0% { transform:translate(-50%,-70vh); opacity:0 } 15% { opacity:1 } 100% { transform:translate(-50%,0); opacity:1 } }
    @keyframes dmGira { from { transform:rotateY(0) rotate(-20deg) } to { transform:rotateY(1080deg) rotate(0) } }
    @media (prefers-reduced-motion: reduce) {
      .dm-cel, .dm-cel-box, .dm-item.recem-pago { animation:none !important; }
      .dm-cel .circ, .dm-cel .chk { animation:none; stroke-dashoffset:0; }
      .dm-conf, .dm-din, .dm-mao, .dm-fogos { display:none; }
      .dm-carimbo.bate, .dm-wrap.treme, .dm-trofeu, .dm-trofeu span, .dm-cel .frase, .dm-res > div.pulsa, .dm-atr.ok, .dm-prog .enche.enchendo::after { animation:none !important; }
      .dm-item, .dm-item .tx, .dm-prog .enche, .dm-atr { transition:none !important; }
    }
  </style>
</head>
<body>
<div class="dm-wrap">
  <div class="dm-head">
    <div>
      <h1>💸 Dívidas do Dia</h1>
      <div class="sub" id="dmData">Carregando…</div>
    </div>
    <div class="dm-ic">
      <button onclick="abrirNotificacoes()" title="Notificações e instalar app" id="dmSinoBtn" class="dm-sino"><i class="fas fa-bell"></i></button>
      <button onclick="carregar()" title="Atualizar"><i class="fas fa-sync-alt" id="dmSync"></i></button>
      <a href="financeiro-boletos.html" title="Abrir Boletos completo"><i class="fas fa-table-list"></i></a>
    </div>
  </div>
  <div id="dmAtr"></div>
  <div class="dm-tabs" id="dmTabs"></div>
  <div id="dmMesBtn"></div>
  <div class="dm-res" id="dmRes"></div>
  <div id="dmProg"></div>
  <div id="dmCal"></div>
  <div id="dmLista"><div class="dm-vazio">Carregando…</div></div>
  <div class="dm-msg" id="dmMsg"></div>
</div>
<div class="dm-ov" id="dmOv" onclick="if(event.target.id==='dmOv') fecharSheet()"><div class="dm-sheet" id="dmSheet"></div></div>
<div class="dm-bar"><button onclick="enviarWhatsapp()" id="dmWaBtn"><i class="fab fa-whatsapp"></i> Enviar no WhatsApp</button></div>

<script src="../js/db.js"></script>
<script src="../js/dividasDia.js"></script>
<script src="../js/recorrentesFin.js"></script>
<script src="../js/pagamentosFin.js"></script>
<script>
// Visão de celular das dívidas: botões Hoje / Amanhã / Próximos 3 dias com
// TODAS as dívidas do período (pagas e a pagar) + aviso de atrasadas. Botão
// Pagar / desfazer igual ao da página Boletos (js/pagamentosFin.js); editar o
// resto continua em financeiro-boletos.html. Lista calculada por js/dividasDia.js, o MESMO
// cálculo do botão "Enviar dívidas no WhatsApp" da página Boletos.
const { BRL, ddmm } = DividasDia;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const TIPO = { boleto: 'Boleto', manual: 'Imposto', cartao: 'Cartão', fatura_ml: 'Fatura ML', flex: 'Flex', pessoal: 'Pessoal', folha_pagamento: 'Folha', custo_fixo: 'Custo fixo', custo_variavel: 'Custo variável' };
let R = null, CFG = { numero: '', nome: '' };

let _msgTimer = null;
function msg(t, erro) {
  const el = document.getElementById('dmMsg');
  el.style.color = erro ? 'var(--red, #f87171)' : 'var(--text-main)'; el.innerHTML = t; el.style.display = t ? 'block' : 'none';
  clearTimeout(_msgTimer); if (t && !erro) _msgTimer = setTimeout(() => { el.style.display = 'none'; }, 6000);
}

async function carregar() {
  document.getElementById('dmSync').classList.add('fa-spin');
  msg('');
  const [rB, rP, rC, cfg, rRe, rBk, rCe] = await Promise.all([
    DB.getFinanceiroDados('boletos_mensais', 5000, 'date.asc'),
    DB.getFinanceiroDados('parcelas_cartao', 10000, 'data_vencimento.asc'),
    DB.getFinanceiroDados('cartoes', 500),
    DB.getWhatsappBoletosConfig(),
    DB.getFinanceiroDados('boletos_recorrentes', 2000),
    DB.getFinanceiroDados('contas_bancarias', 1000),
    DB.getFinanceiroDados('conta_empresas', 3000),
  ]);
  document.getElementById('dmSync').classList.remove('fa-spin');
  const erro = [rB, rP, rC].find(r => !r || r.error);
  if (erro) { document.getElementById('dmLista').innerHTML = `<div class="dm-vazio" style="color:var(--red,#f87171)">Erro ao carregar: ${esc(erro && erro.error || 'servidor indisponível')}</div>`; return; }
  if (cfg && !cfg.error) CFG = cfg;
  // Mesma geração automática da página Boletos (1x por mês, mês atual + próximo):
  // sem isso, um recorrente ainda não gerado (ex.: carro do dia 9) não aparece aqui.
  if (rRe && !rRe.error) {
    const g = await RecorrentesFin.gerarAutomatico({ recorrentes: rRe.rows || [], boletos: rB.rows, DB });
    if (g.criados) msg(`🔁 ${g.criados} dívida(s) recorrente(s) gerada(s) automaticamente — confira os valores em Boletos.`);
    if (g.erro) msg('Recorrentes não gerados: ' + esc(g.erro), true);
  }
  DADOS = { boletos: rB.rows || [], parcelas: rP.rows || [], cartoes: rC.rows || [] };
  CONTAS = (rBk && !rBk.error && rBk.rows) || []; CONTAEMP = (rCe && !rCe.error && rCe.rows) || [];
  R = DividasDia.calcular({ ...DADOS, hoje: DividasDia.hojeLocal() });
  render();
}

// Visões (botões): TODAS as dívidas do período — pagas e a pagar. Atrasadas
// ficam num aviso vermelho acima (clicável) pra não sumirem de vista.
const VISOES = {
  hoje:      { rotulo: 'Hoje',          de: h => h,                  ate: h => h },
  amanha:    { rotulo: 'Amanhã',        de: h => DividasDia.somaDias(h, 1), ate: h => DividasDia.somaDias(h, 1) },
  proximos:  { rotulo: 'Próx. 3 dias',  de: h => DividasDia.somaDias(h, 1), ate: h => DividasDia.somaDias(h, 3) },
  // Calendário: mês escolhido nas setas ‹ › (mesSel); a lista mostra o dia tocado (diaSel).
  // Não vira aba: tem o botão fino próprio embaixo das 3 abas (ver render).
  mes:       { rotulo: '📆 Mês', de: () => `${mesSel}-01`, ate: () => fimDoMes(mesSel), sub: () => nomeMes(mesSel, true), semAba: true },
};
let mesSel = null, diaSel = null;
const fimDoMes = m => DividasDia.somaDias(`${DividasDia.somaDias(`${m}-01`, 32).slice(0, 7)}-01`, -1);
const MESES_PT = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const nomeMes = (m, curto) => { const [y, mm] = m.split('-'), n = MESES_PT[Number(mm) - 1]; return curto ? `${n.slice(0, 3)}/${y.slice(2)}` : `${n[0].toUpperCase()}${n.slice(1)} ${y}`; };
let visao = 'hoje', DADOS = null, CONTAS = [], CONTAEMP = [], ITENS = {};
const COR = { pago: '#3fb950', pend: '#f59e0b', atr: '#f87171' };
const diaSemana = iso => new Date(iso + 'T12:00:00').toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit' });

const TITULO_WA = { mes: '📆 *DÍVIDAS DO MÊS*', hoje: '📅 *DÍVIDAS DE HOJE*', amanha: '⏭️ *DÍVIDAS DE AMANHÃ*', proximos: '🗓️ *DÍVIDAS DOS PRÓXIMOS 3 DIAS*', atrasadas: '🚨 *DÍVIDAS ATRASADAS*' };
const ROTULO_WA = { mes: 'Mês', hoje: 'Hoje', amanha: 'Amanhã', proximos: 'Próx. 3 dias', atrasadas: 'Atrasadas' };
function cabecalhoVisao() {
  const h = R.hoje, fmt = iso => new Date(iso + 'T12:00:00').toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' });
  let periodo;
  if (visao === 'atrasadas') periodo = `vencidas até ${ddmm(DividasDia.somaDias(h, -1))}`;
  else if (visao === 'mes') periodo = nomeMes(mesSel);
  else { const v = VISOES[visao], de = v.de(h), ate = v.ate(h); periodo = de === ate ? fmt(de) : `${fmt(de)} a ${fmt(ate)}`; }
  return { titulo: TITULO_WA[visao], periodo };
}

function trocarVisao(v) {
  // Abrir o calendário: dia de hoje já selecionado (se o mês mostrado for o atual).
  // Sair dele: volta pro mês atual (é o que o botão fino mostra).
  if (v === 'mes') diaSel = R.hoje.startsWith(mesSel) ? R.hoje : null;
  else mesSel = R.hoje.slice(0, 7);
  visao = v; render(); window.scrollTo({ top: 0, behavior: 'smooth' });
}
function mudarMes(delta) {
  const [y, m] = mesSel.split('-').map(Number), d = new Date(y, m - 1 + delta, 1);
  mesSel = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  diaSel = R.hoje.startsWith(mesSel) ? R.hoje : null;
  render();
}
function escolherDia(d) {
  diaSel = diaSel === d ? null : d; render();
  if (diaSel) document.getElementById('dmLista').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function itensDaVisao() {
  const h = R.hoje;
  if (visao === 'atrasadas') return R.secoes.atrasadas;
  const v = VISOES[visao];
  return DividasDia.listarPeriodo({ ...DADOS, hoje: h, de: v.de(h), ate: v.ate(h) });
}

function render() {
  const h = R.hoje;
  document.getElementById('dmData').textContent = new Date(h + 'T12:00:00').toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });
  const atr = R.secoes.atrasadas;
  document.getElementById('dmAtr').innerHTML = atr.length
    ? `<div class="dm-atr${visao === 'atrasadas' ? ' on' : ''}" onclick="trocarVisao('${visao === 'atrasadas' ? 'hoje' : 'atrasadas'}')">⚠️ ${atr.length} atrasada(s) ${visao === 'atrasadas' ? '— toque pra voltar' : '— toque pra ver'}<b>${BRL(R.totais.atrasadas)}</b></div>`
    : '';
  if (!mesSel) mesSel = h.slice(0, 7);
  document.getElementById('dmTabs').innerHTML = Object.entries(VISOES).filter(([, v]) => !v.semAba).map(([k, v]) => {
    const de = v.de(h), ate = v.ate(h);
    const sub = v.sub ? v.sub(h) : de === ate ? ddmm(de) : `${ddmm(de)} a ${ddmm(ate)}`;
    return `<button class="${visao === k ? 'on' : ''}" onclick="trocarVisao('${k}')">${v.rotulo}<small>${sub}</small></button>`;
  }).join('');
  // Botão fino do calendário: mês corrente (ou o escolhido nas setas), quanto
  // falta pagar nele e a barra de quanto já foi pago — mesmo visual de dmProg.
  const mesBtn = DividasDia.listarPeriodo({ ...DADOS, hoje: h, de: `${mesSel}-01`, ate: fimDoMes(mesSel) });
  const mPago = mesBtn.filter(i => i.pago).reduce((t, i) => t + i.valor, 0), mTot = mesBtn.reduce((t, i) => t + i.valor, 0);
  document.getElementById('dmMesBtn').innerHTML = `<button class="dm-mesbtn${visao === 'mes' ? ' on' : ''}" onclick="trocarVisao('${visao === 'mes' ? 'hoje' : 'mes'}')">
      <div class="t">📆 Calendário <span style="color:var(--text-muted);font-weight:600">· ${nomeMes(mesSel, true)}</span><b>${BRL(mTot - mPago)} a pagar</b><i>${visao === 'mes' ? '✕' : '›'}</i></div>
      <div class="trilho"><span style="width:${mTot > 0 ? Math.round(mPago / mTot * 100) : 0}%"></span></div></button>`;

  document.getElementById('dmWaBtn').innerHTML = `<i class="fab fa-whatsapp"></i> Enviar "${ROTULO_WA[visao]}" no WhatsApp`;
  const itens = itensDaVisao();
  const soma = l => l.reduce((t, i) => t + i.valor, 0);
  const res = resumoVisao(itens);
  document.getElementById('dmRes').innerHTML = `
    <div><div class="l">Total</div><div class="v">${BRL(soma(itens))}</div><div class="n">${itens.length} conta(s)</div></div>
    <div><div class="l">✅ Pago</div><div class="v" id="dmRsPago" style="color:${COR.pago}"></div><div class="n" id="dmRsPagoN"></div></div>
    <div><div class="l">🕗 A pagar</div><div class="v" id="dmRsAbr" style="color:${COR.pend}"></div><div class="n" id="dmRsAbrN"></div></div>`;
  document.getElementById('dmProg').innerHTML = itens.length
    ? '<div class="dm-prog" id="dmProgBox"><div class="t"><span id="dmProgTxt"></span><b id="dmProgPct"></b></div><div class="trilho"><div class="enche" id="dmProgBar"></div></div></div>' : '';
  pintarResumo(res, true);

  const lista = document.getElementById('dmLista');
  document.getElementById('dmCal').innerHTML = visao === 'mes' ? htmlCalendario() : '';
  if (visao === 'mes') { lista.innerHTML = htmlDiaEscolhido(); return; }
  if (!itens.length) { lista.innerHTML = `<div class="dm-vazio">Nenhuma dívida ${visao === 'atrasadas' ? 'atrasada' : 'neste período'} ✅</div>`; return; }
  // Dentro de cada empresa: a pagar primeiro, pagas no fim (sort estável).
  const porEmpresa = l => DividasDia.agruparPorEmpresa(l).map(([emp, g]) => `<div class="dm-emp">${esc(emp)}</div>` + g.slice().sort((a, b) => (a.pago ? 1 : 0) - (b.pago ? 1 : 0)).map(item).join('')).join('');
  if (visao === 'proximos' || visao === 'atrasadas') {
    const porDia = {}; itens.forEach(i => { (porDia[i.date] = porDia[i.date] || []).push(i); });
    lista.innerHTML = Object.keys(porDia).sort().map(d =>
      `<div class="dm-dia">${diaSemana(d)}<span>${BRL(soma(porDia[d]))}</span></div>` + porEmpresa(porDia[d])).join('');
  } else {
    lista.innerHTML = porEmpresa(itens);
  }
}

// ── Calendário do mês ───────────────────────────────────────────────────────
// Cor do dia = peso (a pagar do dia ÷ dia mais pesado do mês): verde → amarelo
// → vermelho. Cálculo em DividasDia.calendarioMes (mesmos itens das outras abas).
const valorCurto = v => v >= 10000 ? `${Math.round(v / 1000)}k` : v >= 1000 ? `${(v / 1000).toFixed(1).replace('.', ',')}k` : `${Math.round(v)}`;
const corPeso = p => ({ h: Math.round(120 * (1 - p)), a: (0.22 + 0.5 * p).toFixed(2) });
function htmlCalendario() {
  const c = DividasDia.calendarioMes({ ...DADOS, hoje: R.hoje, mes: mesSel });
  const celula = d => {
    if (d.foraDoMes) return '<span class="dia vazio"></span>';
    const cls = ['dia', d.aPagar > 0 ? 'pesa' : '', d.tudoPago ? 'ok' : '', d.date === R.hoje ? 'hoje' : '', d.date === diaSel ? 'sel' : ''].filter(Boolean).join(' ');
    const { h, a } = corPeso(d.peso);
    const v = d.aPagar > 0 ? valorCurto(d.aPagar) : d.tudoPago ? '✓' : '';
    return `<button class="${cls}" style="--h:${h};--a:${a}" onclick="escolherDia('${d.date}')" title="${ddmm(d.date)}: ${d.aPagar > 0 ? BRL(d.aPagar) + ' a pagar' : d.tudoPago ? 'tudo pago' : 'sem contas'}">
      <span class="n">${Number(d.date.slice(8))}</span><span class="v">${v}</span>${d.atrasada ? '<span class="flag">!</span>' : ''}</button>`;
  };
  const semanas = c.semanas.map(w => {
    const { h } = corPeso(w.peso);
    return `<div class="dm-sem${w.maisPesada ? ' pesada' : ''}"><span>${w.maisPesada ? '🔥 ' : ''}${ddmm(w.de)}–${ddmm(w.ate)}</span>
      <span class="bar"><span style="width:${Math.max(w.aPagar > 0 ? 4 : 0, Math.round(w.peso * 100))}%;--h:${h}"></span></span>
      <b>${w.aPagar > 0 ? `${BRL(w.aPagar)} · ${w.nAbr}` : '✓'}</b></div>`;
  }).join('');
  return `<div class="dm-cal">
      <div class="cab"><button onclick="mudarMes(-1)" aria-label="Mês anterior">‹</button><b>${nomeMes(mesSel)}</b><button onclick="mudarMes(1)" aria-label="Próximo mês">›</button></div>
      <div class="nomes">${['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].map(x => `<span>${x}</span>`).join('')}</div>
      <div class="grade">${c.semanas.map(w => w.dias.map(celula).join('')).join('')}</div>
      <div class="leg">leve <i></i> pesado · a pagar por dia (k = mil) · <b style="color:#f87171">!</b> atrasada · <b style="color:#3fb950">✓</b> tudo pago</div>
    </div>
    <div class="dm-sems"><div class="tit">A PAGAR POR SEMANA</div>${semanas}</div>`;
}
function htmlDiaEscolhido() {
  if (!diaSel) return '<div class="dm-vazio">👆 Toque num dia do calendário para ver e pagar as contas dele.</div>';
  const doDia = DividasDia.listarPeriodo({ ...DADOS, hoje: R.hoje, de: diaSel, ate: diaSel });
  const cab = `<div class="dm-dia">${diaSemana(diaSel)}<span>${BRL(doDia.reduce((t, i) => t + i.valor, 0))}</span></div>`;
  if (!doDia.length) return cab + `<div class="dm-vazio">Nenhuma conta em ${ddmm(diaSel)} ✅</div>`;
  return cab + DividasDia.agruparPorEmpresa(doDia).map(([emp, g]) => `<div class="dm-emp">${esc(emp)}</div>` + g.slice().sort((a, b) => (a.pago ? 1 : 0) - (b.pago ? 1 : 0)).map(item).join('')).join('');
}

// Resumo/progresso da visão atual (também usado pra animar o antes → depois).
function resumoVisao(itens = itensDaVisao()) {
  const soma = l => l.reduce((t, i) => t + i.valor, 0);
  const pagos = itens.filter(i => i.pago), abertos = itens.filter(i => !i.pago);
  return { n: itens.length, nPago: pagos.length, nAbr: abertos.length, pago: soma(pagos), abr: soma(abertos) };
}
function pintarResumo(s, barraInstantanea) {
  const set = (id, t) => { const e = document.getElementById(id); if (e) e.textContent = t; };
  set('dmRsPago', BRL(s.pago)); set('dmRsPagoN', `${s.nPago} conta(s)`);
  set('dmRsAbr', BRL(s.abr)); set('dmRsAbrN', `${s.nAbr} conta(s)`);
  progTexto(s.nPago, s.n, true);
  progBarra(s.n ? s.nPago / s.n * 100 : 0, barraInstantanea);
}
function progTexto(nPago, n, final) {
  const box = document.getElementById('dmProgBox'); if (!box) return;
  const cheio = final && n > 0 && nPago === n;
  box.classList.toggle('cheio', cheio);
  document.getElementById('dmProgTxt').textContent = cheio ? `🎉 Tudo pago — ${n} de ${n}` : `✅ ${nPago} de ${n} paga(s)`;
  document.getElementById('dmProgPct').textContent = `${n ? Math.round(nPago / n * 100) : 0}%`;
}
function progBarra(pct, instantanea) {
  const bar = document.getElementById('dmProgBar'); if (!bar) return;
  if (instantanea) { bar.style.transition = 'none'; bar.style.width = pct + '%'; void bar.offsetWidth; bar.style.transition = ''; }
  else bar.style.width = pct + '%';
}

function item(i) {
  const st = i.pago ? 'pago' : (i.atrasada ? 'atr' : 'pend');
  const chip = `<span class="dm-st ${st}">${i.pago ? '✅ Pago' : i.atrasada ? '⚠️ Atrasada' : '🕗 A pagar'}</span>`;
  const desc = i.fatura ? esc(i.nome) : esc(i.nome || i.fornecedor || '(sem descrição)');
  const meta = i.fatura
    ? `${i.parcelas} parcela(s) · vence ${ddmm(i.date)}`
    : [i.fornecedor && i.nome && i.fornecedor.toLowerCase() !== i.nome.toLowerCase() ? esc(i.fornecedor) : '', TIPO[i.tipo] || esc(i.tipo), 'vence ' + ddmm(i.date)].filter(Boolean).join(' · ');
  const val = i.valor > 0 ? BRL(i.valor) : '<span style="font-size:11px;color:var(--text-muted)">valor a<br>confirmar</span>';
  ITENS[i.id] = i;
  const acao = !i.pago ? `<button class="dm-pagar" onclick="abrirPagar('${esc(i.id)}')">Pagar</button>`
    : (!i.fatura ? `<button class="dm-desfazer" onclick="desfazer('${esc(i.id)}')">desfazer</button>` : '');
  return `<div class="dm-item ${i.pago ? 'pago' : ''}" data-id="${esc(i.id)}" style="--c:${COR[st]}">${i.pago ? '<span class="dm-carimbo">PAGO</span>' : ''}<div class="info"><div class="desc"><span class="tx">${desc}</span></div><div class="meta">${chip}${meta}</div></div><div class="lado"><div class="val">${val}</div>${acao}</div></div>`;
}

// ── Pagar (mesma rotina do botão Pagar da página Boletos: js/pagamentosFin.js) ──
// Boleto: escolhe a conta de onde saiu o dinheiro → status 'pago' + saída no
// Fluxo de Caixa. Fatura de cartão: quita as parcelas pendentes + saída no FC.
function fecharSheet() { document.getElementById('dmOv').style.display = 'none'; }
function erroSheet(t) { const e = document.getElementById('dmErro'); if (e) e.textContent = t || ''; }

function abrirPagar(id) {
  const i = ITENS[id]; if (!i) return;
  const desc = esc(i.nome || i.fornecedor || 'dívida');
  let corpo;
  if (i.fatura) {
    corpo = `<h3>💳 Pagar ${desc}</h3>
      <div class="sub">Quita ${i.pendentes.length} parcela(s) · vence ${ddmm(i.date)} · <b>${BRL(i.valor)}</b></div>`;
  } else {
    const contas = PagamentosFin.contasDaEmpresa(CONTAS, CONTAEMP, i.ref.empresa);
    const opts = contas.length ? contas.map(c => `<option value="${esc(c.id)}">${esc(c.nome || c.banco_nome || '—')}</option>`).join('') : '<option value="">— sem conta cadastrada —</option>';
    corpo = `<h3>Pagar ${desc}</h3>
      <div class="sub">${i.fornecedor && i.fornecedor !== i.nome ? esc(i.fornecedor) + ' · ' : ''}vence ${ddmm(i.date)}${i.ref.empresa ? ' · ' + esc(i.ref.empresa) : ''}${i.valor > 0 ? ` · <b>${BRL(i.valor)}</b>` : ''}</div>
      ${i.valor > 0 ? '' : '<label>Valor pago (R$) — esta dívida está sem valor</label><input id="dmValor" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0,00">'}
      <label>De qual conta saiu o pagamento?</label><select id="dmConta">${opts}</select>`;
  }
  document.getElementById('dmSheet').innerHTML = corpo + `<div class="erro" id="dmErro"></div>
    <div class="acoes"><button class="cancelar" onclick="fecharSheet()">Cancelar</button><button class="confirmar" id="dmConfirmar" onclick="confirmarPagamento('${esc(id)}')">Confirmar pagamento</button></div>`;
  document.getElementById('dmOv').style.display = 'flex';
}

async function confirmarPagamento(id) {
  const i = ITENS[id]; if (!i) return;
  const btn = document.getElementById('dmConfirmar');
  const hoje = DividasDia.hojeLocal();
  let extra = {};
  if (!i.fatura && !(i.valor > 0)) {
    const v = parseFloat(String(document.getElementById('dmValor').value).replace(',', '.'));
    if (!(v > 0)) { erroSheet('Informe o valor pago.'); return; }
    extra = { value: Math.round(v * 100) / 100 };
  }
  prepararSom(); // ainda dentro do toque: iPhone só libera áudio assim
  const antes = { res: resumoVisao(), atr: R.secoes.atrasadas.length, atrTotal: R.totais.atrasadas, atrOn: visao === 'atrasadas', pos: posicoesCards() };
  btn.disabled = true; btn.textContent = 'Pagando…'; erroSheet('');
  if (i.fatura) {
    const r = await PagamentosFin.pagarFatura(DB, { cartao: i.cartao, faturaMes: i.faturaMes, pendentes: i.pendentes, hoje });
    (r.pagas || []).forEach(pid => { const p = DADOS.parcelas.find(x => String(x.id) === String(pid)); if (p) p.status = 'pago'; });
    if (r.erro) { btn.disabled = false; btn.textContent = 'Confirmar pagamento'; erroSheet('Erro: ' + r.erro); recalcular(); return; }
    msg(`✅ Fatura paga · ${BRL(r.total)} lançado no Fluxo de Caixa`);
    avisarDono(i, { valor: r.total || i.valor });
  } else {
    const contaId = document.getElementById('dmConta').value || null;
    const r = await PagamentosFin.pagarBoleto(DB, i.ref, contaId, hoje, extra);
    if (r.erro) { btn.disabled = false; btn.textContent = 'Confirmar pagamento'; erroSheet('Erro: ' + r.erro); return; }
    Object.assign(i.ref, { status: 'pago' }, extra);
    msg(r.erroFC ? '⚠️ Pago, mas o Fluxo de Caixa não sincronizou: ' + esc(r.erroFC) : `✅ Pago · ${BRL(i.ref.value)} lançado no Fluxo de Caixa`, !!r.erroFC);
    const conta = CONTAS.find(c => String(c.id) === String(contaId));
    avisarDono(i, { valor: Number(i.ref.value) || 0, conta: conta ? (conta.nome || conta.banco_nome || '') : '' });
  }
  fecharSheet(); recalcular();
  celebrarPagamento(i, i.fatura ? i.valor : Number(i.ref.value) || 0, antes);
}

// ── Animação de pagamento ─────────────────────────────────────────────────
// 1) Caixa "Pago!" (6s ou até tocar): ✅ desenhado, valor contando de R$ 0,00,
//    frase aleatória, som cha-ching, confete, 💸 voando e a mãozinha puxando.
//    Última conta da aba → "Tudo pago! 🎉" + troféu 🏆 descendo + fogos 🎆.
// 2) Ao fechar, na lista: carimbo PAGO bate no card (tela treme), texto é
//    riscado, o card desce pro fim do grupo, Pago/A pagar contam até o valor
//    novo, a barra de progresso enche e, se zerou as atrasadas, o banner
//    vermelho vira verde. Com "reduzir movimento": sem confete/fogos/tremida,
//    tudo aparece direto no estado final (o som continua).
const EMOJI_DINHEIRO = ['💸', '💵', '💰', '💸', '🤑'];
const CORES_CONFETE = ['#3fb950', '#8b5cf6', '#f59e0b', '#60a5fa', '#f87171', '#facc15', '#34d399'];
const FRASES = ['Mandou bem! 💪', 'Menos uma! 🔥', 'Boleto vencido? Hoje não! 😎', 'Conta paga, mente tranquila 😌', 'Pagou, riscou, zerou! ✍️', 'Uma a menos pra se preocupar 🙌', 'Show! O caixa agradece 💰', 'Organização é tudo! 📈'];
const FRASES_TUDO = ['Zerou tudo! Você é fera 🏆', 'Nenhuma pendência, que orgulho! 🥇', 'Missão cumprida! 🚀'];
const ZERADO = { mes: 'Mês zerado!', hoje: 'Dia zerado!', amanha: 'Amanhã zerado!', proximos: '3 dias zerados!', atrasadas: 'Atrasadas zeradas!' };
const sorteia = l => l[Math.floor(Math.random() * l.length)];
const vibrar = p => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (_) {} };

function posicoesCards() {
  const pos = {};
  document.querySelectorAll('#dmLista .dm-item').forEach(el => { pos[el.dataset.id] = el.getBoundingClientRect().top + scrollY; });
  return pos;
}
function contar(de, ate, ms, aCada) {
  const t0 = performance.now();
  const f = agora => { const p = Math.min(1, (agora - t0) / ms), e = 1 - Math.pow(1 - p, 3); aCada(de + (ate - de) * e, p === 1); if (p < 1) requestAnimationFrame(f); };
  requestAnimationFrame(f);
}

function celebrarPagamento(i, valor, antes) {
  const reduzir = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const depois = resumoVisao();
  const faltam = depois.nAbr, tudoPago = faltam === 0;
  const atrZerou = !!antes && antes.atr > 0 && R.secoes.atrasadas.length === 0;
  if (!reduzir) vibrar(tudoPago ? [40, 60, 40, 60, 120] : [35, 50, 70]);
  som(tudoPago ? 'festa' : 'chaching');

  // Lista fica no estado "antes" (visualmente) por baixo da caixa; anima depois.
  const card = document.querySelector(`.dm-item[data-id="${CSS.escape(String(i.id))}"]`);
  let movidos = [];
  if (antes) {
    if (atrZerou) document.getElementById('dmAtr').innerHTML = `<div class="dm-atr${antes.atrOn ? ' on' : ''}" id="dmAtrBan">⚠️ ${antes.atr} atrasada(s)<b>${BRL(antes.atrTotal)}</b></div>`;
    if (!reduzir) {
      pintarResumo(antes.res, true);
      if (card) card.classList.add('espera-carimbo', 'espera-risco');
      document.querySelectorAll('#dmLista .dm-item').forEach(el => {
        const y0 = antes.pos[el.dataset.id]; if (y0 == null) return;
        const dy = y0 - (el.getBoundingClientRect().top + scrollY);
        if (Math.abs(dy) < 1) return;
        el.style.transition = 'none'; el.style.transform = `translateY(${dy}px)`; movidos.push(el);
      });
      if (card) card.style.zIndex = '2';
    }
  }

  document.querySelectorAll('.dm-cel').forEach(e => e.remove());
  const ov = document.createElement('div');
  ov.className = 'dm-cel';
  let confete = '';
  if (!reduzir) {
    const n = tudoPago ? 60 : 45;
    for (let k = 0; k < n; k++) {
      const cor = CORES_CONFETE[k % CORES_CONFETE.length];
      const dur = (3.8 + Math.random() * 1.4).toFixed(2), atraso = (Math.random() * 1.2).toFixed(2);
      confete += `<i class="dm-conf" style="left:${(Math.random() * 100).toFixed(1)}%;background:${cor};--dx:${Math.round(Math.random() * 160 - 80)}px;--rot:${Math.round(Math.random() * 720 - 360)}deg;animation-duration:${dur}s;animation-delay:${atraso}s;${k % 3 === 0 ? 'border-radius:50%;width:8px;height:8px;' : ''}"></i>`;
    }
    const notas = tudoPago ? 22 : 12;
    for (let k = 0; k < notas; k++) {
      const dur = (4 + Math.random() * 1.2).toFixed(2), atraso = (Math.random() * 1.4).toFixed(2);
      confete += `<span class="dm-din" style="left:${(Math.random() * 92).toFixed(1)}%;font-size:${26 + Math.round(Math.random() * 18)}px;--dx:${Math.round(Math.random() * 120 - 60)}px;--rot:${Math.round(Math.random() * 60 - 30)}deg;animation-duration:${dur}s;animation-delay:${atraso}s">${EMOJI_DINHEIRO[k % EMOJI_DINHEIRO.length]}</span>`;
    }
  }
  const frase = tudoPago ? sorteia(FRASES_TUDO) : (i.atrasada ? 'Atrasada resolvida! Ufa 😮‍💨' : sorteia(FRASES));
  ov.innerHTML = confete + `<div class="dm-cel-box">
      ${tudoPago ? `<div class="dm-trofeu"><span>🏆</span><b>${ZERADO[visao] || 'Dia zerado!'}</b></div>` : ''}
      <svg viewBox="0 0 88 88"><circle class="circ" cx="44" cy="44" r="40"/><path class="chk" d="M26 45 l12 12 l24 -26"/></svg>
      <h2>${tudoPago ? 'Tudo pago! 🎉' : 'Pago!'}</h2>
      <div class="nome">${esc(i.nome || i.fornecedor || 'Dívida')}</div>
      <div class="valor">${valor > 0 ? BRL(reduzir ? valor : 0) : ''}</div>
      <div class="frase">${frase}</div>
      <div class="extra">${tudoPago ? 'Nenhuma conta a pagar nesta lista 🙌' : `Faltam ${faltam} conta(s) nesta lista`} · lançado no Fluxo de Caixa</div>
    </div>`;
  let fechado = false;
  const fechar = () => {
    if (fechado) return; fechado = true;
    ov.classList.add('saindo');
    setTimeout(() => { ov.remove(); animarLista({ card, antes, depois, movidos, atrZerou, reduzir }); }, 500);
  };
  ov.addEventListener('click', fechar);
  document.body.appendChild(ov);
  if (!reduzir) {
    const elValor = ov.querySelector('.valor');
    if (valor > 0) setTimeout(() => contar(0, valor, 1300, (v, fim) => { elValor.textContent = BRL(fim ? valor : v); }), 300);
    maoPuxaDinheiro(ov);
    if (tudoPago) fogos(ov);
  }
  setTimeout(fechar, 6000);
}

// Etapa 2 (depois que a caixa fecha): carimbo → tremida → risco → card desce +
// resumo/progresso contando → banner de atrasadas verde.
function animarLista({ card, antes, depois, movidos, atrZerou, reduzir }) {
  const vivo = card && card.isConnected ? card : null;
  if (reduzir || !antes) {
    if (vivo) vivo.classList.add('recem-pago');
    if (atrZerou) bannerAtrasadasOk();
    return;
  }
  const passo = (ms, fn) => setTimeout(fn, ms);
  if (vivo) vivo.scrollIntoView({ block: 'center', behavior: 'smooth' });
  passo(350, () => {
    if (!vivo) return;
    vivo.classList.remove('espera-carimbo'); vivo.classList.add('recem-pago');
    const c = vivo.querySelector('.dm-carimbo'); if (c) c.classList.add('bate');
  });
  passo(560, () => {
    const w = document.querySelector('.dm-wrap');
    w.classList.remove('treme'); void w.offsetWidth; w.classList.add('treme');
    setTimeout(() => w.classList.remove('treme'), 400);
    if (vivo) { vibrar(40); som('carimbo'); }
  });
  passo(950, () => { if (vivo) vivo.classList.remove('espera-risco'); });
  passo(1550, () => {
    movidos.forEach(el => {
      if (!el.isConnected) return;
      el.style.transition = 'transform .75s cubic-bezier(.4,0,.2,1)'; el.style.transform = '';
      setTimeout(() => { el.style.transition = ''; el.style.zIndex = ''; }, 800);
    });
    if (vivo && !movidos.includes(vivo)) vivo.style.zIndex = '';
    animarResumo(antes.res, depois);
  });
  passo(1750, () => { if (atrZerou) bannerAtrasadasOk(); });
}

function animarResumo(a, d) {
  const els = ['dmRsPago', 'dmRsPagoN', 'dmRsAbr', 'dmRsAbrN'].map(id => document.getElementById(id));
  if (els.some(e => !e)) return;
  [els[0], els[2]].forEach(e => { const box = e.parentElement; box.classList.remove('pulsa'); void box.offsetWidth; box.classList.add('pulsa'); });
  const bar = document.getElementById('dmProgBar');
  if (bar) { bar.classList.add('enchendo'); setTimeout(() => bar.classList.remove('enchendo'), 2100); }
  progBarra(d.n ? d.nPago / d.n * 100 : 0);
  const lerp = (x, y, p) => x + (y - x) * p;
  contar(0, 1, 900, (p, fim) => {
    if (fim) { pintarResumo(d); return; }
    els[0].textContent = BRL(lerp(a.pago, d.pago, p)); els[1].textContent = `${Math.round(lerp(a.nPago, d.nPago, p))} conta(s)`;
    els[2].textContent = BRL(lerp(a.abr, d.abr, p)); els[3].textContent = `${Math.round(lerp(a.nAbr, d.nAbr, p))} conta(s)`;
    progTexto(Math.round(lerp(a.nPago, d.nPago, p)), d.n, false);
  });
}

function bannerAtrasadasOk() {
  const b = document.getElementById('dmAtrBan'); if (!b) return;
  b.classList.remove('on'); b.classList.add('ok');
  b.innerHTML = '✅ Nenhuma atrasada<b>R$ 0,00</b>';
  setTimeout(() => { if (!b.isConnected) return; b.classList.add('some'); setTimeout(() => b.remove(), 600); }, 5000);
}

// 🎆 Fogos (só no "tudo pago"): canvas atrás da caixa; foguetes sobem e
// explodem em partículas com gravidade e rastro. Para sozinho em ~5,5s.
function fogos(ov) {
  const cv = document.createElement('canvas'); cv.className = 'dm-fogos';
  ov.insertBefore(cv, ov.firstChild);
  const dpr = Math.min(2, window.devicePixelRatio || 1), W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext('2d'); if (!g) return; g.scale(dpr, dpr);
  const lancamentos = [150, 600, 1000, 1500, 1900, 2500, 3000, 3600];
  const foguetes = [], parts = [], t0 = performance.now();
  let ultimo = t0, prox = 0;
  const explodir = f => {
    const n = 55 + Math.floor(Math.random() * 25);
    for (let k = 0; k < n; k++) {
      const ang = Math.PI * 2 * k / n + Math.random() * 0.2, vel = 90 + Math.random() * 190;
      parts.push({ x: f.x, y: f.y, vx: Math.cos(ang) * vel, vy: Math.sin(ang) * vel, vida: 1.1 + Math.random() * 0.8, idade: 0, cor: Math.random() < 0.8 ? f.cor : '#fff' });
    }
    if (prox < 4) som('estouro');
  };
  const quadro = agora => {
    if (!ov.isConnected) return;
    const t = agora - t0, dt = Math.min(0.05, (agora - ultimo) / 1000); ultimo = agora;
    while (prox < lancamentos.length && t >= lancamentos[prox]) {
      foguetes.push({ x: W * (0.15 + Math.random() * 0.7), y: H + 10, alvo: H * (0.12 + Math.random() * 0.33), cor: sorteia(CORES_CONFETE) });
      prox++;
    }
    g.globalCompositeOperation = 'destination-out'; g.fillStyle = 'rgba(0,0,0,.22)'; g.fillRect(0, 0, W, H);
    g.globalCompositeOperation = 'lighter';
    for (let k = foguetes.length - 1; k >= 0; k--) {
      const f = foguetes[k]; f.y -= Math.max(4, (f.y - f.alvo) * 5.5 * dt + 2);
      g.fillStyle = '#ffe9a8'; g.beginPath(); g.arc(f.x, f.y, 2.4, 0, 7); g.fill();
      if (f.y <= f.alvo + 4) { explodir(f); foguetes.splice(k, 1); }
    }
    for (let k = parts.length - 1; k >= 0; k--) {
      const p = parts[k]; p.idade += dt;
      if (p.idade >= p.vida) { parts.splice(k, 1); continue; }
      p.vx *= 0.985; p.vy = p.vy * 0.985 + 150 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      g.globalAlpha = 1 - p.idade / p.vida; g.fillStyle = p.cor;
      g.beginPath(); g.arc(p.x, p.y, 2.2, 0, 7); g.fill();
    }
    g.globalAlpha = 1;
    if (t < 6000 && (prox < lancamentos.length || foguetes.length || parts.length)) requestAnimationFrame(quadro);
  };
  requestAnimationFrame(quadro);
}

// 🔔 Sons sintetizados (Web Audio, sem arquivo). O contexto é criado/retomado
// dentro do toque em "Confirmar" (prepararSom) — exigência do iPhone.
let AUDIO = null;
function prepararSom() {
  try {
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    AUDIO = AUDIO || new C();
    if (AUDIO.state === 'suspended') AUDIO.resume();
  } catch (_) { AUDIO = null; }
}
function som(tipo) {
  const ctx = AUDIO; if (!ctx) return;
  try {
    const t = ctx.currentTime + 0.03;
    const saida = ctx.createGain(); saida.gain.value = 0.55; saida.connect(ctx.destination);
    const ruido = (t0, dur, freq, vol, tipoFiltro = 'bandpass') => {
      const len = Math.max(1, Math.floor(ctx.sampleRate * dur)), buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
      for (let k = 0; k < len; k++) d[k] = (Math.random() * 2 - 1) * Math.pow(1 - k / len, 2);
      const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), gn = ctx.createGain();
      src.buffer = buf; f.type = tipoFiltro; f.frequency.value = freq; f.Q.value = 0.8; gn.gain.value = vol;
      src.connect(f); f.connect(gn); gn.connect(saida); src.start(t0);
    };
    const sino = (freq, t0, dur, vol) => [1, 2.76, 5.4].forEach((m, j) => {
      const o = ctx.createOscillator(), gn = ctx.createGain();
      o.type = 'sine'; o.frequency.value = freq * m;
      gn.gain.setValueAtTime(0.0001, t0);
      gn.gain.exponentialRampToValueAtTime(vol / (j + 1), t0 + 0.005);
      gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur / (j + 1));
      o.connect(gn); gn.connect(saida); o.start(t0); o.stop(t0 + dur);
    });
    if (tipo === 'chaching' || tipo === 'festa') {
      ruido(t, 0.12, 3500, 0.9);              // "cha": gaveta da caixa registradora
      sino(1318.5, t + 0.1, 1.2, 0.35);       // "ching"
      sino(1760, t + 0.18, 1.4, 0.3);
      if (tipo === 'festa') [2093, 2637, 3136].forEach((f, k) => sino(f, t + 0.55 + k * 0.12, 1, 0.18));
    } else if (tipo === 'moeda') {
      sino(2637, t, 0.35, 0.16); sino(3136, t + 0.07, 0.35, 0.12);
    } else if (tipo === 'carimbo') {
      const o = ctx.createOscillator(), gn = ctx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(170, t); o.frequency.exponentialRampToValueAtTime(55, t + 0.14);
      gn.gain.setValueAtTime(0.9, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      o.connect(gn); gn.connect(saida); o.start(t); o.stop(t + 0.2);
      ruido(t, 0.06, 900, 0.6, 'lowpass');
    } else if (tipo === 'estouro') {
      ruido(t, 0.35, 600, 0.5, 'lowpass');
    }
  } catch (_) {}
}

// Mãozinha: entra 3,2s → puxa as notas (posição atual de cada uma, lida em
// pleno voo) até a palma 3,6s → fecha ✊ ~4,9s → sai pra baixo 5,2s.
function maoPuxaDinheiro(ov) {
  const mao = document.createElement('span');
  mao.className = 'dm-mao'; mao.textContent = '✋';
  ov.appendChild(mao);
  const passo = (ms, fn) => setTimeout(() => { if (ov.isConnected) fn(); }, ms);
  passo(3200, () => mao.classList.add('entra'));
  passo(3600, () => {
    const m = mao.getBoundingClientRect();
    const alvoX = m.left + m.width / 2, alvoY = m.top + m.height * 0.45;
    ov.querySelectorAll('.dm-din').forEach((el, k) => {
      const r = el.getBoundingClientRect();
      const top = Math.max(-40, Math.min(r.top, innerHeight - 40));
      Object.assign(el.style, { animation: 'none', bottom: 'auto', left: `${r.left}px`, top: `${top}px`, opacity: '1', transform: 'none', zIndex: '4' });
      void el.offsetWidth; // aplica a posição antes de começar a transição
      const atraso = (k % 8) * 0.05;
      el.style.transition = `transform .9s cubic-bezier(.55,0,.8,.45) ${atraso}s, opacity .25s ease-in ${atraso + 0.7}s`;
      el.style.transform = `translate(${alvoX - r.left - r.width / 2}px, ${alvoY - top - r.height / 2}px) scale(.3) rotate(${k % 2 ? 25 : -25}deg)`;
      el.style.opacity = '0';
    });
  });
  passo(4900, () => { mao.textContent = '✊'; mao.classList.add('pega'); vibrar(30); som('moeda'); });
  passo(5200, () => { mao.classList.remove('pega'); mao.classList.add('sai'); });
}

async function desfazer(id) {
  const i = ITENS[id]; if (!i || i.fatura) return;
  if (!confirm(`Desfazer o pagamento de "${i.nome}"? A saída no Fluxo de Caixa será apagada.`)) return;
  const r = await PagamentosFin.desfazerPagamentoBoleto(DB, i.ref, DividasDia.hojeLocal());
  if (r.erro) { msg('Erro: ' + esc(r.erro), true); return; }
  i.ref.status = 'pendente';
  msg(r.erroFC ? '⚠️ Voltou pra pendente, mas o Fluxo de Caixa não sincronizou: ' + esc(r.erroFC) : '↩️ Pagamento desfeito — voltou pra "a pagar".', !!r.erroFC);
  recalcular();
  avisarDono(i, { valor: Number(i.ref.value) || 0, desfeito: true });
}

// 🔔 Aviso no Telegram pro dono (POST /api/financeiro/aviso-pagamento):
// "✅ BOLETO MARTINS pago — R$ 1.219,02 · Itaú" + quanto ainda falta de hoje.
// Fire-and-forget: o pagamento já foi gravado; falha no aviso não atrapalha.
function avisarDono(i, extra) {
  if (!DB.avisarPagamento) return;
  try {
    const hoje = DividasDia.hojeLocal();
    const rr = DividasDia.calcular({ ...DADOS, hoje });
    DB.avisarPagamento({
      nome: i.nome || i.fornecedor || 'Dívida', empresa: i.fatura ? '' : i.empresa, vencimento: i.date,
      atrasada: !!i.atrasada || i.date < hoje, fatura: !!i.fatura, parcelas: i.fatura ? i.parcelas : null,
      faltam_hoje: { n: rr.secoes.hoje.length, valor: rr.totais.hoje }, ...extra,
    }).catch(() => {});
  } catch (e) { console.warn('[dividas] aviso de pagamento não enviado:', e.message); }
}

function recalcular() { R = DividasDia.calcular({ ...DADOS, hoje: DividasDia.hojeLocal() }); render(); }

async function enviarWhatsapp() {
  if (!R) return;
  let numero = CFG.numero;
  if (!numero) {
    const n = (prompt('WhatsApp do responsável (DDD + número):') || '').replace(/\D/g, '');
    if (n.length < 10 || n.length > 13) { msg('Número inválido — use DDD + número.', true); return; }
    const rs = await DB.setWhatsappBoletosConfig(n, CFG.nome || '');
    if (rs && rs.error) { msg('Não salvei o número: ' + esc(rs.error), true); return; }
    CFG.numero = numero = n;
  }
  // Só a lista do botão selecionado (Hoje / Amanhã / Próx. 3 dias / Atrasadas),
  // com todas as dívidas dela e o status de cada uma.
  window.location.href = DividasDia.linkWhatsapp(numero, DividasDia.textoWhatsappLista({ ...cabecalhoVisao(), itens: itensDaVisao(), nome: CFG.nome }));
}

// ── PWA: instalar app + notificação push das 07:00 ─────────────────────────
// Service worker = /sw.js da raiz (o mesmo do painel, rede-primeiro, nunca
// cacheia /api) — ganhou os handlers de push. A inscrição vai pro servidor
// (POST /api/financeiro/push/inscrever) e o worker manda às 07:00 o que vence
// hoje + atrasadas (mesmo cálculo desta página). iPhone: só funciona com o app
// instalado na Tela de Início (iOS 16.4+), por isso a instrução.
let INSTALAR = null;
const ehIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const instalado = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const suportaPush = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const chaveU8 = b64 => { const p = '='.repeat((4 - b64.length % 4) % 4), raw = atob((b64 + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(raw, c => c.charCodeAt(0)); };
async function registroSW() { if (!('serviceWorker' in navigator)) return null; await navigator.serviceWorker.register('/sw.js'); return navigator.serviceWorker.ready; }
async function inscricaoAtual() { try { const reg = await registroSW(); return reg && reg.pushManager ? await reg.pushManager.getSubscription() : null; } catch (_) { return null; } }

async function marcarSino() {
  const b = document.getElementById('dmSinoBtn'); if (!b) return;
  const sub = suportaPush() ? await inscricaoAtual() : null;
  b.classList.toggle('on', !!sub);
  b.classList.toggle('aviso', !sub && (suportaPush() || !!INSTALAR || (ehIOS() && !instalado())));
}

async function abrirNotificacoes() {
  const sub = suportaPush() ? await inscricaoAtual() : null;
  let notif;
  if (!suportaPush()) {
    notif = ehIOS() && !instalado()
      ? '<b class="t">🔔 Notificações</b>No iPhone, primeiro instale o app (abaixo) e abra pelo ícone da Tela de Início — aí o botão de ativar aparece aqui.'
      : '<b class="t">🔔 Notificações</b>Este navegador não suporta notificações. Use o Chrome (Android) ou o app instalado (iPhone).';
  } else if (Notification.permission === 'denied') {
    notif = '<b class="t">🔕 Notificações bloqueadas</b>Você bloqueou as notificações deste site. Libere nas configurações do navegador (cadeado ao lado do endereço → Notificações → Permitir) e volte aqui.';
  } else if (sub) {
    notif = `<b class="t">✅ Notificações ativadas neste aparelho</b>Todo dia às <b>07:00</b> chega o que vence hoje e o que está atrasado.
      <div class="lado2"><button class="sec" onclick="testarNotificacao()">Enviar teste</button><button class="sec" onclick="desativarNotificacao()">Desativar</button></div>`;
  } else {
    notif = `<b class="t">🔔 Receber aviso das contas</b>Todo dia às <b>07:00</b>: "💸 3 contas vencem hoje — R$ …", mesmo com o app fechado.
      <button onclick="ativarNotificacao()">Ativar notificações</button>`;
  }
  let inst;
  if (instalado()) inst = '<b class="t">📲 App instalado</b>Você está usando o app da Tela de Início.';
  else if (INSTALAR) inst = '<b class="t">📲 Instalar na Tela de Início</b>Ícone próprio, abre direto nas dívidas, sem barra do navegador.<button onclick="instalarApp()">Instalar app</button>';
  else if (ehIOS()) inst = '<b class="t">📲 Instalar no iPhone</b>No Safari, toque em <b>Compartilhar</b> (quadrado com seta ⬆️) → <b>Adicionar à Tela de Início</b> → Adicionar. Depois abra pelo ícone 💸.';
  else inst = '<b class="t">📲 Instalar na Tela de Início</b>No menu do navegador (⋮), toque em <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.';
  document.getElementById('dmSheet').innerHTML = `<h3>Notificações e app</h3><div class="sub">Dívidas do Dia no celular</div>
    <div class="bloco">${notif}</div><div class="bloco">${inst}</div><div class="erro" id="dmErro"></div>
    <div class="acoes" style="grid-template-columns:1fr"><button class="cancelar" onclick="fecharSheet()">Fechar</button></div>`;
  document.getElementById('dmOv').style.display = 'flex';
}

async function ativarNotificacao() {
  try {
    // Pedir a permissão PRIMEIRO, ainda dentro do toque (iPhone exige).
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { erroSheet('Permissão não concedida — sem ela não dá pra avisar.'); return; }
    const reg = await registroSW();
    const k = await DB.getPushChave();
    if (!k || k.error || !k.publicKey) { erroSheet('Servidor sem chave de notificação: ' + (k && k.error || 'erro')); return; }
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: chaveU8(k.publicKey) });
    const r = await DB.inscreverPush(sub.toJSON());
    if (!r) { await sub.unsubscribe().catch(() => {}); erroSheet('Não consegui salvar no servidor: ' + esc(DB.lastError || 'erro')); return; }
    await DB.testarPush(sub.endpoint);
    msg('🔔 Notificações ativadas — mandei uma de teste agora.');
    await marcarSino(); abrirNotificacoes();
  } catch (e) { erroSheet('Erro ao ativar: ' + esc(e.message || e)); }
}
async function testarNotificacao() {
  const sub = await inscricaoAtual(); if (!sub) { abrirNotificacoes(); return; }
  const r = await DB.testarPush(sub.endpoint);
  if (!r) erroSheet(esc(DB.lastError || 'Não consegui enviar o teste.')); else msg('📨 Teste enviado — deve chegar em segundos.');
}
async function desativarNotificacao() {
  const sub = await inscricaoAtual();
  if (sub) { await DB.cancelarPush(sub.endpoint); await sub.unsubscribe().catch(() => {}); }
  msg('🔕 Notificações desativadas neste aparelho.');
  await marcarSino(); abrirNotificacoes();
}
async function instalarApp() {
  if (!INSTALAR) return;
  INSTALAR.prompt();
  const { outcome } = await INSTALAR.userChoice.catch(() => ({}));
  INSTALAR = null;
  if (outcome === 'accepted') msg('📲 App instalado — procure o ícone 💸 na tela inicial.');
  marcarSino(); abrirNotificacoes();
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); INSTALAR = e; marcarSino(); });
window.addEventListener('appinstalled', () => { INSTALAR = null; marcarSino(); });
window.addEventListener('load', () => { registroSW().catch(() => {}); marcarSino(); });

carregar();
</script>
</body>
