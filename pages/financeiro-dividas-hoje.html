// ── ➕ Adicionar boleto / dívida pela CÂMERA ───────────────────────────────
// Botão "➕ Adicionar dívida" (barra de baixo) → câmera lê o código de barras
// do boleto ou o QR PIX → js/boletoCodigo.js decodifica (valor, vencimento,
// banco; confere os dígitos) → procura a dívida já cadastrada (código salvo,
// senão valor + vencimento). Achou → Pagar (mesmo fluxo de sempre; o código
// fica salvo em boletos_mensais.codigo_barras). Não achou → formulário de
// cadastro já com valor/vencimento; o que o código não traz (nome, empresa,
// fornecedor, categoria — e o vencimento em conta de luz/imposto) é digitado
// aqui mesmo. Também dá pra digitar/colar a linha ou cadastrar sem código.
// Leitor: BarcodeDetector nativo (Android/Chrome) ou ZXing por CDN (iPhone e
// o resto), carregado só quando a câmera abre. Código de barras só é aceito
// depois de 2 leituras iguais seguidas (o DV bancário deixa passar erro raro).
const ZXING_URL = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
const EMPRESAS_PADRAO = ['UNIFULL', 'TOP MIX', 'R SOUZA', 'SHOPEE'];
// Mesmos tipos/rótulos do "➕ Cadastrar Dívida" da página Boletos (sem Cartão:
// compra parcelada no cartão continua sendo cadastrada lá, gera as parcelas).
const TIPOS_NOVA = [['boleto', 'Boleto'], ['manual', 'Imposto'], ['pessoal', 'Pessoal'], ['fatura_ml', 'Fatura ML'], ['flex', 'Flex'], ['folha_pagamento', 'Folha de Pagamento'], ['custo_fixo', 'Custo Fixo'], ['custo_variavel', 'Custo Variável']];
let NV_TIPO = 'boleto';
const SCAN = { stream: null, timer: null, leitor: null, ultimo: null, iguais: 0, leitura: null, ocupado: false };
let _zxing = null;
const corpoScan = () => document.getElementById('dmScanCorpo');

function carregarZXing() {
  if (window.ZXing) return Promise.resolve(window.ZXing);
  if (!_zxing) _zxing = new Promise((ok, falha) => {
    const sc = document.createElement('script'); sc.src = ZXING_URL; sc.async = true;
    sc.onload = () => window.ZXing ? ok(window.ZXing) : falha(new Error('leitor não carregou'));
    sc.onerror = () => { _zxing = null; falha(new Error('sem internet para carregar o leitor')); };
    document.head.appendChild(sc);
  });
  return _zxing;
}

// Monta o leitor: nativo se o aparelho lê ITF (código de barras de boleto),
// senão ZXing. Devolve async (canvas|video) → texto ou null.
async function criarLeitor() {
  if ('BarcodeDetector' in window) {
    try {
      const sup = await BarcodeDetector.getSupportedFormats();
      if (sup.includes('itf')) {
        const det = new BarcodeDetector({ formats: ['itf', 'qr_code'].filter(f => sup.includes(f)) });
        return async fonte => { const r = await det.detect(fonte); return r.length ? r[0].rawValue : null; };
      }
    } catch (_) { /* cai pro ZXing */ }
  }
  const ZX = await carregarZXing();
  const dicas = new Map();
  dicas.set(ZX.DecodeHintType.POSSIBLE_FORMATS, [ZX.BarcodeFormat.ITF, ZX.BarcodeFormat.QR_CODE]);
  dicas.set(ZX.DecodeHintType.TRY_HARDER, true);
  const leitor = new ZX.MultiFormatReader();
  return async canvas => {
    try { return leitor.decode(new ZX.BinaryBitmap(new ZX.HybridBinarizer(new ZX.HTMLCanvasElementLuminanceSource(canvas))), dicas).getText(); }
    catch (_) { return null; }
  };
}

function abrirAdicionar() {
  prepararSom();
  document.getElementById('dmScanTit').textContent = '📷 Ler boleto';
  corpoScan().innerHTML = `
    <div class="cam"><video id="dmScanVideo" playsinline muted autoplay></video><div class="mira"></div>
      <button class="luz" id="dmScanLuz" onclick="alternarLanterna()" aria-label="Lanterna">🔦</button>
      <div class="dica">Deite o celular e encaixe o <b>código de barras</b> na faixa — ou aponte pro <b>QR do PIX</b></div></div>
    <div class="status" id="dmScanStatus">Abrindo a câmera…</div>
    <div class="manual"><input id="dmScanDigitado" inputmode="numeric" placeholder="ou digite / cole a linha digitável ou PIX" onkeydown="if(event.key==='Enter') lerDigitado()"><button onclick="lerDigitado()">OK</button></div>
    <button class="link" onclick="mostrarFormNova(null)">Não tem código? Cadastrar dívida sem código</button>`;
  document.getElementById('dmScan').classList.add('on');
  ligarCamera();
}

async function ligarCamera() {
  const st = document.getElementById('dmScanStatus');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { if (st) st.textContent = 'Este navegador não abre a câmera — digite o código abaixo.'; return; }
  try {
    SCAN.stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
  } catch (e) { if (st) st.innerHTML = '❌ Câmera bloqueada — libere no cadeado ao lado do endereço, ou digite o código abaixo.'; return; }
  const v = document.getElementById('dmScanVideo'); if (!v) { pararCamera(); return; }
  v.srcObject = SCAN.stream;
  const trilha = SCAN.stream.getVideoTracks()[0];
  try { trilha.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {}); } catch (_) {}
  try { if (trilha.getCapabilities && trilha.getCapabilities().torch) document.getElementById('dmScanLuz').style.display = 'block'; } catch (_) {}
  try { SCAN.leitor = await criarLeitor(); } catch (e) { if (st) st.textContent = '⚠️ ' + e.message + ' — digite o código abaixo.'; return; }
  if (st) st.textContent = 'Procurando o código…';
  SCAN.ultimo = null; SCAN.iguais = 0;
  const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });
  const passo = async () => {
    if (!SCAN.stream || SCAN.ocupado) return;
    const vw = v.videoWidth, vh = v.videoHeight; if (!vw) return;
    SCAN.ocupado = true;
    try {
      // Só a faixa do meio (onde está a mira), no máx. 1600px de largura.
      const sy = Math.round(vh * 0.25), sh = Math.round(vh * 0.5), esc = Math.min(1, 1600 / vw);
      canvas.width = Math.round(vw * esc); canvas.height = Math.round(sh * esc);
      ctx.drawImage(v, 0, sy, vw, sh, 0, 0, canvas.width, canvas.height);
      const txt = await SCAN.leitor(canvas);
      if (txt) aoLer(txt);
    } finally { SCAN.ocupado = false; }
  };
  SCAN.timer = setInterval(passo, 180);
}

function aoLer(txt) {
  const L = BoletoCodigo.ler(txt, DividasDia.hojeLocal());
  const st = document.getElementById('dmScanStatus');
  if (!L.ok) { if (st) st.textContent = 'Lendo… segure firme e com luz'; SCAN.ultimo = null; return; }
  // PIX tem CRC forte: 1 leitura basta. Código de barras: 2 iguais seguidas.
  if (L.tipo !== 'pix') {
    SCAN.iguais = SCAN.ultimo === L.codigo ? SCAN.iguais + 1 : 1; SCAN.ultimo = L.codigo;
    if (SCAN.iguais < 2) { if (st) st.textContent = 'Quase… segure mais um instante'; return; }
  }
  vibrar([40, 40, 40]); som('moeda');
  mostrarLeitura(L);
}

function lerDigitado() {
  const L = BoletoCodigo.ler(document.getElementById('dmScanDigitado').value, DividasDia.hojeLocal());
  const st = document.getElementById('dmScanStatus');
  if (!L.ok) { st.innerHTML = '❌ ' + esc(L.erro); st.style.color = '#f87171'; return; }
  mostrarLeitura(L);
}

function pararCamera() {
  clearInterval(SCAN.timer); SCAN.timer = null;
  if (SCAN.stream) { SCAN.stream.getTracks().forEach(t => t.stop()); SCAN.stream = null; }
}
async function alternarLanterna() {
  const t = SCAN.stream && SCAN.stream.getVideoTracks()[0]; if (!t) return;
  SCAN.luz = !SCAN.luz;
  try { await t.applyConstraints({ advanced: [{ torch: SCAN.luz }] }); } catch (_) {}
}
function fecharAdicionar() { pararCamera(); SCAN.leitura = null; document.getElementById('dmScan').classList.remove('on'); }
document.addEventListener('visibilitychange', () => { if (document.hidden && SCAN.stream) fecharAdicionar(); });

function descLeitura(L) {
  if (L.tipo === 'pix') return `PIX${L.recebedor ? ' · ' + esc(L.recebedor) : ''}`;
  if (L.tipo === 'arrecadacao') return `Conta de consumo / imposto · ${esc(L.segmento)}`;
  return `Boleto · ${esc(L.bancoNome)}`;
}

function mostrarLeitura(L) {
  pararCamera();
  SCAN.leitura = L;
  document.getElementById('dmScanTit').textContent = '✅ Código lido';
  const r = BoletoCodigo.procurar(DADOS.boletos, L);
  const linhaOp = (o) => {
    const b = o.boleto;
    const motivo = o.motivo === 'codigo' ? 'mesmo código' : o.motivo === 'valor_a_confirmar' ? 'dívida sem valor, vence perto' : (o.dias ? `mesmo valor, vence ${o.dias} dia(s) de diferença` : 'mesmo valor e vencimento');
    return `<div class="op"><div class="info"><b>${esc(b.name || b.supplier || 'Dívida')}</b><small>${esc(b.empresa || '—')} · vence ${ddmm(b.date)} · ${Number(b.value) > 0 ? BRL(Number(b.value)) : 'valor a confirmar'} · ${motivo}</small></div>
      <button class="acao" onclick="pagarDaLeitura('${esc(b.id)}')">Pagar</button></div>`;
  };
  const pagas = r.jaPagas.map(b => `<div class="op paga"><div class="info"><b>✅ ${esc(b.name || 'Dívida')} — já paga</b><small>${esc(b.empresa || '—')} · venceu ${ddmm(b.date)} · ${BRL(Number(b.value) || 0)}</small></div></div>`).join('');
  corpoScan().innerHTML = `
    <div class="leitura"><div style="font-size:12.5px;color:var(--text-muted)">${descLeitura(L)}</div>
      <div class="v">${L.valor > 0 ? BRL(L.valor) : 'valor não vem no código'}</div>
      <div style="font-size:13px">${L.vencimento ? `Vencimento <b>${ddmm(L.vencimento)}/${L.vencimento.slice(0, 4)}</b>` : 'Vencimento não vem no código'}</div>
      <div class="linha">${esc(L.linhaFormatada)}</div>
      <button class="dm-copiar" style="margin-top:8px" onclick="copiarTexto(SCAN.leitura.linha)">📋 Copiar código</button></div>
    ${pagas ? `<div class="sec-tit">⚠️ Atenção — já existe paga</div>${pagas}` : ''}
    ${r.opcoes.length ? `<div class="sec-tit">Dívida encontrada${r.opcoes.length > 1 ? 's — escolha a certa' : ''}</div>${r.opcoes.map(linhaOp).join('')}
      <button class="link" onclick="mostrarFormNova(SCAN.leitura)">Não é nenhuma dessas? ➕ Cadastrar como nova</button>`
      : '<div class="sec-tit">Nenhuma dívida cadastrada com esse valor/vencimento</div><div id="dmScanForm"></div>'}
    <button class="acao sec largo" onclick="abrirAdicionar()">📷 Ler outro</button>`;
  if (!r.opcoes.length) mostrarFormNova(L, true);
}

// Formulário de cadastro: valor/vencimento vêm da leitura; o resto ela digita.
// Campo que falta fica destacado em laranja.
function mostrarFormNova(L, dentro) {
  if (!dentro) pararCamera();
  const empresas = [...new Set([...EMPRESAS_PADRAO, ...DADOS.boletos.map(b => String(b.empresa || '').trim()).filter(Boolean)])];
  const cats = CATS_BOLETO.filter(c => String(c.type || '').toLowerCase() !== 'fornecedor').map(c => c.name).filter(Boolean);
  const forns = [...new Set([...CATS_BOLETO.filter(c => String(c.type || '').toLowerCase() === 'fornecedor').map(c => c.name), ...DADOS.boletos.map(b => b.supplier)].filter(Boolean))].sort();
  NV_TIPO = L && L.tipo === 'arrecadacao' ? 'manual' : 'boleto';
  // Mesmos campos e ordem do "➕ Cadastrar Dívida" da página Boletos.
  const html = `<div class="form">
      <label>Tipo de dívida</label><div class="tipos" id="nvTipos">${TIPOS_NOVA.map(([k, n]) => `<button type="button" data-k="${k}" class="${k === NV_TIPO ? 'on' : ''}" onclick="escolherTipoNova('${k}')">${n}</button>`).join('')}</div>
      <div class="dupla"><div><label>Vencimento *</label><input id="nvVenc" type="date" value="${L && L.vencimento ? L.vencimento : ''}"></div>
        <div><label>Categoria</label><select id="nvCat"><option value="">Sem categoria</option>${cats.map(c => `<option>${esc(c)}</option>`).join('')}</select></div></div>
      <label>Fornecedor (opcional)</label><input id="nvForn" list="nvFornLista" placeholder="Nenhum fornecedor" value="${L && L.recebedor ? esc(L.recebedor) : ''}"><datalist id="nvFornLista">${forns.map(f => `<option value="${esc(f)}">`).join('')}</datalist>
      <label>Empresa (opcional)</label><select id="nvEmp"><option value="">— Selecione —</option>${empresas.map(e => `<option>${esc(e)}</option>`).join('')}</select>
      <label>Número NF (opcional)</label><input id="nvNf" inputmode="numeric" placeholder="Ex: 5644560">
      <label>Nome do boleto *</label><input id="nvNome" placeholder="Ex: Aluguel Galpão, Internet…" value="${L && L.tipo === 'pix' && L.recebedor ? esc(L.recebedor) : ''}">
      <label>Valor (R$) *</label><input id="nvValor" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0,00" value="${L && L.valor > 0 ? L.valor.toFixed(2) : ''}">
      <div class="erro" id="nvErro"></div>
      <button class="acao largo" id="nvSalvar" onclick="salvarNova()">➕ Cadastrar dívida</button></div>`;
  if (dentro) document.getElementById('dmScanForm').innerHTML = html;
  else {
    document.getElementById('dmScanTit').textContent = L ? '➕ Cadastrar como nova' : '➕ Nova dívida (sem código)';
    corpoScan().innerHTML = (L ? `<div class="leitura" style="margin-bottom:6px"><div style="font-size:12.5px;color:var(--text-muted)">${descLeitura(L)}</div><div class="linha">${esc(L.linhaFormatada)}</div></div>` : '') + html;
  }
  ['nvVenc', 'nvNome', 'nvValor'].forEach(id => {
    const el = document.getElementById(id);
    const marca = () => el.classList.toggle('falta', !String(el.value || '').trim());
    marca(); el.addEventListener('input', marca); el.addEventListener('change', marca);
  });
  const primeiro = ['nvVenc', 'nvNome', 'nvValor'].map(id => document.getElementById(id)).find(el => !el.value);
  if (primeiro) setTimeout(() => primeiro.focus(), 50);
}

function escolherTipoNova(k) {
  NV_TIPO = k;
  document.querySelectorAll('#nvTipos button').forEach(b => b.classList.toggle('on', b.dataset.k === k));
}

async function salvarNova() {
  const L = SCAN.leitura, val = id => document.getElementById(id).value.trim();
  const nome = val('nvNome'), emp = val('nvEmp'), venc = val('nvVenc');
  const valor = Math.round(parseFloat(val('nvValor').replace(',', '.')) * 100) / 100;
  const erro = t => { document.getElementById('nvErro').textContent = t; };
  if (!/^\d{4}-\d{2}-\d{2}$/.test(venc)) return erro('Informe o vencimento.');
  if (!nome) return erro('Informe o nome do boleto.');
  if (!(valor > 0)) return erro('Informe o valor.');
  // Sem código (ou cadastro "como nova"): avisa se já existe uma igual.
  const igual = DADOS.boletos.find(b => b.tipo !== 'cartao' && b.date === venc && Math.round((Number(b.value) || 0) * 100) === Math.round(valor * 100));
  if (igual && !confirm(`Já existe "${igual.name}" de ${BRL(valor)} vencendo ${ddmm(venc)}${igual.status === 'pago' ? ' (paga)' : ''}. Cadastrar outra mesmo assim?`)) return;
  const btn = document.getElementById('nvSalvar'); btn.disabled = true; btn.textContent = 'Salvando…'; erro('');
  // Mesmo formato do doInsertSimples() da página Boletos (sem categoria → 'Geral').
  const row = { name: nome, category: val('nvCat') || 'Geral', supplier: val('nvForn') || null, empresa: emp || null, date: venc, value: valor,
    status: 'pendente', mes_referencia: venc.slice(0, 7), tipo: NV_TIPO || 'boleto', is_origem: true };
  if (val('nvNf')) row.numero_nf = val('nvNf');
  if (L && L.codigo) row.codigo_barras = L.codigo;
  const r = await DB.addFinanceiroRow('boletos_mensais', row);
  const salvo = r && Array.isArray(r.rows) ? r.rows[0] : null;
  if (!salvo) { btn.disabled = false; btn.textContent = '➕ Cadastrar dívida'; return erro('Não consegui salvar: ' + (DB.lastError || 'erro')); }
  DADOS.boletos.push(salvo);
  recalcular();
  document.getElementById('dmScanTit').textContent = '✅ Dívida cadastrada';
  corpoScan().innerHTML = `<div class="leitura"><div class="v">✅ ${esc(salvo.name)}</div>
      <div style="font-size:13px;margin-top:4px">${[esc(salvo.empresa || ''), esc(TIPO[salvo.tipo] || salvo.tipo), BRL(Number(salvo.value) || 0), `vence ${ddmm(salvo.date)}/${String(salvo.date).slice(0, 4)}`].filter(Boolean).join(' · ')}</div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:6px">Já aparece em Boletos e nesta página${salvo.codigo_barras ? ' — com o código salvo (📋 Código no card)' : ''}.</div></div>
    <button class="acao largo" onclick="pagarDaLeitura('${esc(salvo.id)}')">💸 Pagar agora</button>
    <button class="acao sec largo" onclick="abrirAdicionar()">➕ Adicionar outra</button>
    <button class="acao sec largo" onclick="fecharAdicionar()">Fechar</button>`;
  msg(`➕ ${esc(salvo.name)} cadastrada — ${BRL(Number(salvo.value) || 0)}, vence ${ddmm(salvo.date)}`);
}

// Pagar a dívida achada/cadastrada pela leitura: salva o código nela (se
// ainda não tinha) e abre a MESMA janela de Pagar dos cards.
async function pagarDaLeitura(id) {
  const b = DADOS.boletos.find(x => String(x.id) === String(id)); if (!b) return;
  const L = SCAN.leitura;
  if (L && L.codigo && !b.codigo_barras) {
    const r = await DB.updateFinanceiroRow('boletos_mensais', b.id, { codigo_barras: L.codigo });
    if (r) b.codigo_barras = L.codigo;
  }
  const hoje = DividasDia.hojeLocal();
  const it = DividasDia.listarPeriodo({ ...DADOS, hoje, de: b.date, ate: b.date }).find(x => String(x.id) === String(b.id));
  if (!it) return;
  ITENS[it.id] = it;
  fecharAdicionar();
  recalcular();
  abrirPagar(it.id);
  const campoValor = document.getElementById('dmValor');
  if (campoValor && L && L.valor > 0) campoValor.value = L.valor.toFixed(2);
}

async function copiarTexto(t) {
  try { await navigator.clipboard.writeText(t); }
  catch (_) { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (_) {} ta.remove(); }
  msg('📋 Código copiado — cole no app do banco.');
}
function copiarCodigo(id) {
  const i = ITENS[id]; if (!i || !i.ref || !i.ref.codigo_barras) return;
  const L = BoletoCodigo.ler(i.ref.codigo_barras, DividasDia.hojeLocal());
  copiarTexto(L.ok ? L.linha : i.ref.codigo_barras);
}

// ── PWA: instalar app + notificação push das 07:00 ─────────────────────────
// Service worker = /sw.js da raiz (o mesmo do painel, rede-primeiro, nunca
// cacheia /api) — ganhou os handlers de push. A inscrição vai pro servidor
// (POST /api/financeiro/push/inscrever) e o worker manda às 07:00 o que vence
// hoje + atrasadas (mesmo cálculo desta página). iPhone: só funciona com o app
// instalado na Tela de Início (iOS 16.4+), por isso a instrução.
let INSTALAR = null;
const ehIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const instalado = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const suportaPush = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const chaveU8 = b64 => { const p = '='.repeat((4 - b64.length % 4) % 4), raw = atob((b64 + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(raw, c => c.charCodeAt(0)); };
async function registroSW() { if (!('serviceWorker' in navigator)) return null; await navigator.serviceWorker.register('/sw.js'); return navigator.serviceWorker.ready; }
async function inscricaoAtual() { try { const reg = await registroSW(); return reg && reg.pushManager ? await reg.pushManager.getSubscription() : null; } catch (_) { return null; } }

async function marcarSino() {
  const b = document.getElementById('dmSinoBtn'); if (!b) return;
  const sub = suportaPush() ? await inscricaoAtual() : null;
  b.classList.toggle('on', !!sub);
  b.classList.toggle('aviso', !sub && (suportaPush() || !!INSTALAR || (ehIOS() && !instalado())));
}

async function abrirNotificacoes() {
  const sub = suportaPush() ? await inscricaoAtual() : null;
  let notif;
  if (!suportaPush()) {
    notif = ehIOS() && !instalado()
      ? '<b class="t">🔔 Notificações</b>No iPhone, primeiro instale o app (abaixo) e abra pelo ícone da Tela de Início — aí o botão de ativar aparece aqui.'
      : '<b class="t">🔔 Notificações</b>Este navegador não suporta notificações. Use o Chrome (Android) ou o app instalado (iPhone).';
  } else if (Notification.permission === 'denied') {
    notif = '<b class="t">🔕 Notificações bloqueadas</b>Você bloqueou as notificações deste site. Libere nas configurações do navegador (cadeado ao lado do endereço → Notificações → Permitir) e volte aqui.';
  } else if (sub) {
    notif = `<b class="t">✅ Notificações ativadas neste aparelho</b>Todo dia às <b>07:00</b> chega o que vence hoje e o que está atrasado.
      <div class="lado2"><button class="sec" onclick="testarNotificacao()">Enviar teste</button><button class="sec" onclick="desativarNotificacao()">Desativar</button></div>`;
  } else {
    notif = `<b class="t">🔔 Receber aviso das contas</b>Todo dia às <b>07:00</b>: "💸 3 contas vencem hoje — R$ …", mesmo com o app fechado.
      <button onclick="ativarNotificacao()">Ativar notificações</button>`;
  }
  let inst;
  if (instalado()) inst = '<b class="t">📲 App instalado</b>Você está usando o app da Tela de Início.';
  else if (INSTALAR) inst = '<b class="t">📲 Instalar na Tela de Início</b>Ícone próprio, abre direto nas dívidas, sem barra do navegador.<button onclick="instalarApp()">Instalar app</button>';
  else if (ehIOS()) inst = '<b class="t">📲 Instalar no iPhone</b>No Safari, toque em <b>Compartilhar</b> (quadrado com seta ⬆️) → <b>Adicionar à Tela de Início</b> → Adicionar. Depois abra pelo ícone 💸.';
  else inst = '<b class="t">📲 Instalar na Tela de Início</b>No menu do navegador (⋮), toque em <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.';
  document.getElementById('dmSheet').innerHTML = `<h3>Notificações e app</h3><div class="sub">Dívidas do Dia no celular</div>
    <div class="bloco">${notif}</div><div class="bloco">${inst}</div><div class="erro" id="dmErro"></div>
    <div class="acoes" style="grid-template-columns:1fr"><button class="cancelar" onclick="fecharSheet()">Fechar</button></div>`;
  document.getElementById('dmOv').style.display = 'flex';
}

async function ativarNotificacao() {
  try {
    // Pedir a permissão PRIMEIRO, ainda dentro do toque (iPhone exige).
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { erroSheet('Permissão não concedida — sem ela não dá pra avisar.'); return; }
    const reg = await registroSW();
    const k = await DB.getPushChave();
    if (!k || k.error || !k.publicKey) { erroSheet('Servidor sem chave de notificação: ' + (k && k.error || 'erro')); return; }
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: chaveU8(k.publicKey) });
    const r = await DB.inscreverPush(sub.toJSON());
    if (!r) { await sub.unsubscribe().catch(() => {}); erroSheet('Não consegui salvar no servidor: ' + esc(DB.lastError || 'erro')); return; }
    await DB.testarPush(sub.endpoint);
    msg('🔔 Notificações ativadas — mandei uma de teste agora.');
    await marcarSino(); abrirNotificacoes();
  } catch (e) { erroSheet('Erro ao ativar: ' + esc(e.message || e)); }
}
async function testarNotificacao() {
  const sub = await inscricaoAtual(); if (!sub) { abrirNotificacoes(); return; }
  const r = await DB.testarPush(sub.endpoint);
  if (!r) erroSheet(esc(DB.lastError || 'Não consegui enviar o teste.')); else msg('📨 Teste enviado — deve chegar em segundos.');
}
async function desativarNotificacao() {
  const sub = await inscricaoAtual();
  if (sub) { await DB.cancelarPush(sub.endpoint); await sub.unsubscribe().catch(() => {}); }
  msg('🔕 Notificações desativadas neste aparelho.');
  await marcarSino(); abrirNotificacoes();
}
async function instalarApp() {
  if (!INSTALAR) return;
  INSTALAR.prompt();
  const { outcome } = await INSTALAR.userChoice.catch(() => ({}));
  INSTALAR = null;
  if (outcome === 'accepted') msg('📲 App instalado — procure o ícone 💸 na tela inicial.');
  marcarSino(); abrirNotificacoes();
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); INSTALAR = e; marcarSino(); });
window.addEventListener('appinstalled', () => { INSTALAR = null; marcarSino(); });
window.addEventListener('load', () => { registroSW().catch(() => {}); marcarSino(); });

carregar();
</script>
