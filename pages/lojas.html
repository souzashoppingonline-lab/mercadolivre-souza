<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lojas — ML Dashboard</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/cards.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>window.PAGE_TITLE='Lojas'; window.ACTIVE_NAV='lojas.html';</script>
  <style>
    .loja-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 12px; transition: border-color 0.2s; }
    .loja-card:hover { border-color: var(--primary); }
    .loja-card.connected { border-left: 3px solid var(--green); }
    .loja-card.disconnected { border-left: 3px solid var(--red); }
    .loja-header { display: flex; align-items: center; gap: 14px; }
    .loja-icon { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; flex-shrink: 0; }
    .loja-icon.connected { background: rgba(39,174,96,0.2); color: var(--green); }
    .loja-icon.disconnected { background: rgba(231,76,60,0.15); color: var(--red); }
    .loja-meta { flex: 1; }
    .loja-nickname { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
    .loja-id { font-size: 11px; color: var(--text-muted); }
    .status-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 20px; }
    .status-badge.ok { background: rgba(39,174,96,0.15); color: var(--green); }
    .status-badge.err { background: rgba(231,76,60,0.12); color: var(--red); }
    .loja-rows { display: flex; flex-direction: column; gap: 6px; }
    .loja-row { display: flex; justify-content: space-between; font-size: 12px; }
    .loja-row .k { color: var(--text-muted); }
    .loja-row .v { font-weight: 600; }
    .btn-reconectar { margin-top: 4px; background: rgba(255,230,0,0.1); border: 1px solid var(--primary); color: var(--primary); border-radius: 8px; padding: 7px 14px; font-size: 12px; font-weight: 600; cursor: pointer; transition: background 0.2s; text-decoration: none; display: inline-block; text-align: center; }
    .btn-reconectar:hover { background: var(--primary); color: #000; }
    .lojas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
    .summary-bar { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
    .summary-chip { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 16px; font-size: 12px; display: flex; align-items: center; gap: 8px; }
  </style>
</head>
<body>
<div class="app-container">
  <div id="app-sidebar"></div>
  <main class="main-content">
    <div id="app-topbar"></div>
    <div class="content-area">
      <div class="summary-bar" id="summaryBar"></div>
      <div class="lojas-grid" id="lojasGrid">
        <div class="empty-state" style="grid-column:1/-1">Carregando lojas...</div>
      </div>
    </div>
  </main>
</div>
<script src="../js/db.js"></script>
<script src="../js/websocket.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/sidebar.js"></script>
<script>
const fmt = v => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);

function initials(name) {
  return (name||'?').replace(/[_-]/g,' ').split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
}

function fmtExpiry(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}

async function load() {
  const data = await DB.getLojas() || { stores: [] };
  const stores = data.stores || [];
  const grid = document.getElementById('lojasGrid');
  const bar  = document.getElementById('summaryBar');

  const connected    = stores.filter(s => s.token_valid).length;
  const disconnected = stores.length - connected;
  bar.innerHTML = `
    <div class="summary-chip"><i class="fas fa-store" style="color:var(--primary)"></i> ${stores.length} loja${stores.length!==1?'s':''} cadastrada${stores.length!==1?'s':''}</div>
    <div class="summary-chip"><i class="fas fa-circle" style="color:var(--green);font-size:9px"></i> ${connected} conectada${connected!==1?'s':''}</div>
    ${disconnected ? `<div class="summary-chip"><i class="fas fa-circle" style="color:var(--red);font-size:9px"></i> ${disconnected} com token expirado</div>` : ''}
    <a href="/auth/login" class="summary-chip" style="color:var(--primary);border-color:var(--primary);text-decoration:none;cursor:pointer"><i class="fas fa-plus"></i> Adicionar loja</a>`;

  grid.innerHTML = stores.length ? stores.map(s => `
    <div class="loja-card ${s.token_valid ? 'connected' : 'disconnected'}">
      <div class="loja-header">
        <div class="loja-icon ${s.token_valid ? 'connected' : 'disconnected'}">${initials(s.nickname)}</div>
        <div class="loja-meta">
          <div class="loja-nickname">${s.nickname}</div>
          <div class="loja-id">ID: ${s.id}</div>
        </div>
        <span class="status-badge ${s.token_valid ? 'ok' : 'err'}">
          <i class="fas fa-circle" style="font-size:7px"></i>
          ${s.token_valid ? 'Conectada' : 'Expirado'}
        </span>
      </div>
      <div class="loja-rows">
        <div class="loja-row"><span class="k">Reputação</span><span class="v">${s.level_id||'—'}</span></div>
        <div class="loja-row"><span class="k">Anúncios Ativos</span><span class="v">${s.active_listings??'—'}</span></div>
        <div class="loja-row"><span class="k">Vendas Mês</span><span class="v">${fmt(s.monthly_revenue)}</span></div>
        <div class="loja-row"><span class="k">Token expira</span><span class="v" style="font-size:11px">${fmtExpiry(s.token_expires_at)}</span></div>
        <div class="loja-row"><span class="k">Atualizado</span><span class="v" style="font-size:11px">${fmtExpiry(s.updated_at)}</span></div>
      </div>
      ${!s.token_valid ? `<a href="/auth/login" class="btn-reconectar"><i class="fas fa-plug"></i> Reconectar loja</a>` : ''}
    </div>
  `).join('') : '<div class="empty-state" style="grid-column:1/-1">Nenhuma loja cadastrada. <a href="/auth/login" style="color:var(--primary)">Conectar primeira loja →</a></div>';
}

WS.on('_connected', () => {
  const el = document.getElementById('wsStatus');
  if (el) el.innerHTML = '<i class="fas fa-circle" style="color:var(--green);font-size:8px"></i> ao vivo';
});
WS.on('kpis_updated', load);
load();
</script>
</body>
</html>
