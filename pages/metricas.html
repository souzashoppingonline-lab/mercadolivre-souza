<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Métricas — ML Dashboard</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/cards.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>window.PAGE_TITLE='Métricas'; window.ACTIVE_NAV='metricas.html';</script>
</head>
<body>
<div class="app-container">
  <div id="app-sidebar"></div>
  <main class="main-content">
    <div id="app-topbar"></div>
    <div class="content-area">
      <div id="metricasCards" class="card-grid"></div>
      <div class="card">
        <div class="card-header"><h3>Detalhes de Reputação por Loja</h3></div>
        <div class="table-responsive">
          <table class="data-table">
            <thead><tr><th>Loja</th><th>Nível</th><th>Power Seller</th><th>Transações OK</th><th>% Positivo</th><th>% Negativo</th><th>Coleta</th></tr></thead>
            <tbody id="metricasDetail"><tr><td colspan="7" class="empty-state">Carregando...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="../js/db.js"></script>
<script src="../js/websocket.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/sidebar.js"></script>
<script>
const fmtD = d => d ? new Date(d).toLocaleDateString('pt-BR') : '—';
const levelColor = l => ({ gold_special:'#FFD700', gold:'#FFC107', silver:'#9E9E9E', bronze:'#CD7F32' })[l] || 'var(--text-muted)';
async function load() {
  const data = await DB.getMetricas() || { metricas: [] };
  const rows = data.metricas || [];
  document.getElementById('metricasCards').innerHTML = rows.length
    ? rows.map(r => `
      <div class="stat-card">
        <div class="label">${r.nickname || r.store_id}</div>
        <div class="value" style="color:${levelColor(r.level_id)}">${r.level_id || '—'}</div>
        <div class="sub" style="color:var(--text-muted)">${r.power_seller_status || ''}</div>
      </div>`).join('')
    : '<div class="stat-card"><div class="label">Reputação</div><div class="value" style="color:var(--text-muted)">Aguardando sync diário</div></div>';
  document.getElementById('metricasDetail').innerHTML = rows.length
    ? rows.map(r => `<tr>
        <td>${r.nickname || r.store_id}</td>
        <td style="color:${levelColor(r.level_id)}">${r.level_id || '—'}</td>
        <td>${r.power_seller_status || '—'}</td>
        <td>${r.transactions_completed || '—'}</td>
        <td style="color:var(--green)">${r.positive_ratings_pct ? r.positive_ratings_pct+'%' : '—'}</td>
        <td style="color:var(--red)">${r.negative_ratings_pct ? r.negative_ratings_pct+'%' : '—'}</td>
        <td style="font-size:11px;color:var(--text-muted)">${fmtD(r.collected_at)}</td>
      </tr>`).join('')
    : '<tr><td colspan="7" class="empty-state">Nenhuma métrica coletada — sync diário às 03:00</td></tr>';
}
WS.on('kpis_updated', load);
WS.on('_connected', ()=>{ const el=document.getElementById('wsStatus'); if(el) el.innerHTML='<i class="fas fa-circle" style="color:var(--green);font-size:8px"></i> ao vivo'; });
load();
</script>
</body>
</html>
