<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos — ML Dashboard</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/cards.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>window.PAGE_TITLE='Pedidos'; window.ACTIVE_NAV='pedidos.html';</script>
</head>
<body>
<div class="app-container">
  <div id="app-sidebar"></div>
  <main class="main-content">
    <div id="app-topbar"></div>
    <div class="content-area">

      <div class="filters-row" style="margin-bottom:16px">
        <select class="filter-select" id="periodFilter">
          <option value="hoje">Hoje</option>
          <option value="ontem">Ontem</option>
          <option value="3">Últimos 3 dias</option>
          <option value="5">Últimos 5 dias</option>
          <option value="7" selected>Últimos 7 dias</option>
          <option value="10">Últimos 10 dias</option>
          <option value="15">Últimos 15 dias</option>
          <option value="21">Últimos 21 dias</option>
          <option value="30">Últimos 30 dias</option>
        </select>
        <select class="filter-select" id="statusFilter">
          <option value="">Todos os status</option>
          <option value="paid">Pago</option>
          <option value="ready_to_ship">Pronto p/ Envio</option>
          <option value="shipped">Enviado</option>
          <option value="delivered">Entregue</option>
          <option value="cancelled">Cancelado</option>
        </select>
      </div>

      <div class="card-grid" style="margin-bottom:16px">
        <div class="stat-card" style="cursor:pointer" id="card-total" onclick="filterByStatus('')">
          <div class="label">Total Pedidos</div>
          <div class="value" id="kpi-total">—</div>
          <div style="font-size:.75rem;color:var(--text-muted);margin-top:4px" id="kpi-receita">—</div>
        </div>
        <div class="stat-card" style="cursor:pointer" id="card-paid" onclick="filterByStatus('paid')">
          <div class="label"><i class="fas fa-check-circle" style="color:var(--yellow)"></i> Pago</div>
          <div class="value" id="kpi-paid" style="color:var(--yellow)">—</div>
        </div>
        <div class="stat-card" style="cursor:pointer" id="card-ready_to_ship" onclick="filterByStatus('ready_to_ship')">
          <div class="label"><i class="fas fa-box" style="color:var(--primary)"></i> Pronto p/ Envio</div>
          <div class="value" id="kpi-ready_to_ship" style="color:var(--primary)">—</div>
        </div>
        <div class="stat-card" style="cursor:pointer" id="card-shipped" onclick="filterByStatus('shipped')">
          <div class="label"><i class="fas fa-truck" style="color:var(--blue)"></i> Enviado</div>
          <div class="value" id="kpi-shipped" style="color:var(--blue)">—</div>
        </div>
        <div class="stat-card" style="cursor:pointer" id="card-delivered" onclick="filterByStatus('delivered')">
          <div class="label"><i class="fas fa-home" style="color:var(--green)"></i> Entregue</div>
          <div class="value" id="kpi-delivered" style="color:var(--green)">—</div>
        </div>
        <div class="stat-card" style="cursor:pointer" id="card-cancelled" onclick="filterByStatus('cancelled')">
          <div class="label"><i class="fas fa-times-circle" style="color:var(--red)"></i> Cancelado</div>
          <div class="value" id="kpi-cancelled" style="color:var(--red)">—</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h3>Pedidos</h3>
          <button class="action-btn" onclick="exportTableCSV(document.getElementById('pedidosTable').closest('table'), 'pedidos.csv')"><i class="fas fa-file-csv"></i> CSV</button>
        </div>
        <div class="table-responsive">
          <table class="data-table">
            <thead><tr><th>Pedido</th><th>Loja</th><th>Comprador</th><th>Produto</th><th>Valor</th><th>Status</th><th>Data</th></tr></thead>
            <tbody id="pedidosTable"><tr><td colspan="7" class="empty-state">Carregando...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="../js/db.js"></script>
<script src="../js/tableExport.js"></script>
<script src="../js/websocket.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/sidebar.js"></script>
<script>
const fmt = v => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);
const fmtDt = d => d ? new Date(d).toLocaleString('pt-BR') : '—';
const statusLabel = { paid:'Pago', shipped:'Enviado', delivered:'Entregue', cancelled:'Cancelado', ready_to_ship:'Pronto p/ Envio' };

function filterByStatus(st) {
  document.getElementById('statusFilter').value = st;
  document.querySelectorAll('[id^="card-"]').forEach(c => c.style.outline = '');
  if (st) {
    const card = document.getElementById('card-' + st);
    if (card) card.style.outline = '2px solid var(--primary)';
  }
  load();
}

async function load() {
  const period = document.getElementById('periodFilter').value;
  const status = document.getElementById('statusFilter').value;
  const data = await DB.getPedidos({ period, status }) || { results:[], summary:{} };
  const s = data.summary || {};

  document.getElementById('kpi-total').textContent    = s.total ?? '—';
  document.getElementById('kpi-receita').textContent  = s.receita ? fmt(s.receita) : '';
  document.getElementById('kpi-paid').textContent         = s.paid ?? '—';
  document.getElementById('kpi-ready_to_ship').textContent = s.ready_to_ship ?? '—';
  document.getElementById('kpi-shipped').textContent      = s.shipped ?? '—';
  document.getElementById('kpi-delivered').textContent    = s.delivered ?? '—';
  document.getElementById('kpi-cancelled').textContent    = s.cancelled ?? '—';

  const rows = data.results || [];
  document.getElementById('pedidosTable').innerHTML = rows.length
    ? rows.map(r=>`<tr>
        <td style="font-size:11px;white-space:nowrap">#${r.id}</td>
        <td><span style="font-size:.75rem;color:var(--text-muted)">${r.loja||'—'}</span></td>
        <td>${r.buyer_nickname || '—'}</td>
        <td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.title || '—'}</td>
        <td style="white-space:nowrap">${fmt(r.total_amount)}</td>
        <td><span class="badge ${r.status==='delivered'?'active':r.status==='cancelled'?'closed':'paused'}">${statusLabel[r.status]||r.status}</span></td>
        <td style="white-space:nowrap">${fmtDt(r.date_created)}</td>
      </tr>`).join('')
    : '<tr><td colspan="7" class="empty-state">Nenhum pedido</td></tr>';
}

document.getElementById('periodFilter').addEventListener('change', load);
document.getElementById('statusFilter').addEventListener('change', load);
WS.on('order_updated', load);
WS.on('_connected', () => { const el=document.getElementById('wsStatus'); if(el) el.innerHTML='<i class="fas fa-circle" style="color:var(--green);font-size:8px"></i> ao vivo'; });
load();
</script>
</body>
</html>
