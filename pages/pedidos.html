<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos — ML Dashboard</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/cards.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>window.PAGE_TITLE='Pedidos'; window.ACTIVE_NAV='pedidos.html';</script>
</head>
<body>
<div class="app-container">
  <div id="app-sidebar"></div>
  <main class="main-content">
    <div id="app-topbar"></div>
    <div class="content-area">
      <div class="card-grid">
        <div class="stat-card"><div class="label">Total Hoje</div><div class="value" id="totalHoje">—</div></div>
        <div class="stat-card"><div class="label">Aguardando Envio</div><div class="value" id="aguardandoEnvio" style="color:var(--orange)">—</div></div>
        <div class="stat-card"><div class="label">Em Trânsito</div><div class="value" id="emTransito" style="color:var(--blue)">—</div></div>
        <div class="stat-card"><div class="label">Entregues Hoje</div><div class="value" id="entreguesHoje" style="color:var(--green)">—</div></div>
      </div>
      <div class="card">
        <div class="card-header">
          <h3>Pedidos</h3>
          <div class="filters-bar" style="margin:0;gap:8px">
            <select class="filter-select" id="statusFilter">
              <option value="">Todos</option>
              <option value="paid">Pago</option>
              <option value="shipped">Enviado</option>
              <option value="delivered">Entregue</option>
              <option value="cancelled">Cancelado</option>
            </select>
            <input type="date" class="filter-input" id="dateFrom">
            <input type="date" class="filter-input" id="dateTo">
          </div>
        </div>
        <div class="table-responsive">
          <table class="data-table">
            <thead><tr><th>Pedido</th><th>Comprador</th><th>Produto</th><th>Valor</th><th>Status</th><th>Data</th></tr></thead>
            <tbody id="pedidosTable"><tr><td colspan="6" class="empty-state">Carregando...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="../js/db.js"></script>
<script src="../js/websocket.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/sidebar.js"></script>
<script>
const fmt = v => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);
const fmtDt = d => d ? new Date(d).toLocaleString('pt-BR') : '—';
const statusLabel = { paid:'Pago', shipped:'Enviado', delivered:'Entregue', cancelled:'Cancelado', ready_to_ship:'Pronto p/ envio' };

async function load() {
  const status = document.getElementById('statusFilter').value;
  const dateFrom = document.getElementById('dateFrom').value;
  const dateTo = document.getElementById('dateTo').value;
  const data = await DB.getPedidos({ status, dateFrom, dateTo }) || { results:[], summary:{} };
  const s = data.summary || {};
  document.getElementById('totalHoje').textContent = s.total_hoje ?? '—';
  document.getElementById('aguardandoEnvio').textContent = s.aguardando_envio ?? '—';
  document.getElementById('emTransito').textContent = s.em_transito ?? '—';
  document.getElementById('entreguesHoje').textContent = s.entregues_hoje ?? '—';
  const rows = data.results || [];
  document.getElementById('pedidosTable').innerHTML = rows.length
    ? rows.map(r=>`<tr>
        <td style="font-size:11px">#${r.id}</td>
        <td>${r.buyer_nickname || r.comprador || '—'}</td>
        <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.title || r.produto || '—'}</td>
        <td>${fmt(r.total_amount || r.valor)}</td>
        <td><span class="badge ${r.status === 'delivered' ? 'active' : r.status === 'cancelled' ? 'closed' : 'paused'}">${statusLabel[r.status]||r.status}</span></td>
        <td>${fmtDt(r.date_created || r.data)}</td>
      </tr>`).join('')
    : '<tr><td colspan="6" class="empty-state">Nenhum pedido</td></tr>';
}
document.getElementById('statusFilter').addEventListener('change', load);
document.getElementById('dateFrom').addEventListener('change', load);
document.getElementById('dateTo').addEventListener('change', load);
document.getElementById('btnRefresh') && document.getElementById('btnRefresh').addEventListener('click', load);
WS.on('order_updated', load);
WS.on('_connected', () => { const el=document.getElementById('wsStatus'); if(el) el.innerHTML='<i class="fas fa-circle" style="color:var(--green);font-size:8px"></i> ao vivo'; });
load();
window.addEventListener('storeChanged', load);
</script>
</body>
</html>
