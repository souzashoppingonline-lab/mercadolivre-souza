<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Performance — ML Dashboard</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/cards.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>window.PAGE_TITLE='Performance'; window.ACTIVE_NAV='performance.html';</script>
  <style>
    .store-tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
    .store-tab { display:flex; align-items:center; gap:8px; padding:8px 16px; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600; border:1px solid var(--border); background:var(--card-bg); color:var(--text-muted); transition:all .2s; }
    .store-tab:hover { border-color:var(--primary); color:var(--text-primary); }
    .store-tab.active { background:var(--primary); color:#000; border-color:var(--primary); }
    .store-tab .tab-av { width:22px; height:22px; border-radius:50%; background:rgba(0,0,0,.2); display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:800; }
    .store-section { display:none; }
    .store-section.active { display:block; }
    .perf-row { display:flex; align-items:center; gap:14px; padding:12px 0; border-bottom:1px solid var(--border); }
    .perf-row:last-child { border-bottom:none; }
    .perf-row:hover { background: rgba(255,255,255,.03); border-radius:10px; margin:0 -8px; padding:12px 8px; }
    .perf-thumb { width:64px; height:64px; border-radius:10px; object-fit:cover; background:var(--border); flex-shrink:0; }
    .perf-thumb-ph { width:64px; height:64px; border-radius:10px; background:var(--surface); flex-shrink:0; display:flex; align-items:center; justify-content:center; color:var(--text-muted); font-size:1.4rem; }
    .perf-info { flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
    .perf-title { font-size:.84rem; font-weight:600; color:var(--text-primary); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.35; }
    .perf-sku { font-size:.7rem; color:var(--text-muted); font-family:monospace; }
    .perf-cols { display:flex; gap:18px; flex-shrink:0; }
    .perf-col { text-align:center; min-width:60px; }
    .perf-col .lbl { font-size:.62rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; }
    .perf-col .val { font-size:.88rem; font-weight:700; margin-top:2px; }
    .rank-badge { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.75rem; font-weight:800; flex-shrink:0; }
    .rank-1 { background:rgba(255,215,0,.2); color:#ffd700; }
    .rank-2 { background:rgba(192,192,192,.2); color:#c0c0c0; }
    .rank-3 { background:rgba(205,127,50,.2); color:#cd7f32; }
    .rank-n { background:var(--surface); color:var(--text-muted); }
    .sort-btn { padding:7px 14px; border-radius:8px; border:1px solid var(--border); background:var(--card-bg); color:var(--text-muted); font-size:.8rem; font-weight:600; cursor:pointer; transition:all .2s; display:flex; align-items:center; gap:6px; }
    .sort-btn:hover { border-color:var(--primary); color:var(--text); }
    .sort-btn.active { background:var(--primary); color:#000; border-color:var(--primary); }
    /* Modo mascarado */
    body.masked .perf-title { filter:blur(8px); user-select:none; pointer-events:none; }
    body.masked .perf-sku   { filter:blur(6px); user-select:none; }
    body.masked .perf-thumb { filter:blur(12px); }
    body.masked .perf-thumb-ph { filter:blur(6px); }
    #maskBtn.active { background:#ff3b30; color:#fff; border-color:#ff3b30; }
  </style>
</head>
<body>
<div class="app-container">
  <div id="app-sidebar"></div>
  <main class="main-content">
    <div id="app-topbar"></div>
    <div class="content-area">

      <div class="filters-row" style="margin-bottom:16px;flex-wrap:wrap;gap:8px">
        <select class="filter-select" id="daysFilter">
          <option value="1">Hoje</option>
          <option value="3">Últimos 3 dias</option>
          <option value="7" selected>Últimos 7 dias</option>
          <option value="10">Últimos 10 dias</option>
          <option value="15">Últimos 15 dias</option>
          <option value="21">Últimos 21 dias</option>
          <option value="30">Últimos 30 dias</option>
        </select>
        <div style="display:flex;gap:6px;flex-wrap:wrap" id="sortBtns">
          <button class="sort-btn active" data-sort="receita"   onclick="setSort('receita')">  <i class="fas fa-dollar-sign"></i> Mais Receita</button>
          <button class="sort-btn"        data-sort="vendas"    onclick="setSort('vendas')">   <i class="fas fa-shopping-cart"></i> Mais Vendas</button>
          <button class="sort-btn"        data-sort="visitas"   onclick="setSort('visitas')">  <i class="fas fa-eye"></i> Mais Visitas</button>
          <button class="sort-btn"        data-sort="conversao" onclick="setSort('conversao')"><i class="fas fa-percent"></i> Maior Conversão</button>
        </div>
        <button id="maskBtn" onclick="toggleMask()" class="sort-btn" title="Ocultar títulos e fotos para print">
          <i class="fas fa-eye-slash" id="maskIcon"></i> <span id="maskLabel">Ocultar</span>
        </button>
        <button id="visitasBtn" onclick="showVisitasConfirm()" class="sort-btn" style="margin-left:auto;border-color:var(--primary);color:var(--primary)" title="⚠️ Use fora do horário de pico (22h–08h) para evitar 429">
          <i class="fas fa-eye" id="visitasIcon"></i> Atualizar Visitas ⚠️
        </button>
        <span id="visitasStatus" style="font-size:.75rem;color:#ff9f0a;white-space:nowrap;font-weight:600">Use após 22h</span>
      </div>

      <div class="store-tabs" id="storeTabs">
        <div class="store-tab active" data-store="">
          <i class="fas fa-store" style="font-size:12px"></i> Todas as lojas
        </div>
      </div>

      <div id="storeContent"></div>

    </div>
  </main>
</div>

<!-- Modal confirmação syncVisitas -->
<div id="visitasModal" style="
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;
  align-items:center;justify-content:center;
">
  <div style="
    background:#1c1c1e;border:1px solid #3a3a3c;border-radius:14px;
    padding:24px 28px;max-width:420px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.8);
  ">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
      <i class="fas fa-exclamation-triangle" style="color:#ff9f0a;font-size:1.4rem"></i>
      <h3 style="margin:0;font-size:1rem;color:#fff">Atenção — Rate Limit</h3>
    </div>
    <div style="font-size:.84rem;color:#ebebf5cc;line-height:1.65;margin-bottom:18px">
      ⚠️ Usar durante <b style="color:#ff9f0a">horário de pico (08h–22h)</b> pode causar
      <b>erro 429</b> e atrasar pedidos em tempo real.<br><br>
      ✓ <b style="color:#30d158">Ideal: após 22h ou antes das 08h.</b><br>
      O sistema já roda automaticamente às 02:00.
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button onclick="document.getElementById('visitasModal').style.display='none'"
        style="padding:9px 20px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-size:.85rem">
        Cancelar
      </button>
      <button onclick="confirmSyncVisitas()"
        style="padding:9px 20px;border-radius:8px;border:none;background:var(--primary);color:#000;font-weight:700;cursor:pointer;font-size:.85rem">
        Entendi, executar agora
      </button>
    </div>
  </div>
</div>
<script src="../js/db.js"></script>
<script src="../js/websocket.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/sidebar.js"></script>
<script>
function toggleMask() {
  const on = document.body.classList.toggle('masked');
  document.getElementById('maskIcon').className  = on ? 'fas fa-eye' : 'fas fa-eye-slash';
  document.getElementById('maskLabel').textContent = on ? 'Revelar' : 'Ocultar';
  document.getElementById('maskBtn').classList.toggle('active', on);
}

const fmt  = v => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);
const fmtN = v => new Intl.NumberFormat('pt-BR').format(v||0);
let currentSort = 'receita';

function showVisitasConfirm() {
  document.getElementById('visitasModal').style.display = 'flex';
}

async function confirmSyncVisitas() {
  document.getElementById('visitasModal').style.display = 'none';
  const btn  = document.getElementById('visitasBtn');
  const icon = document.getElementById('visitasIcon');
  const st   = document.getElementById('visitasStatus');
  btn.disabled = true;
  icon.className = 'fas fa-spinner fa-spin';
  st.innerHTML = '<span style="color:var(--primary)">Iniciando...</span>';

  try {
    const base = DB.BASE;
    const res = await fetch(`${base}/schedule/jobs/syncVisitas/trigger`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }
    });
    if (res.ok) {
      st.innerHTML = '<i class="fas fa-check-circle" style="color:var(--green);margin-right:4px"></i><span style="color:var(--green)">Sync iniciado! Acompanhe no Schedule.</span>';
    } else {
      const err = await res.text();
      st.innerHTML = `<span style="color:var(--red)">Erro ${res.status}: ${err}</span>`;
    }
  } catch(e) {
    st.innerHTML = `<span style="color:var(--red)">Erro de conexão: ${e.message}</span>`;
  }

  icon.className = 'fas fa-eye';
  btn.disabled = false;
}

function setSort(sort) {
  currentSort = sort;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.toggle('active', b.dataset.sort === sort));
  const active = document.querySelector('.store-tab.active');
  loadSection(active?.dataset.store || '');
}

function initials(name) {
  return (name||'?').replace(/[_-]/g,' ').split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
}

function buildSection(storeId) {
  const id = storeId || 'all';
  return `
    <div class="store-section ${id==='all'?'active':''}" id="sec-${id}">
      <div class="card-grid" style="margin-bottom:16px">
        <div class="stat-card"><div class="label">Produtos com venda</div><div class="value" id="kpi-vendidos-${id}" style="color:var(--green)">—</div></div>
        <div class="stat-card"><div class="label">Total Vendas (período)</div><div class="value" id="kpi-pedidos-${id}">—</div></div>
        <div class="stat-card"><div class="label">Receita (período)</div><div class="value" id="kpi-receita-${id}" style="color:var(--primary)">—</div></div>
        <div class="stat-card"><div class="label">Taxa de Conversão</div><div class="value" id="kpi-conv-${id}" style="color:var(--yellow)">—</div></div>
      </div>
      <div class="card">
        <div class="card-header">
          <h3>Performance por Produto${storeId ? '' : ' — Todas as Lojas'}</h3>
          <div class="search-box"><i class="fas fa-search"></i><input type="text" id="search-${id}" placeholder="Buscar..."></div>
        </div>
        <div id="perfList-${id}" style="padding:4px 0">
          <div class="empty-state">Carregando...</div>
        </div>
      </div>
    </div>`;
}

async function loadSection(storeId) {
  const id    = storeId || 'all';
  const days  = document.getElementById('daysFilter').value;
  const search = (document.getElementById(`search-${id}`)?.value || '').toLowerCase();
  const data  = await DB.getProdutosPerformance({ store_id: storeId, days, sort: currentSort });
  const list0 = document.getElementById(`perfList-${id}`);
  if (!data || data.error) {
    if (list0) list0.innerHTML = `<div class="empty-state" style="color:var(--red)">${data?.error || 'Erro ao carregar dados'}</div>`;
    return;
  }
  let rows = data.products || [];

  if (search) rows = rows.filter(r => r.title?.toLowerCase().includes(search));

  const totalPedidos = rows.reduce((a, r) => a + Number(r.pedidos_periodo||0), 0);
  const totalReceita = rows.reduce((a, r) => a + Number(r.receita_periodo||0), 0);
  const totalVisitas = rows.reduce((a, r) => a + Number(r.visitas_periodo||0), 0);
  const comVenda     = rows.filter(r => Number(r.pedidos_periodo||0) > 0).length;
  const conv         = totalVisitas > 0 ? ((totalPedidos / totalVisitas) * 100).toFixed(1) : null;

  const set = (el, v) => { const e = document.getElementById(el); if (e) e.textContent = v; };
  set(`kpi-vendidos-${id}`, comVenda || '—');
  set(`kpi-pedidos-${id}`,  fmtN(totalPedidos) || '—');
  set(`kpi-receita-${id}`,  totalReceita ? fmt(totalReceita) : '—');
  set(`kpi-conv-${id}`,     conv ? conv + '%' : '—');

  const list = document.getElementById(`perfList-${id}`);
  if (!list) return;
  if (!rows.length) { list.innerHTML = '<div class="empty-state">Nenhum produto encontrado</div>'; return; }

  list.innerHTML = rows.map((r, i) => {
    const rank   = i + 1;
    const rkCls  = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : 'rank-n';
    const visitas = Number(r.visitas_periodo || 0);
    const vendas  = Number(r.pedidos_periodo || 0);
    const convRow = Number(r.conversao_pct) > 0 ? Number(r.conversao_pct).toFixed(1) + '%'
                  : visitas > 0 ? ((vendas / visitas) * 100).toFixed(1) + '%' : '—';
    const thumb   = r.thumbnail
      ? `<img class="perf-thumb" src="${r.thumbnail}" onerror="this.outerHTML='<div class=\\'perf-thumb-ph\\'><i class=\\'fas fa-tag\\'></i></div>'">`
      : `<div class="perf-thumb-ph"><i class="fas fa-tag"></i></div>`;
    return `
      <div class="perf-row" style="cursor:pointer" data-mlid="${r.ml_id}" data-title="${(r.title||'').replace(/"/g,'&quot;')}">
        <div class="rank-badge ${rkCls}">${rank}</div>
        ${thumb}
        <div class="perf-info">
          <div class="perf-title">${r.title}</div>
          <div class="perf-sku">${r.ml_id || ''}</div>
        </div>
        <div class="perf-cols">
          <div class="perf-col">
            <div class="lbl">Visitas</div>
            <div class="val">${fmtN(visitas)}</div>
          </div>
          <div class="perf-col">
            <div class="lbl">Vendas</div>
            <div class="val" style="color:var(--green)">${fmtN(vendas)}</div>
          </div>
          <div class="perf-col">
            <div class="lbl">Conversão</div>
            <div class="val" style="color:var(--yellow)">${convRow}</div>
          </div>
          <div class="perf-col">
            <div class="lbl">Receita</div>
            <div class="val" style="color:var(--primary)">${fmt(r.receita_periodo)}</div>
          </div>
          <div class="perf-col">
            <div class="lbl">Posição</div>
            <div class="val">#${rank}</div>
          </div>
        </div>
      </div>`;
  }).join('');

  list.querySelectorAll('.perf-row[data-mlid]').forEach(el => {
    el.addEventListener('click', () => openHistorico(el.dataset.mlid, el.dataset.title));
  });
}

function switchTab(storeId) {
  document.querySelectorAll('.store-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.store-section').forEach(s => s.classList.remove('active'));
  const id = storeId || 'all';
  document.querySelector(`.store-tab[data-store="${storeId}"]`)?.classList.add('active');
  document.getElementById(`sec-${id}`)?.classList.add('active');
  loadSection(storeId);
}

async function init() {
  const data   = await DB.getLojas() || { stores: [] };
  const stores = data.stores || [];
  const tabs   = document.getElementById('storeTabs');
  const cont   = document.getElementById('storeContent');

  cont.innerHTML = buildSection('');
  document.getElementById(`search-all`)?.addEventListener('input', () => loadSection(''));

  stores.forEach(s => {
    const tab = document.createElement('div');
    tab.className = 'store-tab';
    tab.dataset.store = s.id;
    tab.innerHTML = `<span class="tab-av">${initials(s.nickname)}</span>${s.nickname}`;
    tab.addEventListener('click', () => switchTab(s.id));
    tabs.appendChild(tab);
    cont.insertAdjacentHTML('beforeend', buildSection(s.id));
    document.getElementById(`search-${s.id}`)?.addEventListener('input', () => loadSection(s.id));
  });

  document.querySelector('.store-tab[data-store=""]')?.addEventListener('click', () => switchTab(''));
  document.getElementById('daysFilter').addEventListener('change', () => {
    const active = document.querySelector('.store-tab.active');
    loadSection(active?.dataset.store || '');
  });

  loadSection('');
}

WS.on('anuncio_updated', () => {
  const active = document.querySelector('.store-tab.active');
  loadSection(active?.dataset.store || '');
});
WS.on('_connected', () => {
  const el = document.getElementById('wsStatus');
  if (el) el.innerHTML = '<i class="fas fa-circle" style="color:var(--green);font-size:8px"></i> ao vivo';
});

init();
</script>

<!-- Modal Histórico Diário -->
<div id="historicoModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;align-items:center;justify-content:center" onclick="if(event.target===this)closeHistorico()">
  <div style="background:#1c1c1e;border:1px solid #3a3a3c;border-radius:16px;padding:24px 28px;width:90%;max-width:680px;max-height:85vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.9)">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:20px">
      <div>
        <h3 id="histTitle" style="margin:0 0 4px;font-size:1rem;color:#fff">—</h3>
        <span style="font-size:.75rem;color:var(--text-muted)">Histórico dia a dia — visitas, vendas e conversão</span>
      </div>
      <button onclick="closeHistorico()" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1.2rem;padding:2px 6px;flex-shrink:0">✕</button>
    </div>
    <div id="histBody">
      <div style="text-align:center;padding:32px;color:var(--text-muted)"><i class="fas fa-spinner fa-spin"></i> Carregando...</div>
    </div>
  </div>
</div>

<script>
function closeHistorico() {
  document.getElementById('historicoModal').style.display = 'none';
}

async function openHistorico(itemId, title) {
  const modal = document.getElementById('historicoModal');
  const body  = document.getElementById('histBody');
  document.getElementById('histTitle').textContent = title;
  body.innerHTML = '<div style="text-align:center;padding:32px;color:var(--text-muted)"><i class="fas fa-spinner fa-spin"></i> Carregando...</div>';
  modal.style.display = 'flex';

  const days = document.getElementById('daysFilter').value;
  const data = await DB.getProdutoHistoricoDiario(itemId, { days });

  if (!data || data.error) {
    body.innerHTML = `<div style="color:var(--red);text-align:center;padding:24px">${data?.error || 'Erro ao carregar'}</div>`;
    return;
  }

  const rows = data.rows || [];
  if (!rows.length) {
    body.innerHTML = '<div style="text-align:center;padding:32px;color:var(--text-muted)">Nenhum dado encontrado para este período</div>';
    return;
  }

  const fmtDate = d => {
    const [y,m,dia] = d.split('-');
    return `${dia}/${m}/${y}`;
  };
  const fmtMoeda = v => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);

  // Totais
  const totVisitas = rows.reduce((s,r) => s + r.visitas, 0);
  const totVendas  = rows.reduce((s,r) => s + r.pedidos, 0);
  const totReceita = rows.reduce((s,r) => s + r.receita, 0);
  const totConv    = totVisitas > 0 ? ((totVendas / totVisitas) * 100).toFixed(1) + '%' : '—';

  body.innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px">
      <div style="background:var(--surface);border-radius:10px;padding:12px;text-align:center">
        <div style="font-size:.65rem;color:var(--text-muted);text-transform:uppercase;margin-bottom:4px">Visitas</div>
        <div style="font-size:1.1rem;font-weight:700">${totVisitas.toLocaleString('pt-BR')}</div>
      </div>
      <div style="background:var(--surface);border-radius:10px;padding:12px;text-align:center">
        <div style="font-size:.65rem;color:var(--text-muted);text-transform:uppercase;margin-bottom:4px">Vendas</div>
        <div style="font-size:1.1rem;font-weight:700;color:var(--green)">${totVendas}</div>
      </div>
      <div style="background:var(--surface);border-radius:10px;padding:12px;text-align:center">
        <div style="font-size:.65rem;color:var(--text-muted);text-transform:uppercase;margin-bottom:4px">Conversão</div>
        <div style="font-size:1.1rem;font-weight:700;color:var(--yellow)">${totConv}</div>
      </div>
      <div style="background:var(--surface);border-radius:10px;padding:12px;text-align:center">
        <div style="font-size:.65rem;color:var(--text-muted);text-transform:uppercase;margin-bottom:4px">Receita</div>
        <div style="font-size:1.1rem;font-weight:700;color:var(--primary)">${fmtMoeda(totReceita)}</div>
      </div>
    </div>
    <table style="width:100%;border-collapse:collapse;font-size:.82rem">
      <thead>
        <tr style="border-bottom:2px solid var(--border)">
          <th style="text-align:left;padding:8px 10px;color:var(--text-muted);font-weight:600;font-size:.72rem;text-transform:uppercase">Data</th>
          <th style="text-align:right;padding:8px 10px;color:var(--text-muted);font-weight:600;font-size:.72rem;text-transform:uppercase">Visitas</th>
          <th style="text-align:right;padding:8px 10px;color:var(--text-muted);font-weight:600;font-size:.72rem;text-transform:uppercase">Vendas</th>
          <th style="text-align:right;padding:8px 10px;color:var(--text-muted);font-weight:600;font-size:.72rem;text-transform:uppercase">Conversão</th>
          <th style="text-align:right;padding:8px 10px;color:var(--text-muted);font-weight:600;font-size:.72rem;text-transform:uppercase">Receita</th>
        </tr>
      </thead>
      <tbody>
        ${rows.map(r => {
          const conv = r.conversao_pct != null ? r.conversao_pct + '%' : (r.visitas > 0 ? ((r.pedidos/r.visitas)*100).toFixed(1)+'%' : '—');
          const convColor = r.conversao_pct >= 5 ? 'var(--green)' : r.conversao_pct > 0 ? 'var(--yellow)' : 'var(--text-muted)';
          const semVisita = r.visitas === 0 ? ';opacity:.5' : '';
          return `<tr style="border-bottom:1px solid var(--border)${semVisita}">
            <td style="padding:9px 10px;font-weight:600">${fmtDate(r.data)}</td>
            <td style="padding:9px 10px;text-align:right">${r.visitas > 0 ? r.visitas.toLocaleString('pt-BR') : '<span style="color:var(--text-muted)">—</span>'}</td>
            <td style="padding:9px 10px;text-align:right;color:${r.pedidos > 0 ? 'var(--green)' : 'var(--text-muted)'}">${r.pedidos > 0 ? r.pedidos : '—'}</td>
            <td style="padding:9px 10px;text-align:right;color:${convColor};font-weight:700">${conv}</td>
            <td style="padding:9px 10px;text-align:right;color:var(--primary)">${r.receita > 0 ? fmtMoeda(r.receita) : '—'}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
    <div style="margin-top:14px;font-size:.72rem;color:var(--text-muted)">
      <i class="fas fa-info-circle"></i> Visitas coletadas às 02:00 referentes ao dia anterior. Dias sem visitas = sync ainda não rodou ou sem dados.
    </div>`;
}
</script>
</body>
</html>
