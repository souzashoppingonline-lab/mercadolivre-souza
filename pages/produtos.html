<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos — ML Dashboard</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/cards.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>window.PAGE_TITLE='Produtos'; window.ACTIVE_NAV='produtos.html';</script>
</head>
<body>
<div class="app-container">
  <div id="app-sidebar"></div>
  <main class="main-content">
    <div id="app-topbar"></div>
    <div class="content-area">
      <div class="card">
        <div class="card-header">
          <h3>Catálogo de Produtos</h3>
          <div class="filters-bar" style="margin:0">
            <div class="search-box"><i class="fas fa-search"></i><input type="text" id="search" placeholder="Buscar produto..."></div>
            <select class="filter-select" id="sortBy">
              <option value="vendas">Mais Vendidos</option>
              <option value="receita">Maior Receita</option>
              <option value="estoque">Menor Estoque</option>
            </select>
          </div>
        </div>
        <div class="table-responsive">
          <table class="data-table">
            <thead><tr><th>Produto</th><th>Preço</th><th>Estoque</th><th>Vendas</th><th>Receita</th><th>Status</th></tr></thead>
            <tbody id="produtosTable"><tr><td colspan="6" class="empty-state">Carregando...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="../js/db.js"></script>
<script src="../js/websocket.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/sidebar.js"></script>
<script>
const fmt = v => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);
async function load() {
  const search = document.getElementById('search').value;
  const sortBy = document.getElementById('sortBy').value;
  const data = await DB.getProdutos({ search, sortBy }) || { products:[] };
  const rows = data.products || [];
  document.getElementById('produtosTable').innerHTML = rows.length
    ? rows.map(r=>`<tr>
        <td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.title||r.titulo}</td>
        <td>${fmt(r.price||r.preco)}</td>
        <td>${r.stock??r.estoque??'—'}</td>
        <td>${r.sold||r.vendas||0}</td>
        <td>${fmt(r.revenue||r.receita)}</td>
        <td><span class="badge ${r.status}">${r.status==='active'?'Ativo':r.status==='paused'?'Pausado':'Encerrado'}</span></td>
      </tr>`).join('')
    : '<tr><td colspan="6" class="empty-state">Nenhum produto</td></tr>';
}
document.getElementById('search').addEventListener('input', load);
document.getElementById('sortBy').addEventListener('change', load);
WS.on('anuncio_updated', load);
WS.on('_connected', ()=>{ const el=document.getElementById('wsStatus'); if(el) el.innerHTML='<i class="fas fa-circle" style="color:var(--green);font-size:8px"></i> ao vivo'; });
load();
window.addEventListener('storeChanged', load);
</script>
</body>
</html>
