<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promoções — ML Dashboard</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/cards.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>window.PAGE_TITLE='Promoções'; window.ACTIVE_NAV='promocoes.html';</script>
  <style>
    .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
    .tab-btn { background:var(--bg-card); border:1px solid var(--border); border-radius:8px; padding:7px 16px; cursor:pointer; font-size:13px; color:var(--text-muted); transition:.2s; white-space:nowrap; min-height:40px; }
    .tab-btn.active { background:var(--primary); color:#000; border-color:var(--primary); font-weight:700; }
    .tab-btn:hover:not(.active) { border-color:var(--primary); color:var(--primary); }
    @media (max-width:600px) {
      .tabs { flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding-bottom:4px; margin-left:-16px; margin-right:-16px; padding-left:16px; padding-right:16px; }
      .tabs::-webkit-scrollbar { display:none; }
      .tab-btn { flex-shrink:0; font-size:12px; padding:8px 14px; min-height:44px; }
    }
    .promo-summary { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; margin-bottom:16px; }
    .ps-card { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:14px 18px; }
    .ps-card.green { border-left:3px solid var(--green); }
    .ps-card.red   { border-left:3px solid var(--red); }
    .ps-card.gray  { border-left:3px solid var(--text-muted); }
    .ps-label { font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:4px; }
    .ps-value { font-size:26px; font-weight:700; }
    /* Status badges */
    .badge-promo { font-size:11px; font-weight:700; padding:3px 8px; border-radius:4px; white-space:nowrap; }
    .badge-promo.active   { background:rgba(39,174,96,.15); color:var(--green); }
    .badge-promo.inactive { background:rgba(231,76,60,.12); color:var(--red); }
    .badge-promo.paused   { background:rgba(230,126,34,.15); color:var(--orange); }
    .badge-promo.finished { background:rgba(100,100,100,.15); color:var(--text-muted); }
    /* SAIU badge piscando */
    .badge-saiu { font-size:10px; font-weight:800; padding:2px 6px; border-radius:4px;
      background:var(--red); color:#fff; animation:blink 1.2s ease-in-out infinite; margin-left:6px; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
    /* New row highlight */
    .row-new { animation:highlight 5s ease-out forwards; }
    @keyframes highlight { 0%{background:rgba(255,230,0,.18)} 100%{background:transparent} }
    .tbl-price { text-align:right; white-space:nowrap; }
    .discount   { color:var(--green); font-weight:700; }
    .time-col   { font-size:11px; color:var(--text-muted); white-space:nowrap; }
    .title-col  { max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    /* Adicionar Promoções */
    .ap-search { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
    .ap-search select, .ap-search input { background:var(--bg-card); border:1px solid var(--border); border-radius:8px; padding:9px 12px; color:var(--text); font-size:13px; }
    .ap-search input { flex:1; min-width:200px; }
    .ap-section { margin-bottom:18px; }
    .ap-section h4 { font-size:13px; color:var(--text-muted); margin-bottom:8px; text-transform:uppercase; letter-spacing:.5px; }
    .ap-row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 14px; background:var(--bg-card); border:1px solid var(--border); border-radius:8px; margin-bottom:8px; flex-wrap:wrap; }
    .ap-row .ap-info { font-size:13px; }
    .ap-row .ap-type { font-weight:700; }
    .ap-row .ap-code { font-size:11px; color:var(--text-muted); margin-left:6px; }
    .ap-row .ap-status { font-size:11px; color:var(--text-muted); }
    .ap-empty { color:var(--text-muted); font-size:13px; padding:8px 0; }
  </style>
</head>
<body>
<div class="app-container">
  <div id="app-sidebar"></div>
  <main class="main-content">
    <div id="app-topbar"></div>
    <div class="content-area">

      <!-- Tabs de visão -->
      <div class="tabs" id="viewTabs">
        <button class="tab-btn active" data-view="historico" onclick="switchView('historico')">Histórico</button>
        <button class="tab-btn" data-view="adicionar" onclick="switchView('adicionar')">Adicionar Promoções</button>
      </div>

      <div id="viewHistorico">
        <!-- Tabs por loja -->
        <div class="tabs" id="storeTabs">
          <button class="tab-btn active" onclick="switchTab('')" data-id="">Todas as lojas</button>
        </div>

        <!-- Summary cards -->
        <div class="promo-summary">
          <div class="ps-card green"><div class="ps-label"><i class="fas fa-tag"></i> Entrou em promoção hoje</div><div class="ps-value" id="s-entrou">0</div></div>
          <div class="ps-card red">  <div class="ps-label"><i class="fas fa-times-circle"></i> Saiu de promoção hoje</div><div class="ps-value" id="s-saiu">0</div></div>
          <div class="ps-card gray"> <div class="ps-label"><i class="fas fa-list"></i> Total de alterações hoje</div><div class="ps-value" id="s-total">0</div></div>
        </div>

        <!-- Table -->
        <div class="card">
          <div class="card-header">
            <h3>Alterações de Promoção — Hoje</h3>
            <div style="display:flex;gap:10px;align-items:center">
              <span id="wsStatus" style="font-size:11px;color:var(--text-muted)"><i class="fas fa-circle" style="font-size:8px"></i> conectando...</span>
              <span id="lastUpdate" style="font-size:11px;color:var(--text-muted)"></span>
              <button class="action-btn" onclick="exportTableCSV(document.getElementById('promoTbody').closest('table'), 'promocoes.csv')"><i class="fas fa-file-csv"></i> CSV</button>
            </div>
          </div>
          <div class="table-responsive">
            <table class="data-table" style="font-size:13px">
              <thead>
                <tr>
                  <th>Anúncio</th>
                  <th>Conta</th>
                  <th>SKU / MLB</th>
                  <th class="tbl-price">Preço Original</th>
                  <th class="tbl-price">Preço Promo</th>
                  <th class="tbl-price">Desconto</th>
                  <th>Status</th>
                  <th>Anterior</th>
                  <th class="time-col">Hora</th>
                </tr>
              </thead>
              <tbody id="promoTbody">
                <tr><td colspan="9" class="empty-state"><div class="spinner" style="margin:auto"></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div id="viewAdicionar" style="display:none">
        <div class="card">
          <div class="card-header"><h3>Buscar anúncio</h3></div>
          <div class="ap-search">
            <select id="apStoreSelect"></select>
            <input type="text" id="apItemInput" placeholder="MLB do anúncio (ex: MLB1234567890)">
            <button class="action-btn" onclick="buscarAnuncioPromo()"><i class="fas fa-search"></i> Buscar</button>
          </div>
          <div id="apResult"></div>
        </div>
      </div>

    </div>
  </main>
</div>
<script src="../js/db.js"></script>
<script src="../js/tableExport.js"></script>
<script src="../js/websocket.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/sidebar.js"></script>
<script>
const R = v => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v)||0);

function copyMlb(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const icon = btn.querySelector('i');
    icon.className = 'fas fa-check';
    btn.style.color = 'var(--green)';
    setTimeout(() => { icon.className = 'fas fa-copy'; btn.style.color = 'var(--text-muted)'; }, 1500);
  });
}
const fmtHora = d => d ? new Date(d).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '—';
const set = (id,v) => { const el=document.getElementById(id); if(el) el.textContent=v; };

let activeStore = '';
let allRows = [];
let storesList = [];

// ── Load lojas for tabs ────────────────────────────────────
async function initTabs() {
  const data = await DB.getLojas() || { stores:[] };
  storesList = data.stores || [];
  const tabs = document.getElementById('storeTabs');
  storesList.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn';
    btn.dataset.id = s.id;
    btn.textContent = s.nickname.replace(/_/g,' ').trim();
    btn.onclick = () => switchTab(String(s.id));
    tabs.appendChild(btn);
  });
  const sel = document.getElementById('apStoreSelect');
  sel.innerHTML = storesList.map(s => `<option value="${s.id}">${s.nickname.replace(/_/g,' ').trim()}</option>`).join('');
}

// ── Adicionar Promoções ─────────────────────────────────────
function switchView(view) {
  document.querySelectorAll('#viewTabs .tab-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  document.getElementById('viewHistorico').style.display = view === 'historico' ? '' : 'none';
  document.getElementById('viewAdicionar').style.display = view === 'adicionar' ? '' : 'none';
}

const PROMO_TYPE_LABELS = {
  LIGHTNING: 'Oferta Relâmpago', DOD: 'Oferta do Dia', PRICE_MATCHING: 'Preços Competitivos',
  SMART_CAMPAIGN: 'Campanha Smart (cofinanciada)', BANK: 'Campanha Pix', PIX_CAMPAIGN: 'Campanha Pix',
  SELLER_CAMPAIGN: 'Campanha do Vendedor', MARKETPLACE_CAMPAIGN: 'Campanha do Mercado Livre',
  PRE_NEGOTIATED: 'Pré-negociado', DEAL: 'Oferta', VOLUME: 'Desconto por Volume',
  UNHEALTHY_STOCK: 'Estoque Parado', SELLER_COUPON_CAMPAIGN: 'Cupom do Vendedor',
};
const promoTypeLabel = t => PROMO_TYPE_LABELS[t] || t || '—';

async function buscarAnuncioPromo() {
  const storeId = document.getElementById('apStoreSelect').value;
  const itemId = document.getElementById('apItemInput').value.trim().toUpperCase();
  const result = document.getElementById('apResult');
  if (!storeId || !itemId) { alert('Selecione a loja e informe o MLB do anúncio.'); return; }
  result.innerHTML = '<div class="spinner" style="margin:20px auto"></div>';

  const [atual, campanhasRes] = await Promise.all([
    DB.getItemPromotion(itemId, storeId),
    DB.getPromoCampanhas(storeId),
  ]);

  const ativas = (atual && atual.promotions) || [];
  const campanhas = (campanhasRes && campanhasRes.campanhas) || [];

  result.innerHTML = `
    <div class="ap-section">
      <h4>Promoções ativas agora neste anúncio</h4>
      <div id="apAtivas"></div>
    </div>
    <div class="ap-section">
      <h4>Campanhas do vendedor disponíveis (verificar elegibilidade)</h4>
      <div id="apCampanhas"></div>
    </div>`;

  const apAtivas = document.getElementById('apAtivas');
  apAtivas.innerHTML = ativas.length ? ativas.map(p => `
    <div class="ap-row">
      <div class="ap-info"><span class="ap-type">${p.name || promoTypeLabel(p.type)}</span><span class="ap-code">${p.type || ''}</span></div>
      <div class="ap-info">${p.promo_price > 0 ? R(p.promo_price) : '—'} ${p.discount_pct ? `<span class="discount">(-${p.discount_pct}%)</span>` : ''}</div>
      <div>
        <button class="action-btn" onclick="sairCampanha('${p.id}','${p.type}','${storeId}','${itemId}',this)"><i class="fas fa-times"></i> Sair</button>
      </div>
    </div>`).join('') : '<div class="ap-empty">Nenhuma promoção ativa neste anúncio agora.</div>';

  const apCampanhas = document.getElementById('apCampanhas');
  if (!campanhasRes || campanhasRes.error) {
    apCampanhas.innerHTML = `<div class="ap-empty">Erro ao consultar campanhas: ${campanhasRes?.error || DB.lastError || 'motivo desconhecido'}</div>`;
    return;
  }
  apCampanhas.innerHTML = campanhas.length ? campanhas.map(c => `
    <div class="ap-row" id="camp-${c.id}">
      <div class="ap-info"><span class="ap-type">${c.name || promoTypeLabel(c.type)}</span><span class="ap-code">${c.type || ''}</span> <span class="ap-status">${c.status || ''}</span></div>
      <div id="camp-status-${c.id}" class="ap-status">—</div>
      <div>
        <button class="action-btn" onclick="verificarElegibilidade('${c.id}','${c.type}','${storeId}','${itemId}',this)"><i class="fas fa-check-circle"></i> Verificar item</button>
      </div>
    </div>`).join('') : '<div class="ap-empty">Nenhuma campanha disponível para esta loja no momento.</div>';
}

async function verificarElegibilidade(promotionId, type, storeId, itemId, btn) {
  btn.disabled = true;
  const statusEl = document.getElementById(`camp-status-${promotionId}`);
  const res = await DB.getPromoElegibilidade(promotionId, storeId, itemId);
  btn.disabled = false;
  if (!res || res.error) { statusEl.textContent = 'erro: ' + (res?.error || DB.lastError || '?'); return; }

  if (res.relacao === 'none') {
    statusEl.innerHTML = '<span style="color:var(--text-muted)">não elegível</span>';
  } else if (res.relacao === 'candidate') {
    statusEl.innerHTML = `<button class="action-btn" style="background:var(--green);color:#000" onclick="aderirCampanha('${promotionId}','${type}','${storeId}','${itemId}',this)"><i class="fas fa-plus"></i> Aderir</button>`;
  } else {
    statusEl.innerHTML = `<span style="color:var(--green)">já participa (${res.relacao})</span>`;
  }
}

async function aderirCampanha(promotionId, type, storeId, itemId, btn) {
  let dealPrice = null;
  if (type === 'LIGHTNING' || type === 'DOD') {
    const v = prompt('Preço promocional (deal_price) pra esta oferta:');
    if (v === null) return;
    dealPrice = Number(v.replace(',', '.'));
    if (!dealPrice || dealPrice <= 0) { alert('Preço inválido.'); return; }
  }
  if (!confirm(`Confirma aderir o item ${itemId} à campanha ${promoTypeLabel(type)}? Essa ação é enviada ao Mercado Livre.`)) return;
  btn.disabled = true;
  const res = await DB.aderirPromocao({ store_id: storeId, item_id: itemId, promotion_id: promotionId, promotion_type: type, deal_price: dealPrice });
  if (!res || res.error) { alert('Erro ao aderir: ' + (res?.error || DB.lastError || 'motivo desconhecido')); btn.disabled = false; return; }
  alert('Item adicionado à campanha.');
  buscarAnuncioPromo();
}

async function sairCampanha(promotionId, type, storeId, itemId, btn) {
  if (!confirm(`Remover o item ${itemId} desta promoção? Essa ação é enviada ao Mercado Livre.`)) return;
  btn.disabled = true;
  const res = await DB.sairPromocao({ store_id: storeId, item_id: itemId, promotion_id: promotionId, promotion_type: type });
  if (!res || res.error) { alert('Erro ao sair: ' + (res?.error || DB.lastError || 'motivo desconhecido')); btn.disabled = false; return; }
  alert('Item removido da promoção.');
  buscarAnuncioPromo();
}

function switchTab(storeId) {
  activeStore = storeId;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.id === storeId));
  renderTable();
}

// ── Load data ─────────────────────────────────────────────
async function load() {
  const data = await DB.getPromocoes({ store_id: '', days: 1 }) || { rows:[], summary:{} };
  allRows = data.rows || [];
  const s = data.summary || {};
  set('s-entrou', s.entrou_hoje ?? 0);
  set('s-saiu',   s.saiu_hoje   ?? 0);
  set('s-total',  s.total_hoje  ?? 0);
  set('lastUpdate', 'Atualizado ' + new Date().toLocaleTimeString('pt-BR'));
  renderTable();
}

function renderTable() {
  const tbody = document.getElementById('promoTbody');
  const rows = activeStore ? allRows.filter(r => String(r.store_id) === activeStore) : allRows;

  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="9" class="empty-state">Nenhuma alteração de promoção hoje</td></tr>';
    return;
  }

  tbody.innerHTML = rows.map(r => {
    const isFirst  = !r.previous_status;
    const isChange = r.status === 'changed';
    const saiu     = r.previous_status === 'active' && r.status !== 'active' && !isChange;
    const entrou   = r.status === 'active' && !r.previous_status;

    let badgeHtml = '';
    if (isFirst || entrou) badgeHtml = '<span class="badge-promo active" style="margin-left:6px">ENTROU</span>';
    else if (saiu)         badgeHtml = '<span class="badge-saiu">SAIU</span>';
    else if (isChange)     badgeHtml = '<span class="badge-promo paused" style="margin-left:6px">ALTEROU</span>';

    const statusLabel = isFirst ? 'Entrou' : isChange ? 'Alteração' : saiu ? 'Saiu' : r.status;
    const statusCls   = isFirst || entrou ? 'active' : isChange ? 'paused' : saiu ? 'inactive' : 'inactive';
    const prevLabel   = r.previous_status ? ({ active:'Ativa', changed:'Alterada' }[r.previous_status] || r.previous_status) : '—';

    return `<tr>
      <td class="title-col" title="${r.item_title||r.offer_id}">
        ${r.item_title || r.offer_id || '—'}
        ${badgeHtml}
      </td>
      <td style="font-size:11px;white-space:nowrap">${r.conta||'—'}</td>
      <td style="font-size:11px;color:var(--text-muted);white-space:nowrap">
        ${r.item_id||'—'}
        ${r.item_id ? `<button onclick="copyMlb('${r.item_id}',this)" title="Copiar MLB" style="background:none;border:none;cursor:pointer;color:var(--text-muted);padding:0 3px;font-size:11px;vertical-align:middle" onmouseenter="this.style.color='var(--primary)'" onmouseleave="this.style.color='var(--text-muted)'"><i class="fas fa-copy"></i></button>` : ''}
      </td>
      <td class="tbl-price">${r.original_price > 0 ? R(r.original_price) : '—'}</td>
      <td class="tbl-price">${r.promo_price > 0 ? R(r.promo_price) : '—'}</td>
      <td class="tbl-price discount">${Number(r.discount_pct) > 0 ? Number(r.discount_pct).toFixed(0)+'%' : '—'}</td>
      <td><span class="badge-promo ${statusCls}">${statusLabel}</span></td>
      <td style="font-size:11px;color:var(--text-muted)">${prevLabel}</td>
      <td class="time-col">${fmtHora(r.changed_at)}</td>
    </tr>`;
  }).join('');
}

// ── Real-time WS update ────────────────────────────────────
WS.on('promo_changed', (payload) => {
  // Prepend new row to allRows and re-render, highlighting it
  allRows.unshift({
    store_id:        payload.store_id,
    conta:           payload.conta || '—',
    offer_id:        payload.offer_id,
    item_id:         payload.item_id,
    item_title:      payload.item_title,
    status:          payload.status,
    previous_status: payload.previous_status,
    original_price:  payload.original_price,
    promo_price:     payload.promo_price,
    discount_pct:    payload.discount_pct,
    changed_at:      new Date().toISOString(),
  });

  // Update summary counters
  const today = allRows.filter(r => new Date(r.changed_at).toDateString() === new Date().toDateString());
  set('s-entrou', today.filter(r => r.status === 'active').length);
  set('s-saiu',   today.filter(r => r.status !== 'active' && r.previous_status === 'active').length);
  set('s-total',  today.length);

  renderTable();

  // Highlight first row
  const tbody = document.getElementById('promoTbody');
  if (tbody.firstElementChild) tbody.firstElementChild.classList.add('row-new');

  // Flash the tab if not on the right store
  if (activeStore && String(payload.store_id) !== activeStore) {
    const btn = document.querySelector(`.tab-btn[data-id="${payload.store_id}"]`);
    if (btn) { btn.style.borderColor='var(--red)'; setTimeout(()=>btn.style.borderColor='',4000); }
  }

  set('lastUpdate', 'Atualizado ' + new Date().toLocaleTimeString('pt-BR'));
});

WS.on('_connected', () => {
  const el = document.getElementById('wsStatus');
  if (el) el.innerHTML = '<i class="fas fa-circle" style="color:var(--green);font-size:8px"></i> ao vivo';
});

window.addEventListener('storeChanged', e => switchTab(String(e.detail.storeId)));

// ── Init ──────────────────────────────────────────────────
initTabs().then(load);
setInterval(load, 60000);
</script>
</body>
</html>
