<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publicidade — ML Dashboard</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/cards.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>window.PAGE_TITLE='Publicidade'; window.ACTIVE_NAV='publicidade.html';</script>
</head>
<body>
<div class="app-container">
  <div id="app-sidebar"></div>
  <main class="main-content">
    <div id="app-topbar"></div>
    <div class="content-area">

      <div class="card" style="margin-bottom:16px">
        <div class="card-header">
          <h3><i class="fas fa-bullhorn" style="color:var(--yellow)"></i> Diagnóstico Publicidade ML</h3>
          <button class="btn btn-primary btn-sm" onclick="load()"><i class="fas fa-sync"></i> Testar API</button>
        </div>
        <div id="result" style="padding:16px;font-family:monospace;font-size:13px;white-space:pre-wrap;word-break:break-all">
          Clique em "Testar API" para verificar acesso à API de publicidade do ML.
        </div>
      </div>

      <div class="card" style="display:none" id="campaignsCard">
        <div class="card-header"><h3>Campanhas Ativas</h3></div>
        <div class="table-responsive">
          <table class="data-table">
            <thead><tr><th>Loja</th><th>ID</th><th>Nome</th><th>Status</th><th>Tipo</th></tr></thead>
            <tbody id="pubTable"></tbody>
          </table>
        </div>
      </div>

    </div>
  </main>
</div>
<script src="../js/db.js"></script>
<script src="../js/websocket.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/sidebar.js"></script>
<script>
async function load() {
  const el = document.getElementById('result');
  el.textContent = 'Carregando...';
  const data = await DB._get('/publicidade');
  if (!data) { el.textContent = '❌ Erro: sem resposta do servidor'; return; }
  if (data.error) { el.textContent = '❌ Erro: ' + data.error; return; }

  let out = '';
  for (const s of data.stores || []) {
    out += `\n── ${s.store} ──\n`;
    for (const t of s.tests || []) {
      if (t.status === 'ok') {
        out += `✅ ${t.url}\n${JSON.stringify(t.data, null, 2)}\n`;
      } else {
        out += `❌ ${t.url}\n   ${t.error}\n`;
      }
    }
  }
  el.textContent = out || 'Sem dados';

  const tbody = document.getElementById('pubTable');
  const card = document.getElementById('campaignsCard');
  if (rows.length) {
    card.style.display = '';
    tbody.innerHTML = rows.map(r => `<tr>
      <td>${r.loja}</td>
      <td style="font-size:11px">${r.id||'—'}</td>
      <td>${r.name||r.title||'—'}</td>
      <td>${r.status||'—'}</td>
      <td>${r.type||r.campaign_type||'—'}</td>
    </tr>`).join('');
  } else {
    card.style.display = 'none';
  }
}
WS.on('_connected', ()=>{ const el=document.getElementById('wsStatus'); if(el) el.innerHTML='<i class="fas fa-circle" style="color:var(--green);font-size:8px"></i> ao vivo'; });
load();
</script>
</body>
</html>
