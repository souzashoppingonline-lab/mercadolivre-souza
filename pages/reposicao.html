<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reposição — ML Dashboard</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/cards.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>window.PAGE_TITLE='Alertas de Reposição'; window.ACTIVE_NAV='reposicao.html';</script>
</head>
<body>
<div class="app-container">
  <div id="app-sidebar"></div>
  <main class="main-content">
    <div id="app-topbar"></div>
    <div class="content-area">
      <div class="card-grid">
        <div class="stat-card"><div class="label">Estoque Crítico</div><div class="value" id="critico" style="color:var(--red)">—</div></div>
        <div class="stat-card"><div class="label">Estoque Baixo</div><div class="value" id="baixo" style="color:var(--orange)">—</div></div>
        <div class="stat-card"><div class="label">Zerados</div><div class="value" id="zerado" style="color:var(--red)">—</div></div>
      </div>
      <div class="card">
        <div class="card-header">
          <h3>Produtos para Repor</h3>
          <select class="filter-select" id="nivelFilter">
            <option value="">Todos</option>
            <option value="zero">Zerado</option>
            <option value="critical">Crítico (≤3)</option>
            <option value="low">Baixo (≤10)</option>
          </select>
        </div>
        <div class="table-responsive">
          <table class="data-table">
            <thead><tr><th>Produto</th><th>Estoque</th><th>Vendas/Dia</th><th>Dias Restantes</th><th>Nível</th></tr></thead>
            <tbody id="reposTable"><tr><td colspan="5" class="empty-state">Carregando...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="../js/db.js"></script>
<script src="../js/websocket.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/sidebar.js"></script>
<script>
async function load() {
  const nivel = document.getElementById('nivelFilter').value;
  const data = await DB.getReposicao() || { items:[], summary:{} };
  const s = data.summary || {};
  document.getElementById('critico').textContent = s.critical ?? '—';
  document.getElementById('baixo').textContent = s.low ?? '—';
  document.getElementById('zerado').textContent = s.zero ?? '—';
  let rows = data.items || [];
  if (nivel==='zero') rows=rows.filter(r=>r.stock===0);
  else if (nivel==='critical') rows=rows.filter(r=>r.stock>0&&r.stock<=3);
  else if (nivel==='low') rows=rows.filter(r=>r.stock>3&&r.stock<=10);
  document.getElementById('reposTable').innerHTML = rows.length
    ? rows.map(r=>{
        const dias = r.daily_sales>0 ? Math.floor(r.stock/r.daily_sales) : '∞';
        const nivel = r.stock===0?'zero':r.stock<=3?'critical':'low';
        return `<tr>
          <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.title}</td>
          <td style="font-weight:700;color:${r.stock===0?'var(--red)':r.stock<=3?'var(--orange)':'var(--primary)'}">${r.stock}</td>
          <td>${(r.daily_sales||0).toFixed(1)}</td>
          <td>${dias}</td>
          <td><span class="tag ${nivel==='zero'?'red':nivel==='critical'?'red':'yellow'}">${nivel==='zero'?'Zerado':nivel==='critical'?'Crítico':'Baixo'}</span></td>
        </tr>`;
      }).join('')
    : '<tr><td colspan="5" class="empty-state">Nenhum alerta de reposição</td></tr>';
}
document.getElementById('nivelFilter').addEventListener('change', load);
WS.on('stock_alert', load);
WS.on('_connected', ()=>{ const el=document.getElementById('wsStatus'); if(el) el.innerHTML='<i class="fas fa-circle" style="color:var(--green);font-size:8px"></i> ao vivo'; });
load();
window.addEventListener('storeChanged', load);
</script>
</body>
</html>
