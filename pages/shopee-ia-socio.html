<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IA Sócio Shopee — ML Dashboard</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/cards.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>window.PAGE_TITLE='IA Sócio'; window.ACTIVE_NAV='shopee-ia-socio.html';</script>
  <style>
    :root { --shopee: #ee4d2d; }
    .params { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:16px; }
    .params select { background:var(--bg-card); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:9px 12px; font-size:13px; }
    .btn-ia { background:linear-gradient(135deg,#ee4d2d,#ff7337); color:#fff; border:none; border-radius:10px; padding:11px 20px; font-weight:700; font-size:14px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; }
    .btn-ia:disabled { opacity:.6; cursor:not-allowed; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; margin-bottom:18px; }
    .kpi { background:var(--bg-card); border:1px solid var(--border); border-left:3px solid var(--shopee); border-radius:10px; padding:12px 14px; }
    .kpi .l { font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; }
    .kpi .v { font-size:20px; font-weight:800; margin-top:4px; }
    .socio-card { background:var(--bg-card); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
    .socio-head { display:flex; align-items:center; gap:12px; padding:16px 20px; border-bottom:1px solid var(--border); }
    .socio-av { width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg,#ee4d2d,#ff7337); display:flex; align-items:center; justify-content:center; color:#fff; font-size:20px; }
    .socio-body { padding:20px; font-size:14px; line-height:1.65; }
    .socio-body h1,.socio-body h2,.socio-body h3 { font-size:15px; margin:16px 0 8px; color:var(--shopee); }
    .socio-body ul,.socio-body ol { margin:8px 0 8px 20px; }
    .socio-body li { margin:5px 0; }
    .socio-body strong { color:var(--text); font-weight:700; }
    .socio-body p { margin:8px 0; }
    .empty-ia { text-align:center; color:var(--text-muted); padding:50px 20px; }
    .empty-ia i { font-size:40px; color:var(--shopee); opacity:.6; margin-bottom:14px; }
  </style>
</head>
<body>
<div class="app-container">
  <div id="app-sidebar"></div>
  <main class="main-content">
    <div id="app-topbar"></div>
    <div class="content-area">

      <div class="params">
        <label style="font-size:12px;color:var(--text-muted)"><i class="fas fa-store"></i> Loja</label>
        <select id="iaLoja"><option value="">Todas as lojas</option></select>
        <button class="btn-ia" id="btnIA" onclick="analisar()"><i class="fas fa-wand-magic-sparkles"></i> Analisar minha operação</button>
        <span id="iaMsg" style="font-size:12px;color:var(--text-muted)"></span>
      </div>

      <div class="kpi-row" id="kpiRow"></div>

      <div class="socio-card">
        <div class="socio-head">
          <div class="socio-av"><i class="fas fa-user-tie"></i></div>
          <div><div style="font-weight:700">Sócio — analista de e-commerce</div><div style="font-size:11px;color:var(--text-muted)">análise automática dos seus dados Shopee</div></div>
        </div>
        <div class="socio-body" id="iaBody">
          <div class="empty-ia"><i class="fas fa-robot"></i><div>Clique em <b>Analisar minha operação</b> pra o Sócio revisar suas vendas, estoque, promoções e problemas e te dizer o que fazer.</div></div>
        </div>
      </div>

    </div>
  </main>
</div>
<script src="../js/db.js"></script>
<script src="../js/websocket.js"></script>
<script src="../js/layout-shopee.js"></script>
<script src="../js/sidebar.js"></script>
<script>
const R = v => 'R$ '+new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(v)||0);
const esc = v => String(v==null?'':v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Markdown mínimo → HTML (negrito, listas, títulos). Escapa antes.
function md(t) {
  const lines = esc(t).split('\n');
  let html = '', inUl = false, inOl = false;
  const close = () => { if(inUl){html+='</ul>';inUl=false;} if(inOl){html+='</ol>';inOl=false;} };
  for (let ln of lines) {
    ln = ln.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    if (/^#{1,3}\s/.test(ln)) { close(); html += `<h3>${ln.replace(/^#{1,3}\s/, '')}</h3>`; continue; }
    const mOl = ln.match(/^\s*\d+\.\s+(.*)/);
    const mUl = ln.match(/^\s*[-*•]\s+(.*)/);
    if (mOl) { if(!inOl){close();html+='<ol>';inOl=true;} html += `<li>${mOl[1]}</li>`; continue; }
    if (mUl) { if(!inUl){close();html+='<ul>';inUl=true;} html += `<li>${mUl[1]}</li>`; continue; }
    close();
    if (ln.trim()) html += `<p>${ln}</p>`;
  }
  close();
  return html;
}

async function loadLojas() {
  const d = await DB.getShopeeLojas();
  const sel = document.getElementById('iaLoja');
  (d?.lojas || []).forEach(l => { const o=document.createElement('option'); o.value=l.id; o.textContent=l.nickname; sel.appendChild(o); });
}

function renderKpis(ctx) {
  const v = ctx?.vendas || {};
  const row = document.getElementById('kpiRow');
  const varTxt = v.variacao_pct_vs_ontem==null ? '—' : (v.variacao_pct_vs_ontem>=0?'▲ ':'▼ ')+Math.abs(v.variacao_pct_vs_ontem)+'%';
  const varCol = v.variacao_pct_vs_ontem==null ? 'var(--text-muted)' : (v.variacao_pct_vs_ontem>=0?'var(--green)':'var(--red)');
  row.innerHTML = `
    <div class="kpi"><div class="l">Faturamento hoje</div><div class="v">${R(v.faturamento_hoje)}</div></div>
    <div class="kpi"><div class="l">vs. ontem</div><div class="v" style="color:${varCol}">${varTxt}</div></div>
    <div class="kpi"><div class="l">Pedidos hoje</div><div class="v">${v.pedidos_hoje ?? 0}</div></div>
    <div class="kpi"><div class="l">Faturamento 7d</div><div class="v">${R(v.faturamento_7d)}</div></div>`;
}

async function analisar() {
  const store_id = document.getElementById('iaLoja').value;
  const btn = document.getElementById('btnIA'), msg = document.getElementById('iaMsg'), body = document.getElementById('iaBody');
  btn.disabled = true; msg.textContent = 'O Sócio está analisando...'; msg.style.color = 'var(--text-muted)';
  body.innerHTML = '<div class="empty-ia"><div class="spinner" style="margin:auto"></div><div style="margin-top:12px">Analisando suas vendas, estoque, promoções e problemas...</div></div>';
  const d = await DB.getShopeeIaSocio(store_id);
  btn.disabled = false;
  if (!d || d.error) {
    msg.textContent = 'Erro'; msg.style.color = 'var(--red)';
    body.innerHTML = `<div class="empty-ia" style="color:var(--red)">${esc(d?.error || 'Falha na análise.')}</div>`;
    return;
  }
  msg.textContent = 'Análise concluída ✓'; msg.style.color = 'var(--green)';
  renderKpis(d.contexto);
  body.innerHTML = md(d.analise || 'Sem resposta.');
}

document.addEventListener('DOMContentLoaded', async () => {
  await loadLojas();
});
</script>
</body>
</html>
