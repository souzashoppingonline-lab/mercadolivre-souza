<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17212b">
  <title>Tela Telegram</title>
  <!-- Autocontida de propósito (sem ../css nem ../js/layout): abre na TV pelo
       link com token mesmo com o login de funcionários ligado. Ver .claude/frontend.md. -->
  <style>
    :root { --bg:#0e1621; --top:#17212b; --in:#182533; --out:#2b5278; --txt:#f5f5f5; --muted:#6d7f8f; --link:#6ab3f3; --code:#0d1a26; --sep:rgba(13,26,38,.7); --fs:15px; }
    * { box-sizing:border-box; }
    html, body { margin:0; height:100%; background:var(--bg); color:var(--txt); font-family:-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size:var(--fs); }
    body { display:flex; flex-direction:column; overflow:hidden; }
    .tg-top { flex:0 0 auto; display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--top); border-bottom:1px solid #0b121a; z-index:2; }
    .av { width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg,#5eb5f7,#2b5278); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; flex:0 0 auto; }
    .nome { min-width:0; flex:1; }
    /* v150: aviso fixo de pergunta/chat sem resposta — no espaço livre do cabeçalho; some quando zera */
    .pend { flex:1 1 0; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:3px; background:linear-gradient(90deg,#7f1d1d,#b91c1c); border:2px solid #f87171; color:#fff; border-radius:14px; padding:5px 12px; font-weight:800; font-size:.82em; line-height:1.25; animation:pendPulsa 1.6s ease-in-out infinite; overflow:hidden; }
    .pend .l1 { display:flex; align-items:center; gap:8px; white-space:nowrap; overflow:hidden; } .pend .l1 b { font-size:1.2em; }
    .pend .l2 { overflow:hidden; white-space:nowrap; font-size:.92em; } .pend .l2 .trilho { display:inline-flex; gap:6px; }
    .pend .l2.rola .trilho { animation:pendRola var(--dur, 20s) linear infinite; padding-left:100%; }
    @keyframes pendRola { to { transform:translateX(-100%); } }
    .pend[hidden] { display:none; } .pend .sino { font-size:1.35em; } .pend .it { display:inline-flex; align-items:center; gap:4px; background:rgba(0,0,0,.25); border-radius:999px; padding:1px 9px; white-space:nowrap; } .pend .it b { font-size:1.15em; }
    .pend .ha { font-weight:700; opacity:.9; font-size:.9em; }
    @keyframes pendPulsa { 50% { box-shadow:0 0 0 4px rgba(248,113,113,.35), 0 0 24px rgba(248,113,113,.45); } }
    body.tv .pend { font-size:.72em; }
    .tg-top:has(.pend:not([hidden])) .nome { flex:0 0 auto; }
    .nome b { display:block; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .nome small { color:var(--muted); font-size:13px; }
    .nome small.on { color:var(--link); }
    .dir { display:flex; align-items:center; gap:12px; }
    .live { color:#e05353; font-weight:800; font-size:12px; letter-spacing:.5px; animation:pisca 2s infinite; }
    .live.off { color:var(--muted); animation:none; }
    @keyframes pisca { 50% { opacity:.35 } }
    #relogio { font-weight:800; font-size:20px; font-variant-numeric:tabular-nums; }
    .ctrls { display:flex; gap:6px; align-items:center; }
    .ctrls button, .ctrls select { background:#22303f; color:var(--txt); border:1px solid #2a3a4b; border-radius:8px; padding:7px 10px; font-size:13px; cursor:pointer; }
    #chat { flex:1; overflow-y:auto; overflow-x:hidden; scrollbar-width:thin; scrollbar-color:#2a3a4b transparent;
      background-color:var(--bg);
      background-image:radial-gradient(circle at 20% 30%, rgba(94,181,247,.04) 0 2px, transparent 3px), radial-gradient(circle at 70% 80%, rgba(94,181,247,.035) 0 2px, transparent 3px);
      background-size:60px 60px, 90px 90px; }
    #lista { max-width:980px; margin:0 auto; padding:16px 14px 40px; transition:opacity .5s; }
    #lista.some { opacity:0; }
    .dia { text-align:center; margin:14px 0 10px; }
    .dia span { background:var(--sep); color:#fff; font-size:13px; font-weight:600; padding:4px 12px; border-radius:14px; }
    .msg { display:flex; margin:4px 0; }
    .msg.ent { justify-content:flex-end; }
    .bolha { position:relative; max-width:min(78%, 760px); background:var(--in); border-radius:14px 14px 14px 4px; padding:7px 11px 6px; box-shadow:0 1px 1px rgba(0,0,0,.25); line-height:1.42; word-wrap:break-word; overflow-wrap:anywhere; }
    .msg.ent .bolha { background:var(--out); border-radius:14px 14px 4px 14px; }
    .bolha .tag { font-size:13px; font-weight:700; margin-bottom:2px; }
    .bolha .txt a { color:var(--link); text-decoration:none; }
    .bolha .txt code { background:var(--code); border-radius:4px; padding:1px 4px; font-family:ui-monospace, Menlo, Consolas, monospace; font-size:.92em; color:#e4ecf2; }
    .bolha .txt pre { background:var(--code); border-radius:6px; padding:6px 8px; white-space:pre-wrap; margin:4px 0; font-family:ui-monospace, Menlo, Consolas, monospace; font-size:.9em; }
    .bolha .txt blockquote { border-left:3px solid var(--link); margin:4px 0; padding:2px 8px; background:rgba(106,179,243,.08); border-radius:0 6px 6px 0; }
    .bolha .txt .tg-spoiler { background:#4a5a6a; color:transparent; border-radius:3px; }
    .bolha .meta { float:right; margin:6px 0 -2px 12px; font-size:12px; color:var(--muted); white-space:nowrap; }
    .msg.ent .meta { color:#9fc3e6; }
    .msg.ent .meta::after { content:' ✓✓'; color:#6ab3f3; }
    .msg.nova .bolha { animation:entra .6s cubic-bezier(.2,1.2,.4,1), brilho 3s ease-out; }
    @keyframes entra { from { transform:translateY(24px) scale(.96); opacity:0 } to { transform:none; opacity:1 } }
    @keyframes brilho { 0%,40% { box-shadow:0 0 0 2px rgba(106,179,243,.85), 0 0 24px rgba(106,179,243,.35) } 100% { box-shadow:0 1px 1px rgba(0,0,0,.25) } }
    /* Foto do anúncio vendido (v126) — só na tela; o Telegram recebe só texto */
    .bolha.com-foto { display:flex; gap:12px; align-items:flex-start; } .bolha.com-foto > .corpo-b { min-width:0; flex:1; }
    .bolha .foto { width:7.5em; height:7.5em; border-radius:10px; object-fit:contain; background:#fff; flex:none; box-shadow:0 2px 8px rgba(0,0,0,.35); }
    /* Alerta de pergunta/chat de cliente (bipe + voz): borda vermelha + selo; pisca quando chega */
    .msg.alerta .bolha { border-left:5px solid #ff5d5d; }
    .msg.alerta .selo { display:inline-block; background:#ff5d5d; color:#fff; font-weight:800; font-size:.8em; letter-spacing:.03em; border-radius:6px; padding:2px 8px; margin-bottom:4px; }
    .msg.nova.alerta .bolha { animation:entra .6s cubic-bezier(.2,1.2,.4,1), alertaPulsa 1.1s ease-in-out 9; }
    @keyframes alertaPulsa { 50% { box-shadow:0 0 0 3px rgba(255,93,93,.95), 0 0 34px rgba(255,93,93,.55); } }
    /* Venda nova (v166 — substitui a carinha): cada logística tem a sua animação, 5 s.
       Mercado Envios = van amarela + bandeira · Flex = moto com baú · Full = raio verde + placa ·
       sem logística = balão amarelo · Shopee = balão laranja com sacolinha. Desenhos próprios, sem logo. */
    .vv { position:fixed; z-index:8990; pointer-events:none; }
    .vv svg { display:block; width:100%; overflow:visible; }
    .vv-anda { left:0; bottom:22px; animation:vvAnda 5s linear forwards; }
    .vv-sobe { bottom:-320px; animation:vvSobe 5s linear forwards; }
    @keyframes vvAnda { from { transform:translateX(-380px); } to { transform:translateX(calc(100vw + 40px)); } }
    @keyframes vvSobe { from { transform:translateY(0); } to { transform:translateY(calc(-100vh - 380px)); } }
    @keyframes vvTreme { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-3px); } }
    @keyframes vvRoda { to { transform:rotate(360deg); } }
    @keyframes vvBalanca { 0%,100% { transform:rotate(-5deg); } 50% { transform:rotate(5deg); } }
    @keyframes vvTremula { 0%,100% { transform:skewY(-4deg) scaleX(1); } 50% { transform:skewY(4deg) scaleX(.96); } }
    @keyframes vvPisca { 0%,100% { filter:drop-shadow(0 0 10px #22c55e) drop-shadow(0 0 22px #4ade80); } 50% { filter:drop-shadow(0 0 4px #22c55e); } }
    .vv .roda { transform-box:fill-box; transform-origin:center; animation:vvRoda .45s linear infinite; }
    .vv .carro { animation:vvTreme .3s ease-in-out infinite; }
    .vv .txt-l { font-weight:900; color:#111827; line-height:1.12; word-break:break-word; }
    .vv .txt-t { font-weight:900; text-transform:uppercase; letter-spacing:.3px; }
    /* van + bandeira */
    .vv-van { width:300px; } body.tv .vv-van { width:360px; }
    .vv-van .mastro { position:absolute; left:16%; bottom:84%; width:5px; height:92px; background:linear-gradient(#e5e7eb,#9ca3af); border-radius:3px; }
    .vv-van .bandeira { position:absolute; left:calc(16% + 5px); bottom:calc(84% + 30px); background:#fff; border:3px solid #2d3277; border-left-width:6px; border-radius:2px 10px 10px 2px; padding:6px 14px 7px 10px; min-width:120px; max-width:230px; transform-origin:left center; animation:vvTremula .6s ease-in-out infinite; box-shadow:0 6px 16px rgba(0,0,0,.45); }
    .vv-van .bandeira .txt-l { font-size:20px; } .vv-van .bandeira .txt-t { font-size:12px; color:#2d3277; }
    /* moto + baú */
    .vv-moto { width:250px; } body.tv .vv-moto { width:300px; }
    .vv-moto .placa-bau { position:absolute; left:0; bottom:76%; width:46%; min-width:120px; background:#fff; border:3px solid #ea580c; border-radius:10px; padding:5px 8px 6px; text-align:center; box-shadow:0 6px 14px rgba(0,0,0,.45); }
    .vv-moto .placa-bau .txt-l { font-size:17px; } .vv-moto .placa-bau .txt-t { font-size:11px; color:#ea580c; }
    /* raio verde (Full) + placa */
    .vv-full { width:330px; bottom:30px; display:flex; align-items:flex-end; gap:6px; } body.tv .vv-full { width:390px; }
    .vv-full svg { width:120px; flex:none; animation:vvPisca .35s ease-in-out infinite; }
    .vv-full .placa-full { margin-bottom:70px; background:#052e16; border:3px solid #4ade80; border-radius:12px; padding:7px 12px 8px; box-shadow:0 0 18px rgba(74,222,128,.55); }
    .vv-full .placa-full .txt-l { color:#fff; font-size:20px; } .vv-full .placa-full .txt-t { color:#4ade80; font-size:12px; }
    /* balões (sem logística / Shopee) */
    .vv-balao { width:170px; } body.tv .vv-balao { width:200px; }
    .vv-balao .flutua { position:relative; transform-origin:50% 0; animation:vvBalanca 1.6s ease-in-out infinite; }
    .vv-balao .dentro { position:absolute; left:10%; right:10%; top:13%; height:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
    .vv-balao .dentro .txt-t { font-size:13px; } .vv-balao .dentro .txt-l { font-size:18px; }
    .vv-balao .dentro .ico { font-size:34px; line-height:1; }
    .vv-balao.shopee .dentro .txt-t, .vv-balao.shopee .dentro .txt-l { color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.4); }
    /* Guitarrista (v170): gordinho cabeludo fazendo solo — cena de pergunta/chat (padrão) */
    .rock-cena { position:fixed; left:0; right:0; bottom:18px; height:0; z-index:9000; pointer-events:none; }
    .rock { position:absolute; left:0; bottom:0; width:230px; transform:translateX(-320px); }
    body.tv .rock { width:280px; }
    .rock svg { display:block; width:100%; overflow:visible; position:relative; }
    .rock .luz { position:absolute; left:50%; bottom:-20px; width:520px; height:520px; transform:translateX(-50%); background:radial-gradient(ellipse at 50% 100%, rgba(250,204,21,.38), rgba(250,204,21,.08) 45%, transparent 65%); animation:rockLuz .45s ease-in-out infinite alternate; }
    .rock .placa-r { position:absolute; bottom:100%; left:50%; transform:translateX(-50%); margin-bottom:10px; background:#fff; color:#b91c1c; border:4px solid #b91c1c; border-radius:12px; padding:8px 14px; font-weight:900; font-size:22px; line-height:1.25; white-space:nowrap; box-shadow:0 6px 18px rgba(0,0,0,.45); text-align:center; animation:patoPlaca .32s ease-in-out infinite alternate; }
    body.tv .rock .placa-r { font-size:28px; }
    .rock .corpo-r { transform-box:fill-box; transform-origin:50% 100%; animation:rockBalanca .64s ease-in-out infinite alternate; }
    .rock .cabeca { transform-box:fill-box; transform-origin:50% 95%; animation:rockHeadbang .3s ease-in-out infinite alternate; }
    .rock .palheta { transform-box:fill-box; transform-origin:0 0; animation:rockPalheta .11s linear infinite alternate; }
    .rock.desliza svg { transform:rotate(-8deg); }
    .rock .nota { position:absolute; font-size:30px; font-weight:900; opacity:0; animation:rockNota 1.5s ease-out infinite; text-shadow:0 2px 6px rgba(0,0,0,.5); }
    @keyframes rockLuz { from { opacity:.6; } to { opacity:1; } }
    @keyframes rockBalanca { from { transform:rotate(-3deg); } to { transform:rotate(3deg); } }
    @keyframes rockHeadbang { from { transform:rotate(-14deg) translateY(0); } to { transform:rotate(16deg) translateY(4px); } }
    @keyframes rockPalheta { from { transform:rotate(-10deg); } to { transform:rotate(12deg); } }
    @keyframes rockNota { 0% { opacity:0; transform:translate(0,0) scale(.6); } 15% { opacity:1; } 100% { opacity:0; transform:translate(var(--nx,30px),-150px) scale(1.2) rotate(var(--nr,15deg)); } }
    @keyframes patoPlaca { from { transform:rotate(-3deg); } to { transform:rotate(3deg) translateY(-3px); } }   /* balanço da placa do guitarrista */
    .som-aviso { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:#3a2a12; border:1px solid #f2c94c; color:#ffe7a3; border-radius:12px; padding:10px 18px; font-size:16px; font-weight:600; z-index:7; cursor:pointer; display:none; animation:pisca 2s infinite; }
    .vazio { text-align:center; color:var(--muted); margin-top:30vh; font-size:16px; line-height:1.6; }
    .toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#22303f; border:1px solid #2a3a4b; border-radius:10px; padding:10px 14px; font-size:14px; display:none; z-index:5; max-width:90vw; }
    .cheia { position:fixed; inset:0; background:rgba(14,22,33,.85); display:none; align-items:center; justify-content:center; z-index:6; font-size:22px; cursor:pointer; text-align:center; }
    /* Modo TV: letra grande, sem controles, sem cursor parado */
    body.tv { --fs:clamp(18px, 1.55vw, 34px); }
    body.tv .ctrls { display:none; }
    body.tv .av { width:58px; height:58px; font-size:20px; }
    body.tv .nome b { font-size:1.25em; }
    body.tv #relogio { font-size:1.6em; }
    body.tv #lista { max-width:min(1400px, 92vw); }
    body.tv .bolha { max-width:min(86%, 1200px); }
    /* v139 (pedido do usuário): avisos do sistema ocupam toda a largura da coluna de mensagens —
       sem faixa vazia entre as bolhas e o painel. Comandos que chegam no bot (.ent) continuam estreitos. */
    .msg:not(.ent) .bolha, body.tv .msg:not(.ent) .bolha { max-width:100%; }
    body.tv #lista { max-width:none; }
    body.tv.parado { cursor:none; }
    /* Painel ao lado (v124): placar de hoje, rankeamento hoje, IA Estrategista. Some em tela estreita. */
    .corpo { flex:1; display:flex; min-height:0; }
    .corpo #chat { min-width:0; }
    /* Letra do painel independe do --fs do modo TV (senão estoura a altura). */
    #painel { font-size:clamp(13px, min(1.05vw, 2vh), 24px); width:clamp(400px, 40vw, 860px); flex:none; border-left:1px solid #0b121a; background:#111c28; padding:14px 16px; display:flex; flex-direction:column; gap:12px; overflow:hidden; }
    #painel[hidden] { display:none; }
    .blk { background:var(--top); border:1px solid #22303f; border-radius:16px; padding:12px 14px; }
    .blk h3 { margin:0 0 8px; font-size:.86em; letter-spacing:.4px; color:#9fb4c7; text-transform:uppercase; display:flex; align-items:center; gap:8px; }
    .blk h3 small { margin-left:auto; text-align:right; font-size:.82em; color:var(--muted); text-transform:none; letter-spacing:0; font-weight:500; }
    .pl-big { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .pl-big .k { font-size:.76em; color:var(--muted); font-weight:700; }
    .pl-big .v { font-size:1.95em; font-weight:900; margin-top:2px; font-variant-numeric:tabular-nums; }
    .pl-big .s { font-size:.82em; font-weight:700; margin-top:2px; }
    .pl-big .s em { color:var(--muted); font-weight:500; font-style:normal; }
    .up { color:#3fb950; } .dn { color:#f85149; }
    .lj { margin-top:10px; }
    .lj .l { display:flex; gap:8px; align-items:center; padding:5px 0 2px; font-size:.86em; }
    .lj .l .n { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .lj .l .q { color:#9fb4c7; white-space:nowrap; } .lj .l .f { font-weight:800; min-width:5.5em; text-align:right; white-space:nowrap; }
    .lj .bar { height:5px; border-radius:4px; background:#22303f; overflow:hidden; } .lj .bar i { display:block; height:100%; background:linear-gradient(90deg,#5eb5f7,#2b5278); }
    .est { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px; }
    .est div { background:#1c2a39; border-radius:10px; padding:4px 2px; text-align:center; }
    .est .i { font-size:.95em; } .est .v { font-size:1.15em; font-weight:900; line-height:1.15; } .est .l { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:.62em; color:var(--muted); font-weight:700; text-transform:uppercase; }
    .bb { display:flex; gap:6px; margin-top:6px; } .bb div { flex:1; border-radius:10px; padding:4px 6px; text-align:center; font-weight:800; font-size:.78em; }
    .bb b { font-size:1.25em; margin-right:4px; } .bb .g { background:rgba(63,185,80,.14); color:#3fb950; } .bb .e { background:rgba(240,136,62,.14); color:#f0883e; } .bb .p { background:rgba(248,81,73,.14); color:#f85149; }
    .bb-sub { display:none; }
    /* Carrossel (v129) — gira a cada 30s (v130) */
    .car { flex:1; min-height:0; display:flex; flex-direction:column; }
    #carCorpo { flex:1; min-height:0; overflow:hidden; animation:carEntra .5s ease; }
    @keyframes carEntra { from { opacity:0; transform:translateX(18px); } to { opacity:1; transform:none; } }
    .car-dots { display:flex; justify-content:center; gap:6px; margin-top:6px; }
    .car-dots i { width:7px; height:7px; border-radius:50%; background:#2a3a4b; } .car-dots i.on { background:#5eb5f7; }
    .tp { display:flex; align-items:center; gap:9px; padding:6px 0; border-top:1px solid #22303f; } .tp:first-child { border-top:none; }
    .tp .pos { width:1.6em; text-align:center; font-weight:900; color:#9fb4c7; flex:none; }
    .tp img { width:2.3em; height:2.3em; border-radius:8px; object-fit:cover; background:#fff; flex:none; }
    .tp .t { flex:1; min-width:0; font-size:.86em; } .tp .t b { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:700; } .tp .t span { color:#9fb4c7; font-size:.92em; }
    .tp .v { font-weight:900; white-space:nowrap; font-size:.9em; text-align:right; } .tp .v small { display:block; color:#9fb4c7; font-weight:600; font-size:.82em; }
    /* Vendas por hora (v130): barras grandes lado a lado (hoje azul × ontem cinza), número em cima, ocupa o card todo */
    .hrw { display:flex; flex-direction:column; height:100%; }
    /* v131: promoções, frase do dia */
    .pr-cont { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:6px; }
    .pr-cont div { background:#1c2a39; border-radius:12px; padding:8px 10px; } .pr-cont b { display:block; font-size:1.7em; font-weight:900; } .pr-cont span { font-size:.78em; color:#9fb4c7; }
    .pr-sub { font-size:.78em; font-weight:800; color:#9fb4c7; text-transform:uppercase; letter-spacing:.3px; margin:6px 0 2px; }
    /* v133 */
    .tk { display:grid; grid-template-columns:1fr 1fr; gap:10px; } .tk div { background:#1c2a39; border-radius:12px; padding:12px; }
    .tk span { display:block; font-size:.8em; color:#9fb4c7; font-weight:700; } .tk b { display:block; font-size:2em; font-weight:900; margin:4px 0; } .tk small { font-size:.8em; color:#9fb4c7; }
    /* v164: meta do mês */
    .mt-barra { position:relative; height:1.5em; background:#1c2a39; border-radius:999px; overflow:hidden; margin:6px 0 10px; }
    .mt-barra i { position:absolute; inset:0 auto 0 0; background:linear-gradient(90deg,#16a34a,#5ef08a); border-radius:999px; }
    .mt-barra em { position:absolute; top:-3px; bottom:-3px; width:3px; background:#f0b429; }
    .mt-barra span { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:.85em; text-shadow:0 1px 2px #000; }
    .tk-dica { margin-top:10px; font-size:.86em; background:rgba(94,181,247,.08); border-radius:10px; padding:8px 10px; }

<script>
// Tela Telegram — cópia de TODA mensagem do Telegram (telegram_mensagens,
// gravada por server/src/telegramLog.js), no mesmo visual, rolando sozinha
// pra deixar numa TV. Rolagem: desce devagar pelas mensagens; no fim espera e
// recomeça do topo. Mensagem nova: entra embaixo com brilho e a tela segura
// nela 15s. Dados: /api/telegram-tela (login) ou /api/publico/telegram-tela
// ?token= (link da TV). Ao vivo: WebSocket avisa só o id (`telegram_mensagem`)
// + conferência a cada 15s. Ver .claude/frontend.md.
const P = new URLSearchParams(location.search);
const TOKEN = P.get('token') || '';
const API = TOKEN ? `/api/publico/telegram-tela?token=${encodeURIComponent(TOKEN)}` : '/api/telegram-tela';
const MAX_NA_TELA = 300;
const TOPICOS = {
  tg_vendas: ['🛒 Vendas', '#5eb5f7'], tg_rankeamento: ['📈 Rankeamento', '#b48cf2'], tg_rankeamento_resumo: ['📊 Rankeamento', '#b48cf2'], tg_ia_estrategista: ['🧠 IA Estrategista', '#a78bfa'], tg_topvendas: ['🔥 Top vendas', '#f2a54a'],
  tg_outlier: ['📊 Fora do normal', '#f2a54a'], tg_servicos: ['🛠️ Serviços', '#8fa3b5'], tg_recursos: ['💻 Servidor', '#8fa3b5'],
  tg_reposicao: ['📦 Reposição', '#f2c94c'], tg_perguntas: ['❓ Perguntas', '#5ed1a5'], tg_mensagens: ['💬 Mensagens', '#5ed1a5'],
  tg_promocoes: ['🏷️ Promoções', '#e66fb0'], tg_devolucoes: ['↩️ Devoluções', '#e05353'], tg_anuncios: ['📝 Anúncios', '#5eb5f7'],
  tg_tarefas: ['✅ Tarefas', '#5ed1a5'], tg_conciliacao: ['🏦 Conciliação', '#8fa3b5'], tg_shopee_campanhas: ['🟠 Shopee', '#f2784b'],
  tg_token: ['🔑 Tokens', '#e05353'], tg_fila: ['⏳ Fila', '#8fa3b5'], tg_429: ['🚦 Limite ML', '#e05353'], tg_infra: ['🖥️ Infra', '#e05353'],
  tg_queda_produtos: ['📉 Queda de vendas', '#e05353'], tg_importacao_metrizap: ['📥 Metrizap', '#f2c94c'], tg_pagamentos: ['💸 Pagamentos', '#5ed1a5'],
  tg_dividas_lembrete: ['⏰ Dívidas', '#f2c94c'], tg_buybox_mudancas: ['🏆 Buy Box', '#f2a54a'], tg_buybox_relatorio: ['🏆 Buy Box', '#f2a54a'],
  tg_email_falha: ['📧 E-mail', '#e05353'], bot: ['🤖 Bot', '#8fa3b5'], teste: ['🧪 Teste', '#8fa3b5'],
};
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const chat = document.getElementById('chat'), lista = document.getElementById('lista');
let ultimoId = 0, ultimoDia = '', total = 0, hoje = 0;

function toast(t, ms = 3500) { const e = document.getElementById('toast'); e.innerHTML = t; e.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => { e.style.display = 'none'; }, ms); }
const diaDe = iso => new Date(iso).toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' });
function rotuloDia(d) {
  const hojeD = diaDe(new Date()), ontem = diaDe(new Date(Date.now() - 86400000));
  if (d === hojeD) return 'Hoje';
  if (d === ontem) return 'Ontem';
  return new Date(d + 'T12:00:00').toLocaleDateString('pt-BR', { day: 'numeric', month: 'long' });
}
function bolha(m, nova) {
  const d = diaDe(m.criado_em);
  let html = '';
  if (d !== ultimoDia) { html += `<div class="dia"><span>${rotuloDia(d)}</span></div>`; ultimoDia = d; }
  const t = TOPICOS[m.topico] || (m.topico ? [esc(m.topico), '#8fa3b5'] : null);
  const hora = new Date(m.criado_em).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', timeZone: 'America/Sao_Paulo' });
  const ent = m.direcao === 'entrada';
  const al = tipoAlerta(m);
  const foto = m.imagem && /^https?:\/\//.test(m.imagem) ? `<img class="foto" src="${esc(m.imagem)}" alt="" loading="lazy" onerror="this.remove()">` : '';
  html += `<div class="msg ${ent ? 'ent' : ''}${nova ? ' nova' : ''}${al ? ' alerta' : ''}" data-id="${m.id}"><div class="bolha${foto ? ' com-foto' : ''}">${foto}<div class="corpo-b">
    ${al ? `<div class="selo">${al.selo}</div>` : ''}${!ent && t ? `<div class="tag" style="color:${t[1]}">${t[0]}</div>` : ''}${ent && m.autor ? `<div class="tag" style="color:#9fc3e6">${esc(m.autor)}</div>` : ''}
    <div class="txt">${TelegramHtml.paraHtml(m.texto, m.html !== false)}<span class="meta">${hora}</span></div></div></div></div>`;
  return html;
}
function poda() {
  const msgs = lista.querySelectorAll('.msg');
  for (let i = 0; i < msgs.length - MAX_NA_TELA; i++) msgs[i].remove();
  lista.querySelectorAll('.dia').forEach(dv => { if (!dv.nextElementSibling || dv.nextElementSibling.classList.contains('dia')) dv.remove(); });
}
function cabecalho() {
  document.getElementById('sub').textContent = `bot · ${hoje} mensagem(ns) hoje`;
}

async function buscar(novas) {
  try {
    const r = await fetch(novas ? `${API}${TOKEN ? '&' : '?'}depois_id=${ultimoId}` : API, { credentials: 'same-origin' });
    if (r.status === 401 || r.status === 403) {
      const j = await r.json().catch(() => ({}));
      lista.innerHTML = `<div class="vazio">🔒 ${esc(j.error || 'Sem acesso')}<br><small>Abra pelo menu (com login) ou pelo <b>🔗 Link da TV</b>.</small></div>`;
      return;
    }
    const j = await r.json();
    hoje = j.hoje || 0; cabecalho();
    const ms = j.mensagens || [];
    if (!novas) {
      ultimoDia = '';
      lista.innerHTML = ms.length ? ms.map(m => bolha(m, false)).join('') : '<div class="vazio">Nenhuma mensagem ainda.<br><small>Todo aviso que o sistema mandar pro Telegram aparece aqui, na hora.</small></div>';
      if (ms.length) ultimoId = ms[ms.length - 1].id;
      total = ms.length;
      chat.scrollTop = chat.scrollHeight;
      return;
    }
    if (!ms.length) return;
    if (!total) { lista.innerHTML = ''; ultimoDia = ''; }
    lista.insertAdjacentHTML('beforeend', ms.map(m => bolha(m, true)).join(''));
    ultimoId = ms[ms.length - 1].id; total += ms.length;
    poda();
    mostrarNova();
    tocarAlerta(ms.map(m => { const a = tipoAlerta(m); return a ? { a, loja: lojaDaVenda(m).loja } : null; }).filter(Boolean));
    ms.filter(ehVendaNova).forEach(m => filaCarinha(m));

  { tit: '🎯 Meta do mês', html: d => { const m = d.carrossel.meta; if (!m) return '';

      if (m.sem_meta) return `<div class="pn-vazio">Nenhuma meta lançada para este mês. Faturado até agora: <b>${R$(m.faturado)}</b>.<br>Lance a meta em <b>Financeiro → Vendas & Custos → Lançar meta</b>.</div>`;
      const pct = Math.min(100, m.pct), ideal = Math.min(100, (m.ritmo_ideal_ate_hoje / m.meta) * 100), adiantado = m.faturado >= m.ritmo_ideal_ate_hoje;
      return `<div class="mt-barra"><i style="width:${pct}%"></i><em style="left:${ideal}%" title="onde deveria estar hoje"></em><span>${m.pct.toLocaleString('pt-BR')}% de ${R$(m.meta)}</span></div>
        <div class="tk"><div><span>💰 Faturado no mês</span><b>${R$(m.faturado)}</b><small>${adiantado ? '<span class="up">✅ à frente do ritmo</span>' : `<span class="dn">${R$(m.ritmo_ideal_ate_hoje - m.faturado)} atrás do ritmo</span>`}</small></div>
        <div><span>${m.falta ? '🎯 Falta' : '🏆 Meta batida!'}</span><b>${m.falta ? R$(m.falta) : R$(m.faturado - m.meta) + ' a mais'}</b><small>${m.falta ? `<b style="color:#f0b429">${R$(m.por_dia)}/dia</b> nos ${m.dias_restantes} dia(s) que faltam` : 'parabéns, equipe! 🎉'}</small></div></div>
        ${m.projecao ? `<div class="tk-dica">📈 No ritmo atual o mês fecha em <b>${R$(m.projecao)}</b> (${Math.round((m.projecao / m.meta) * 100)}% da meta).</div>` : ''}`; } },
  { tit: '📆 Melhor dia e horário — últimos 30 dias', html: d => { const m = d.carrossel.melhor; if (!m) return ''; const NOMES = ['', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'], NOMES_L = ['', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado', 'Domingo'];
      const dias = m.por_dia, maxD = Math.max(1, ...dias.map(x => x.pedidos_media)), melhorD = dias.reduce((a, x) => x.pedidos_media > a.pedidos_media ? x : a, dias[0]);
      const ph = m.por_hora, tot = ph.reduce((a, b) => a + b, 0) || 1; let bi = 0, bv = -1; for (let h = 0; h < 24; h++) { const v = ph[h] + ph[(h + 1) % 24] + ph[(h + 2) % 24]; if (v > bv) { bv = v; bi = h; } }
      const pico = h => h === bi || h === (bi + 1) % 24 || h === (bi + 2) % 24, maxH = Math.max(1, ...ph);
      return `<div class="md-top"><div>🏆 Melhor dia<b>${NOMES_L[melhorD.dow]}</b><small>média ${Math.round(melhorD.pedidos_media)} pedidos · ${R$(melhorD.fat_media)}</small></div><div>⏰ Pico de vendas<b>${bi}h–${(bi + 3) % 24}h</b><small>${Math.round((bv / tot) * 100)}% dos pedidos do dia</small></div></div>
        <div class="md-dias">${dias.map(x => `<div class="${x.dow === melhorD.dow ? 'on' : ''}"><span class="v">${Math.round(x.pedidos_media)}</span><span class="b" style="height:${(x.pedidos_media / maxD) * 100}%"></span><span class="l">${NOMES[x.dow]}</span></div>`).join('')}</div>
        <div class="md-horas">${ph.map((v, h) => `<span class="${pico(h) ? 'on' : ''}" style="height:${Math.max(3, (v / maxH) * 100)}%" title="${h}h: ${v}"></span>`).join('')}</div><div class="hr-l">${ph.map((_, h) => `<span>${h % 3 === 0 ? h + 'h' : ''}</span>`).join('')}</div>`; } },
  { tit: '🖥️ Estado do servidor', html: d => { const s = d.servidor; if (!s) return '<div class="pn-vazio">Métricas do servidor indisponíveis.</div>'; const GB = b => (b / 1073741824).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' GB';
      const cor = (v, lim) => v == null ? '#8b949e' : v >= lim ? '#f85149' : v >= lim - 20 ? '#f0b429' : '#3fb950';
      const g = (nome, v, lim, sub) => `<div class="sv"><div class="sv-a" style="--p:${Math.min(100, v || 0)};--c:${cor(v, lim)}"><b>${v == null ? '—' : Math.round(v) + '%'}</b></div><div class="sv-n">${nome}</div><div class="sv-s">${sub}</div></div>`;
      const up = s.uptime_s, upTxt = up >= 86400 ? `${Math.floor(up / 86400)} dia(s)` : `${Math.floor(up / 3600)}h`;
      return `<div class="sv-g">${g('🧠 CPU', s.cpu, 90, `${s.cores} núcleo(s)`)}${g('💾 Memória', s.mem, s.limite_mem, `de ${GB(s.mem_total)}`)}${g('🗄️ Disco', s.disco, s.limite_disco, s.disco_livre != null ? `${GB(s.disco_livre)} livres` : '')}</div><div class="pn-vazio" style="text-align:center;margin-top:8px">⏱️ Servidor ligado há ${upTxt} · 🟢 normal · 🟡 atenção · 🔴 crítico</div>`; } },
  { tit: '💬 Frase do dia', html: d => d.carrossel.frase ? `<div class="frase"><div class="aspas">“</div><div class="txt">${esc(d.carrossel.frase.frase)}</div><div class="assin">${d.carrossel.frase.origem === 'ia' ? '🤖 criada pela IA para hoje · nunca se repete' : '— equipe'}</div></div>` : '<div class="pn-vazio">Frase do dia indisponível.</div>' },
  { tit: '🚫 Pedidos cancelados hoje', html: d => { const c = d.carrossel.cancelados; if (!c) return '';
      if (!c.total) return '<div class="pn-vazio">✅ Nenhum pedido cancelado hoje.</div>';
      const hora = t => new Date(t).toLocaleTimeString('pt-BR', { timeZone: 'America/Sao_Paulo', hour: '2-digit', minute: '2-digit' });
      return `<div class="pr-cont"><div><b style="color:#f85149">${c.total}</b><span>pedido(s) cancelado(s) · ${R$(c.valor)}</span></div><div><span style="display:block;margin-bottom:2px">por loja</span>${c.por_loja.slice(0, 4).map(l => `<span style="display:block;color:#e6edf3">${l.mkt === 'SHOPEE' ? '🛍️' : '🟡'} ${esc(l.loja)}: <b style="display:inline;font-size:1em">${l.qtd}</b></span>`).join('')}</div></div>`
        + (c.bipados ? `<div class="tk-dica" style="color:#f85149">⚠️ <b>${c.bipados} já bipado(s)</b> — tirar o pacote do envio!</div>` : '')
        + c.itens.map(x => `<div class="tp"><div class="pos">${x.bipado ? '⚠️' : '🚫'}</div><div class="t"><b>${esc(x.titulo || '—')}</b><span>${x.mkt === 'SHOPEE' ? 'Shopee' : 'ML'} · ${esc(x.loja)} · ${hora(x.em)}${x.de_hoje ? '' : ' (venda de outro dia)'}${x.motivo ? ' · ' + esc(corta(x.motivo, 40)) : ''}</span></div><div class="v" style="color:#f85149">${R$(x.valor)}<small>${x.qtd} un</small></div></div>`).join('')
        + `<div class="tk-dica">💰 ${R$(c.valor_fat_hoje)} já descontado do faturamento de hoje.</div>`; } },
];
function renderCarrossel() {
  if (!CAR_DADOS || !CAR_DADOS.carrossel) return;
  const sl = SLIDES[carIdx % SLIDES.length];
  document.getElementById('carTit').innerHTML = `${sl.tit}<small>${carIdx % SLIDES.length + 1}/${SLIDES.length}</small>`;
  const corpo = document.getElementById('carCorpo');
  corpo.style.animation = 'none'; void corpo.offsetWidth; corpo.style.animation = '';
  corpo.innerHTML = sl.html(CAR_DADOS);
  document.getElementById('carDots').innerHTML = SLIDES.map((_, i) => `<i class="${i === carIdx % SLIDES.length ? 'on' : ''}"></i>`).join('');
}
setInterval(() => { carIdx = (carIdx + 1) % SLIDES.length; renderCarrossel(); }, 30000); // v130: 30s por tela (pedido do usuário)

// ── Versão celular (v165) — mesma página; abaixo de 760 px vira 3 abas ───────
// 💬 Avisos (a conversa) · 📊 Painel (placar + estágios + carrossel, passa com o
// dedo ou ‹ ›) · ⚙️ Ajustes (os botões do topo: Som, Pato, Carinha, rolagem).
// Mensagem nova com outra aba aberta → contador vermelho no 💬. Aba lembrada.
let abaM = 'chat', novasFora = 0;
function setAbaM(a) {
  abaM = a; try { localStorage.setItem('tela_tg_aba_m', a); } catch (_) {}
  document.body.classList.toggle('m-painel', a === 'painel');
  document.body.classList.toggle('m-ajustes', a === 'ajustes');
  document.querySelectorAll('#mNav button').forEach(b => b.classList.toggle('on', b.dataset.aba === a));
  document.documentElement.style.setProperty('--m-top', document.querySelector('.tg-top').offsetHeight + 'px');
  if (a === 'chat') { novasFora = 0; document.getElementById('mBdg').textContent = ''; chat.scrollTop = chat.scrollHeight; }
  if (a === 'painel') renderCarrossel();
}
document.querySelectorAll('#mNav button').forEach(b => b.onclick = () => setAbaM(b.dataset.aba));
function avisarNovasM(n) { if (abaM === 'chat' || !n) return; novasFora += n; document.getElementById('mBdg').textContent = novasFora > 99 ? '99+' : novasFora; }
function carPasso(d) { carIdx = (carIdx + d + SLIDES.length) % SLIDES.length; renderCarrossel(); }
(function () {   // passar o carrossel com o dedo
  let x0 = null, y0 = 0; const car = document.querySelector('#painel .car');
  car.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  car.addEventListener('touchend', e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null; if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) carPasso(dx < 0 ? 1 : -1); });
})();
try { const a = localStorage.getItem('tela_tg_aba_m'); if (a && a !== 'chat' && matchMedia('(max-width:760px)').matches) setTimeout(() => setAbaM(a), 0); } catch (_) {}

function painelDepoisDeMensagem() { clearTimeout(painelT); painelT = setTimeout(carregarPainel, 3000); }
setInterval(carregarPainel, 60000);
carregarPainel();
// Recarrega a página 1x por dia (madrugada) — TV ligada semanas sem acumular memória.
setInterval(() => { const h = new Date().getHours(); if (h === 4 && performance.now() > 3600e3) location.reload(); }, 600000);

buscar(false).then(() => { requestAnimationFrame(quadro); conectar(); });
</script>
