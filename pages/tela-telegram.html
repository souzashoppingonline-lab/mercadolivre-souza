<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17212b">
  <title>Tela Telegram</title>
  <!-- Autocontida de propósito (sem ../css nem ../js/layout): abre na TV pelo
       link com token mesmo com o login de funcionários ligado. Ver .claude/frontend.md. -->
  <style>
    :root { --bg:#0e1621; --top:#17212b; --in:#182533; --out:#2b5278; --txt:#f5f5f5; --muted:#6d7f8f; --link:#6ab3f3; --code:#0d1a26; --sep:rgba(13,26,38,.7); --fs:15px; }
    * { box-sizing:border-box; }
    html, body { margin:0; height:100%; background:var(--bg); color:var(--txt); font-family:-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size:var(--fs); }
    body { display:flex; flex-direction:column; overflow:hidden; }
    .tg-top { flex:0 0 auto; display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--top); border-bottom:1px solid #0b121a; z-index:2; }
    .av { width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg,#5eb5f7,#2b5278); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; flex:0 0 auto; }
    .nome { min-width:0; flex:1; }
    .nome b { display:block; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .nome small { color:var(--muted); font-size:13px; }
    .nome small.on { color:var(--link); }
    .dir { display:flex; align-items:center; gap:12px; }
    .live { color:#e05353; font-weight:800; font-size:12px; letter-spacing:.5px; animation:pisca 2s infinite; }
    .live.off { color:var(--muted); animation:none; }
    @keyframes pisca { 50% { opacity:.35 } }
    #relogio { font-weight:800; font-size:20px; font-variant-numeric:tabular-nums; }
    .ctrls { display:flex; gap:6px; align-items:center; }
    .ctrls button, .ctrls select { background:#22303f; color:var(--txt); border:1px solid #2a3a4b; border-radius:8px; padding:7px 10px; font-size:13px; cursor:pointer; }
    #chat { flex:1; overflow-y:auto; overflow-x:hidden; scrollbar-width:thin; scrollbar-color:#2a3a4b transparent;
      background-color:var(--bg);
      background-image:radial-gradient(circle at 20% 30%, rgba(94,181,247,.04) 0 2px, transparent 3px), radial-gradient(circle at 70% 80%, rgba(94,181,247,.035) 0 2px, transparent 3px);
      background-size:60px 60px, 90px 90px; }
    #lista { max-width:980px; margin:0 auto; padding:16px 14px 40px; transition:opacity .5s; }
    #lista.some { opacity:0; }
    .dia { text-align:center; margin:14px 0 10px; }
    .dia span { background:var(--sep); color:#fff; font-size:13px; font-weight:600; padding:4px 12px; border-radius:14px; }
    .msg { display:flex; margin:4px 0; }
    .msg.ent { justify-content:flex-end; }
    .bolha { position:relative; max-width:min(78%, 760px); background:var(--in); border-radius:14px 14px 14px 4px; padding:7px 11px 6px; box-shadow:0 1px 1px rgba(0,0,0,.25); line-height:1.42; word-wrap:break-word; overflow-wrap:anywhere; }
    .msg.ent .bolha { background:var(--out); border-radius:14px 14px 4px 14px; }
    .bolha .tag { font-size:13px; font-weight:700; margin-bottom:2px; }
    .bolha .txt a { color:var(--link); text-decoration:none; }
    .bolha .txt code { background:var(--code); border-radius:4px; padding:1px 4px; font-family:ui-monospace, Menlo, Consolas, monospace; font-size:.92em; color:#e4ecf2; }
    .bolha .txt pre { background:var(--code); border-radius:6px; padding:6px 8px; white-space:pre-wrap; margin:4px 0; font-family:ui-monospace, Menlo, Consolas, monospace; font-size:.9em; }
    .bolha .txt blockquote { border-left:3px solid var(--link); margin:4px 0; padding:2px 8px; background:rgba(106,179,243,.08); border-radius:0 6px 6px 0; }
    .bolha .txt .tg-spoiler { background:#4a5a6a; color:transparent; border-radius:3px; }
    .bolha .meta { float:right; margin:6px 0 -2px 12px; font-size:12px; color:var(--muted); white-space:nowrap; }
    .msg.ent .meta { color:#9fc3e6; }
    .msg.ent .meta::after { content:' ✓✓'; color:#6ab3f3; }
    .msg.nova .bolha { animation:entra .6s cubic-bezier(.2,1.2,.4,1), brilho 3s ease-out; }
    @keyframes entra { from { transform:translateY(24px) scale(.96); opacity:0 } to { transform:none; opacity:1 } }
    @keyframes brilho { 0%,40% { box-shadow:0 0 0 2px rgba(106,179,243,.85), 0 0 24px rgba(106,179,243,.35) } 100% { box-shadow:0 1px 1px rgba(0,0,0,.25) } }
    /* Foto do anúncio vendido (v126) — só na tela; o Telegram recebe só texto */
    .bolha.com-foto { display:flex; gap:12px; align-items:flex-start; } .bolha.com-foto > .corpo-b { min-width:0; flex:1; }
    .bolha .foto { width:7.5em; height:7.5em; border-radius:10px; object-fit:contain; background:#fff; flex:none; box-shadow:0 2px 8px rgba(0,0,0,.35); }
    /* Alerta de pergunta/chat de cliente (bipe + voz): borda vermelha + selo; pisca quando chega */
    .msg.alerta .bolha { border-left:5px solid #ff5d5d; }
    .msg.alerta .selo { display:inline-block; background:#ff5d5d; color:#fff; font-weight:800; font-size:.8em; letter-spacing:.03em; border-radius:6px; padding:2px 8px; margin-bottom:4px; }
    .msg.nova.alerta .bolha { animation:entra .6s cubic-bezier(.2,1.2,.4,1), alertaPulsa 1.1s ease-in-out 9; }
    @keyframes alertaPulsa { 50% { box-shadow:0 0 0 3px rgba(255,93,93,.95), 0 0 34px rgba(255,93,93,.55); } }
    .som-aviso { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:#3a2a12; border:1px solid #f2c94c; color:#ffe7a3; border-radius:12px; padding:10px 18px; font-size:16px; font-weight:600; z-index:7; cursor:pointer; display:none; animation:pisca 2s infinite; }
    .vazio { text-align:center; color:var(--muted); margin-top:30vh; font-size:16px; line-height:1.6; }
    .toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#22303f; border:1px solid #2a3a4b; border-radius:10px; padding:10px 14px; font-size:14px; display:none; z-index:5; max-width:90vw; }
    .cheia { position:fixed; inset:0; background:rgba(14,22,33,.85); display:none; align-items:center; justify-content:center; z-index:6; font-size:22px; cursor:pointer; text-align:center; }
    /* Modo TV: letra grande, sem controles, sem cursor parado */
    body.tv { --fs:clamp(18px, 1.55vw, 34px); }
    body.tv .ctrls { display:none; }
    body.tv .av { width:58px; height:58px; font-size:20px; }
    body.tv .nome b { font-size:1.25em; }
    body.tv #relogio { font-size:1.6em; }
    body.tv #lista { max-width:min(1400px, 92vw); }
    body.tv .bolha { max-width:min(86%, 1200px); }
    /* v139 (pedido do usuário): avisos do sistema ocupam toda a largura da coluna de mensagens —
       sem faixa vazia entre as bolhas e o painel. Comandos que chegam no bot (.ent) continuam estreitos. */
    .msg:not(.ent) .bolha, body.tv .msg:not(.ent) .bolha { max-width:100%; }
    body.tv #lista { max-width:none; }
    body.tv.parado { cursor:none; }
    /* Painel ao lado (v124): placar de hoje, rankeamento hoje, IA Estrategista. Some em tela estreita. */
    .corpo { flex:1; display:flex; min-height:0; }
    .corpo #chat { min-width:0; }
    /* Letra do painel independe do --fs do modo TV (senão estoura a altura). */
    #painel { font-size:clamp(13px, min(1.05vw, 2vh), 24px); width:clamp(400px, 40vw, 860px); flex:none; border-left:1px solid #0b121a; background:#111c28; padding:14px 16px; display:flex; flex-direction:column; gap:12px; overflow:hidden; }
    #painel[hidden] { display:none; }
    .blk { background:var(--top); border:1px solid #22303f; border-radius:16px; padding:12px 14px; }
    .blk h3 { margin:0 0 8px; font-size:.86em; letter-spacing:.4px; color:#9fb4c7; text-transform:uppercase; display:flex; align-items:center; gap:8px; }
    .blk h3 small { margin-left:auto; text-align:right; font-size:.82em; color:var(--muted); text-transform:none; letter-spacing:0; font-weight:500; }
    .pl-big { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .pl-big .k { font-size:.76em; color:var(--muted); font-weight:700; }
    .pl-big .v { font-size:1.95em; font-weight:900; margin-top:2px; font-variant-numeric:tabular-nums; }
    .pl-big .s { font-size:.82em; font-weight:700; margin-top:2px; }
    .pl-big .s em { color:var(--muted); font-weight:500; font-style:normal; }
    .up { color:#3fb950; } .dn { color:#f85149; }
    .lj { margin-top:10px; }
    .lj .l { display:flex; gap:8px; align-items:center; padding:5px 0 2px; font-size:.86em; }
    .lj .l .n { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .lj .l .q { color:#9fb4c7; white-space:nowrap; } .lj .l .f { font-weight:800; min-width:5.5em; text-align:right; white-space:nowrap; }
    .lj .bar { height:5px; border-radius:4px; background:#22303f; overflow:hidden; } .lj .bar i { display:block; height:100%; background:linear-gradient(90deg,#5eb5f7,#2b5278); }
    .est { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px; }
    .est div { background:#1c2a39; border-radius:10px; padding:4px 2px; text-align:center; }
    .est .i { font-size:.95em; } .est .v { font-size:1.15em; font-weight:900; line-height:1.15; } .est .l { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:.62em; color:var(--muted); font-weight:700; text-transform:uppercase; }
    .bb { display:flex; gap:6px; margin-top:6px; } .bb div { flex:1; border-radius:10px; padding:4px 6px; text-align:center; font-weight:800; font-size:.78em; }
    .bb b { font-size:1.25em; margin-right:4px; } .bb .g { background:rgba(63,185,80,.14); color:#3fb950; } .bb .e { background:rgba(240,136,62,.14); color:#f0883e; } .bb .p { background:rgba(248,81,73,.14); color:#f85149; }
    .bb-sub { display:none; }
    /* Carrossel (v129) — gira a cada 30s (v130) */
    .car { flex:1; min-height:0; display:flex; flex-direction:column; }
    #carCorpo { flex:1; min-height:0; overflow:hidden; animation:carEntra .5s ease; }
    @keyframes carEntra { from { opacity:0; transform:translateX(18px); } to { opacity:1; transform:none; } }
    .car-dots { display:flex; justify-content:center; gap:6px; margin-top:6px; }
    .car-dots i { width:7px; height:7px; border-radius:50%; background:#2a3a4b; } .car-dots i.on { background:#5eb5f7; }
    .tp { display:flex; align-items:center; gap:9px; padding:6px 0; border-top:1px solid #22303f; } .tp:first-child { border-top:none; }
    .tp .pos { width:1.6em; text-align:center; font-weight:900; color:#9fb4c7; flex:none; }
    .tp img { width:2.3em; height:2.3em; border-radius:8px; object-fit:cover; background:#fff; flex:none; }
    .tp .t { flex:1; min-width:0; font-size:.86em; } .tp .t b { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:700; } .tp .t span { color:#9fb4c7; font-size:.92em; }
    .tp .v { font-weight:900; white-space:nowrap; font-size:.9em; text-align:right; } .tp .v small { display:block; color:#9fb4c7; font-weight:600; font-size:.82em; }
    /* Vendas por hora (v130): barras grandes lado a lado (hoje azul × ontem cinza), número em cima, ocupa o card todo */
    .hrw { display:flex; flex-direction:column; height:100%; }
    /* v131: promoções, frase do dia */
    .pr-cont { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:6px; }
    .pr-cont div { background:#1c2a39; border-radius:12px; padding:8px 10px; } .pr-cont b { display:block; font-size:1.7em; font-weight:900; } .pr-cont span { font-size:.78em; color:#9fb4c7; }
    .pr-sub { font-size:.78em; font-weight:800; color:#9fb4c7; text-transform:uppercase; letter-spacing:.3px; margin:6px 0 2px; }
    /* v133 */
    .tk { display:grid; grid-template-columns:1fr 1fr; gap:10px; } .tk div { background:#1c2a39; border-radius:12px; padding:12px; }
    .tk span { display:block; font-size:.8em; color:#9fb4c7; font-weight:700; } .tk b { display:block; font-size:2em; font-weight:900; margin:4px 0; } .tk small { font-size:.8em; color:#9fb4c7; }
    .tk-dica { margin-top:10px; font-size:.86em; background:rgba(94,181,247,.08); border-radius:10px; padding:8px 10px; }
    .uf { display:flex; align-items:center; gap:8px; padding:5px 0; font-size:.9em; } .uf .n { width:9.5em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:700; }
    .uf .bar { flex:1; height:.9em; background:#22303f; border-radius:6px; overflow:hidden; } .uf .bar i { display:block; height:100%; background:linear-gradient(90deg,#4ea1ff,#a371f7); border-radius:6px; } .uf .q { width:2.5em; text-align:right; font-weight:900; }
    .rc { height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; gap:6px; font-size:.95em; }
    .rc .big { font-size:3.6em; font-weight:900; color:#5ef08a; line-height:1; } .rc-bar { width:80%; height:.8em; background:#22303f; border-radius:6px; overflow:hidden; } .rc-bar i { display:block; height:100%; background:linear-gradient(90deg,#5ef08a,#1f9d4c); }
    .rc-pct { font-size:.85em; color:#9fb4c7; font-weight:700; }
    /* v134: melhor dia/horário e servidor */
    .md-top { display:grid; grid-template-columns:1fr 1fr; gap:8px; } .md-top div { background:#1c2a39; border-radius:12px; padding:8px 10px; font-size:.8em; color:#9fb4c7; font-weight:700; }
    .md-top b { display:block; font-size:1.7em; color:#f2c94c; margin:2px 0; } .md-top small { font-size:.92em; font-weight:500; }
    .md-dias { display:flex; gap:6px; align-items:flex-end; height:5.2em; margin-top:8px; } .md-dias div { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
    .md-dias .b { width:70%; background:#4ea1ff; border-radius:4px 4px 0 0; min-height:2px; } .md-dias .on .b { background:#f2c94c; } .md-dias .v { font-size:.74em; font-weight:800; } .md-dias .l { font-size:.72em; color:#9fb4c7; font-weight:700; } .md-dias .on .l, .md-dias .on .v { color:#f2c94c; }
    .md-horas { display:flex; gap:2px; align-items:flex-end; height:3.6em; margin-top:8px; border-bottom:2px solid #2a3a4b; } .md-horas span { flex:1; background:#2b6cb0; border-radius:2px 2px 0 0; } .md-horas span.on { background:#ff9f43; }
    .sv-g { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:6px; } .sv { text-align:center; }
    .sv-a { width:6.2em; height:6.2em; margin:0 auto; border-radius:50%; background:conic-gradient(var(--c) calc(var(--p)*1%), #22303f 0); display:flex; align-items:center; justify-content:center; position:relative; }
    .sv-a::before { content:''; position:absolute; inset:.6em; border-radius:50%; background:var(--top); } .sv-a b { position:relative; font-size:1.35em; font-weight:900; }
    .sv-n { margin-top:6px; font-weight:800; font-size:.9em; } .sv-s { font-size:.76em; color:#9fb4c7; }
    .frase { height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:0 6%; }
    .frase .aspas { font-size:4em; line-height:.6; color:#5eb5f7; font-family:Georgia, serif; }
    .frase .txt { font-size:1.6em; font-weight:800; line-height:1.3; margin:.4em 0; color:#e8f2fb; }
    .frase .assin { font-size:.8em; color:#9fb4c7; }
    .hr-tot { display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:.9em; }
    .hr-tot b { font-size:1.6em; font-weight:900; } .hr-tot .h b { color:#4ea1ff; } .hr-tot .o b { color:#ff9f43; }
    .hr { flex:1; min-height:6em; display:flex; align-items:flex-end; gap:.35em; padding-top:1.4em; border-bottom:2px solid #2a3a4b; }
    .hr > div { flex:1; display:flex; align-items:flex-end; justify-content:center; gap:2px; height:100%; }
    .hr .b { position:relative; width:46%; border-radius:4px 4px 0 0; min-height:2px; }
    .hr .b.hj { background:linear-gradient(180deg,#4ea1ff,#1f5fbf); } .hr .b.on { background:linear-gradient(180deg,#ffb066,#e0701a); opacity:.9; }
    .hr .b.sp { background:linear-gradient(180deg,#c39bff,#7b4fd6); opacity:.9; } .hr-tot .s b { color:#c39bff; }
    .sp-fat { display:flex; justify-content:space-between; gap:8px; font-size:.8em; color:#9fb4c7; margin-top:3px; } .sp-fat b { color:#e8f2fb; }
    .sh-k { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:6px; } .sh-k > div { background:#1b2733; border-radius:10px; padding:6px 10px; font-size:.82em; color:#9fb4c7; }
    .sh-k b { display:block; font-size:1.9em; font-weight:900; line-height:1.1; } .sh-sub { font-size:.78em; font-weight:800; color:#9fb4c7; margin:6px 0 2px; text-transform:uppercase; letter-spacing:.03em; }
    .sd-g { display:grid; grid-template-columns:1fr 1fr; gap:12px; } .sd-i { display:flex; gap:8px; align-items:center; padding:6px 0; border-top:1px solid #22303f; }
    .sd-i img { width:2.6em; height:2.6em; border-radius:8px; object-fit:cover; background:#fff; flex:none; } .sd-i .t { min-width:0; font-size:.86em; }
    .sd-i .t b { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; font-weight:700; line-height:1.25; } .sd-i .t > span { color:#9fb4c7; font-size:.92em; }
    .nota { width:2.3em; height:2.3em; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:.9em; color:#0e1621; flex:none; }
    .hr .agora .b.hj { background:linear-gradient(180deg,#5ef08a,#1f9d4c); box-shadow:0 0 12px rgba(63,185,80,.6); }
    .hr .b.hj em { position:absolute; bottom:100%; left:50%; transform:translateX(-50%); font-style:normal; font-weight:900; font-size:.82em; color:#e8f2fb; margin-bottom:2px; white-space:nowrap; }
    .hr .agora .b.hj em { color:#5ef08a; }
    .hr-l { display:flex; gap:.35em; font-size:.8em; color:#9fb4c7; margin-top:4px; font-weight:700; } .hr-l span { flex:1; text-align:center; }
    .hr-l .agora { color:#5ef08a; }
    .hr-leg { display:flex; gap:14px; font-size:.78em; color:#9fb4c7; margin-top:6px; } .hr-leg i { display:inline-block; width:.9em; height:.9em; border-radius:2px; vertical-align:-1px; margin-right:4px; }
    .ia { display:flex; gap:10px; padding:7px 0; border-top:1px solid #22303f; } .ia:first-of-type { border-top:none; }
    .tp .ia { padding:0; border:none; }
    .ia .p { flex:none; width:2.4em; height:2.4em; border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:900; color:#fff; }
    .ia .t { font-size:.84em; line-height:1.35; min-width:0; } .ia .t b { display:block; font-size:1.04em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .ia .t span { color:#9fb4c7; }
    .pn-vazio { color:var(--muted); font-size:.82em; }
    @media (max-width:1100px) { #painel { display:none !important; } }
    /* Saúde do sistema (v125) — no topo */
    .saude { display:flex; gap:6px; }
    .sd { font-size:.8em; font-weight:700; padding:5px 10px; border-radius:20px; background:#1c2a39; border:1px solid #22303f; white-space:nowrap; color:#8fd19e; }
    .sd.alerta { color:#1a1a1a; background:#f0b429; border-color:#f0b429; }
    .sd.ruim { color:#fff; background:#b62324; border-color:#f85149; animation:pisca 1.2s infinite; }
    @media (max-width:900px) { .saude { display:none; } }
    /* Recorde do mês e ontem (v125) — no Placar */
    .rec { margin-top:9px; border-radius:12px; padding:7px 11px; font-size:.84em; background:#1c2a39; display:flex; justify-content:space-between; gap:8px; }
    .rec.novo { background:linear-gradient(90deg,#b8860b,#f2c94c); color:#1a1a1a; font-weight:900; font-size:1.1em; justify-content:center; animation:recBrilho 2s infinite; }
    @keyframes recBrilho { 50% { filter:brightness(1.25); } }
    .ont { margin-top:8px; display:flex; justify-content:space-between; font-size:.84em; color:#9fb4c7; border-top:1px solid #22303f; padding-top:7px; }
    .ont b { color:var(--txt); }
    @media (max-width:640px) { .ctrls { display:none; } #relogio { font-size:16px; } .bolha { max-width:90%; } }
  </style>
</head>
<body>
<header class="tg-top">
  <div class="av">ML</div>
  <div class="nome"><b>ML Dashboard · Avisos</b><small id="sub">bot · conectando…</small></div>
  <div class="dir">
    <div class="ctrls">
      <button id="btnPausa" title="Pausar/continuar a rolagem">⏸ Pausar</button>

<script src="../js/telegramHtml.js"></script>
<script>
// Tela Telegram — cópia de TODA mensagem do Telegram (telegram_mensagens,
// gravada por server/src/telegramLog.js), no mesmo visual, rolando sozinha
// pra deixar numa TV. Rolagem: desce devagar pelas mensagens; no fim espera e
// recomeça do topo. Mensagem nova: entra embaixo com brilho e a tela segura
// nela 15s. Dados: /api/telegram-tela (login) ou /api/publico/telegram-tela
// ?token= (link da TV). Ao vivo: WebSocket avisa só o id (`telegram_mensagem`)
// + conferência a cada 15s. Ver .claude/frontend.md.
const P = new URLSearchParams(location.search);
const TOKEN = P.get('token') || '';
const API = TOKEN ? `/api/publico/telegram-tela?token=${encodeURIComponent(TOKEN)}` : '/api/telegram-tela';
const MAX_NA_TELA = 300;
const TOPICOS = {
  tg_vendas: ['🛒 Vendas', '#5eb5f7'], tg_rankeamento: ['📈 Rankeamento', '#b48cf2'], tg_rankeamento_resumo: ['📊 Rankeamento', '#b48cf2'], tg_ia_estrategista: ['🧠 IA Estrategista', '#a78bfa'], tg_topvendas: ['🔥 Top vendas', '#f2a54a'],
  tg_outlier: ['📊 Fora do normal', '#f2a54a'], tg_servicos: ['🛠️ Serviços', '#8fa3b5'], tg_recursos: ['💻 Servidor', '#8fa3b5'],
  tg_reposicao: ['📦 Reposição', '#f2c94c'], tg_perguntas: ['❓ Perguntas', '#5ed1a5'], tg_mensagens: ['💬 Mensagens', '#5ed1a5'],
  tg_promocoes: ['🏷️ Promoções', '#e66fb0'], tg_devolucoes: ['↩️ Devoluções', '#e05353'], tg_anuncios: ['📝 Anúncios', '#5eb5f7'],
  tg_tarefas: ['✅ Tarefas', '#5ed1a5'], tg_conciliacao: ['🏦 Conciliação', '#8fa3b5'], tg_shopee_campanhas: ['🟠 Shopee', '#f2784b'],
  tg_token: ['🔑 Tokens', '#e05353'], tg_fila: ['⏳ Fila', '#8fa3b5'], tg_429: ['🚦 Limite ML', '#e05353'], tg_infra: ['🖥️ Infra', '#e05353'],
  tg_queda_produtos: ['📉 Queda de vendas', '#e05353'], tg_importacao_metrizap: ['📥 Metrizap', '#f2c94c'], tg_pagamentos: ['💸 Pagamentos', '#5ed1a5'],
  tg_dividas_lembrete: ['⏰ Dívidas', '#f2c94c'], tg_buybox_mudancas: ['🏆 Buy Box', '#f2a54a'], tg_buybox_relatorio: ['🏆 Buy Box', '#f2a54a'],
  tg_email_falha: ['📧 E-mail', '#e05353'], bot: ['🤖 Bot', '#8fa3b5'], teste: ['🧪 Teste', '#8fa3b5'],
};
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const chat = document.getElementById('chat'), lista = document.getElementById('lista');
let ultimoId = 0, ultimoDia = '', total = 0, hoje = 0;

function toast(t, ms = 3500) { const e = document.getElementById('toast'); e.innerHTML = t; e.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => { e.style.display = 'none'; }, ms); }
const diaDe = iso => new Date(iso).toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' });
function rotuloDia(d) {
  const hojeD = diaDe(new Date()), ontem = diaDe(new Date(Date.now() - 86400000));
  if (d === hojeD) return 'Hoje';
  if (d === ontem) return 'Ontem';
  return new Date(d + 'T12:00:00').toLocaleDateString('pt-BR', { day: 'numeric', month: 'long' });
}
function bolha(m, nova) {
  const d = diaDe(m.criado_em);
  let html = '';
  if (d !== ultimoDia) { html += `<div class="dia"><span>${rotuloDia(d)}</span></div>`; ultimoDia = d; }
  const t = TOPICOS[m.topico] || (m.topico ? [esc(m.topico), '#8fa3b5'] : null);
  const hora = new Date(m.criado_em).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', timeZone: 'America/Sao_Paulo' });
  const ent = m.direcao === 'entrada';
  const al = tipoAlerta(m);
  const foto = m.imagem && /^https?:\/\//.test(m.imagem) ? `<img class="foto" src="${esc(m.imagem)}" alt="" loading="lazy" onerror="this.remove()">` : '';
  html += `<div class="msg ${ent ? 'ent' : ''}${nova ? ' nova' : ''}${al ? ' alerta' : ''}" data-id="${m.id}"><div class="bolha${foto ? ' com-foto' : ''}">${foto}<div class="corpo-b">
    ${al ? `<div class="selo">${al.selo}</div>` : ''}${!ent && t ? `<div class="tag" style="color:${t[1]}">${t[0]}</div>` : ''}${ent && m.autor ? `<div class="tag" style="color:#9fc3e6">${esc(m.autor)}</div>` : ''}
    <div class="txt">${TelegramHtml.paraHtml(m.texto, m.html !== false)}<span class="meta">${hora}</span></div></div></div></div>`;
  return html;
}
function poda() {
  const msgs = lista.querySelectorAll('.msg');
  for (let i = 0; i < msgs.length - MAX_NA_TELA; i++) msgs[i].remove();
  lista.querySelectorAll('.dia').forEach(dv => { if (!dv.nextElementSibling || dv.nextElementSibling.classList.contains('dia')) dv.remove(); });
}
function cabecalho() {
  document.getElementById('sub').textContent = `bot · ${hoje} mensagem(ns) hoje`;
}

async function buscar(novas) {
  try {
    const r = await fetch(novas ? `${API}${TOKEN ? '&' : '?'}depois_id=${ultimoId}` : API, { credentials: 'same-origin' });
    if (r.status === 401 || r.status === 403) {
      const j = await r.json().catch(() => ({}));
      lista.innerHTML = `<div class="vazio">🔒 ${esc(j.error || 'Sem acesso')}<br><small>Abra pelo menu (com login) ou pelo <b>🔗 Link da TV</b>.</small></div>`;
      return;
    }
    const j = await r.json();
    hoje = j.hoje || 0; cabecalho();
    const ms = j.mensagens || [];
    if (!novas) {
      ultimoDia = '';
      lista.innerHTML = ms.length ? ms.map(m => bolha(m, false)).join('') : '<div class="vazio">Nenhuma mensagem ainda.<br><small>Todo aviso que o sistema mandar pro Telegram aparece aqui, na hora.</small></div>';
      if (ms.length) ultimoId = ms[ms.length - 1].id;
      total = ms.length;
      chat.scrollTop = chat.scrollHeight;
      return;
    }
    if (!ms.length) return;
    if (!total) { lista.innerHTML = ''; ultimoDia = ''; }
    lista.insertAdjacentHTML('beforeend', ms.map(m => bolha(m, true)).join(''));
    ultimoId = ms[ms.length - 1].id; total += ms.length;
    poda();
    mostrarNova();
    tocarAlerta(ms.map(tipoAlerta).filter(Boolean));
    painelDepoisDeMensagem();
  } catch (e) { console.warn('[tela-telegram]', e.message); }
}

// ── Rolagem automática ─────────────────────────────────────────────────────
let pausado = false, seguraAte = 0, ultimoQuadro = 0, mexeuEm = 0, voltando = false, acumulado = 0;
function mostrarNova() {
  // Pedido do usuário: TODA mensagem nova rola a tela até ela, sempre (TV).
  // Rola de novo depois da animação de entrada, pra não parar no meio da bolha.
  mexeuEm = 0;
  const descer = () => chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
  requestAnimationFrame(descer); setTimeout(descer, 700);
  seguraAte = Date.now() + (modoFixo() ? 1500 : 15000);
}
// Modo padrão (pedido do usuário): tela PARADA no fim, como o Telegram — cada
// mensagem nova aparece embaixo e a tela desce até ela; nunca volta pro começo.
// Se alguém rolar pra cima pra ler, espera 20s parado e volta pro fim.
// "Rolagem lenta/média/rápida" mantém o modo antigo (desce e recomeça do topo).
const modoFixo = () => Number(document.getElementById('vel').value) === 0;
function quadro(t) {
  const dt = ultimoQuadro ? Math.min(100, t - ultimoQuadro) : 16; ultimoQuadro = t;
  const agora = Date.now();
  if (modoFixo()) {
    if (agora - mexeuEm > 20000 && agora > seguraAte && chat.scrollTop + chat.clientHeight < chat.scrollHeight - 4) {
      chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' }); seguraAte = agora + 1500;
    }
  } else if (!pausado && !voltando && agora > seguraAte && agora - mexeuEm > 20000 && chat.scrollHeight > chat.clientHeight + 4) {
    if (chat.scrollTop + chat.clientHeight >= chat.scrollHeight - 2) {
      // Chegou no fim: segura 8s na mais nova e recomeça do topo (com fade).
      seguraAte = agora + 8000; voltando = true;
      setTimeout(() => { lista.classList.add('some'); setTimeout(() => { if (!modoFixo()) chat.scrollTop = 0; lista.classList.remove('some'); seguraAte = Date.now() + 4000; voltando = false; }, 500); }, 8000);
    } else {
      acumulado += Number(document.getElementById('vel').value) * dt / 1000; // px/s → px neste quadro
      const px = Math.floor(acumulado); if (px >= 1) { chat.scrollTop += px; acumulado -= px; }
    }
  }
  requestAnimationFrame(quadro);
}
['wheel', 'touchstart', 'keydown'].forEach(ev => chat.addEventListener(ev, () => { mexeuEm = Date.now(); }, { passive: true }));
document.getElementById('btnPausa').onclick = e => { pausado = !pausado; e.target.textContent = pausado ? '▶ Continuar' : '⏸ Pausar'; };
const ajustarPausa = () => { document.getElementById('btnPausa').style.display = modoFixo() ? 'none' : ''; };
// Chave nova (tela_tg_modo): TVs que tinham a velocidade antiga salva passam a abrir no modo fixo.
try { const v = localStorage.getItem('tela_tg_modo'); if (v != null) document.getElementById('vel').value = v; } catch (_) {}
document.getElementById('vel').onchange = e => { try { localStorage.setItem('tela_tg_modo', e.target.value); } catch (_) {} ajustarPausa(); if (modoFixo()) chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' }); };
ajustarPausa();

// ── Alerta sonoro (pedido do usuário): pergunta ou chat de cliente → bipe + voz ──
// Só avisos do sistema (não a confirmação de resposta, que também usa tg_perguntas).
// Navegador só libera som depois de um toque/tecla na página: até lá mostra o aviso.
const ALERTAS = [
  { tipo: 'pergunta', topico: 'tg_perguntas', re: /Nova pergunta/i, selo: '🔔 PERGUNTA DE CLIENTE — RESPONDER', voz: 'Pergunta de cliente. Por favor, responder o mais rápido possível.' },
  { tipo: 'chat', topico: 'tg_mensagens', re: /Nova mensagem de comprador|Mensagem Shopee/i, selo: '🔔 CHAT — RESPONDER', voz: 'Chat. Por favor, responder.' },
];
function tipoAlerta(m) { return m.direcao === 'entrada' ? null : ALERTAS.find(a => a.topico === m.topico && a.re.test(m.texto || '')) || null; }
let somLigado = true, audio = null;
try { somLigado = localStorage.getItem('tela_tg_som') !== '0'; } catch (_) {}
function ctxAudio() { try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} return audio; }
const somTravado = () => !ctxAudio() || audio.state !== 'running';
function avisoSom() { document.getElementById('somAviso').style.display = somLigado && somTravado() ? 'block' : 'none'; }
function destravarSom() {
  const c = ctxAudio(); if (!c) return;
  c.resume().then(avisoSom, avisoSom);
  try { speechSynthesis.speak(new SpeechSynthesisUtterance(' ')); } catch (_) {} // libera a voz no mesmo toque
}
function bipe() {
  const c = ctxAudio(); if (!c || c.state !== 'running') return;
  [0, 0.28, 0.56].forEach((t, i) => {
    const o = c.createOscillator(), g = c.createGain(), ini = c.currentTime + t;
    o.type = 'square'; o.frequency.value = i === 2 ? 1320 : 880;
    g.gain.setValueAtTime(0.0001, ini); g.gain.exponentialRampToValueAtTime(0.35, ini + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, ini + 0.22);
    o.connect(g).connect(c.destination); o.start(ini); o.stop(ini + 0.24);
  });
}
function falar(txt) {
  try {
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = 'pt-BR'; u.rate = 0.95; u.volume = 1;
    const v = speechSynthesis.getVoices().find(x => /^pt[-_]BR/i.test(x.lang)) || speechSynthesis.getVoices().find(x => /^pt/i.test(x.lang));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (_) {}
}
function tocarAlerta(lista) {
  if (!somLigado || !lista.length) return;
  const tipos = ALERTAS.filter(a => lista.includes(a)); // 1 fala por tipo, pergunta primeiro
  bipe();
  try { speechSynthesis.cancel(); } catch (_) {}
  setTimeout(() => tipos.forEach(a => falar(a.voz)), 900);
}
function botaoSom() { document.getElementById('btnSom').textContent = somLigado ? '🔊 Som' : '🔇 Mudo'; avisoSom(); }
document.getElementById('btnSom').onclick = () => {
  somLigado = !somLigado; try { localStorage.setItem('tela_tg_som', somLigado ? '1' : '0'); } catch (_) {}
  botaoSom(); if (somLigado) { destravarSom(); setTimeout(() => { bipe(); falar('Som dos alertas ligado.'); }, 150); }
};
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, destravarSom, { passive: true }));
try { speechSynthesis.getVoices(); } catch (_) {} // carrega a lista de vozes cedo
botaoSom(); setTimeout(avisoSom, 1500);

// ── Modo TV: tela cheia + não deixar a tela apagar + esconder o cursor ─────
let wake = null;
async function pedirTelaCheia() {
  try { if (!document.fullscreenElement) await document.documentElement.requestFullscreen(); } catch (_) {}
  try { if ('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); } catch (_) {}
}
function modoTv(liga) {
  document.body.classList.toggle('tv', liga);
  if (liga) pedirTelaCheia();
}
document.getElementById('btnTv').onclick = () => modoTv(true);
document.addEventListener('visibilitychange', () => { if (!document.hidden && document.body.classList.contains('tv')) pedirTelaCheia(); });
let cursorT = null;
document.addEventListener('mousemove', () => { document.body.classList.remove('parado'); clearTimeout(cursorT); cursorT = setTimeout(() => document.body.classList.add('parado'), 3000); });
if (P.get('tv') === '1') {
  document.body.classList.add('tv');
  const c = document.getElementById('cheia'); c.style.display = 'flex';
  c.onclick = () => { c.style.display = 'none'; pedirTelaCheia(); };
  setTimeout(() => { c.style.display = 'none'; }, 15000);
}

// ── Link da TV (sem login, com token) ──────────────────────────────────────
document.getElementById('btnLink').onclick = async () => {
  try {
    const r = await fetch('/api/telegram-tela/link-tv', { credentials: 'same-origin' });
    const j = await r.json();
    if (!j.token) throw new Error(j.error || 'sem token');
    const url = `${location.origin}/pages/tela-telegram.html?tv=1&token=${j.token}`;
    try { await navigator.clipboard.writeText(url); toast('🔗 Link da TV copiado! Abra na TV (Chrome) e deixe lá.<br><small>' + esc(url) + '</small>', 9000); }
    catch (_) { prompt('Link da TV (abra no navegador da TV):', url); }
  } catch (e) { toast('Não consegui gerar o link: ' + esc(e.message)); }
};

// ── Relógio, ao vivo (WebSocket só avisa o id) e conferência a cada 15s ────
function relogio() { document.getElementById('relogio').textContent = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', timeZone: 'America/Sao_Paulo' }); }
setInterval(relogio, 5000); relogio();
let ws = null, wsEspera = 2000;
function conectar() {
  try {
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    ws.onopen = () => { wsEspera = 2000; document.getElementById('live').classList.remove('off'); document.getElementById('sub').classList.add('on'); };
    ws.onmessage = ({ data }) => { try { const m = JSON.parse(data); if (m.topic === 'telegram_mensagem') buscar(true); } catch (_) {} };
    ws.onclose = () => { document.getElementById('live').classList.add('off'); document.getElementById('sub').classList.remove('on'); setTimeout(conectar, wsEspera); wsEspera = Math.min(wsEspera * 2, 30000); };
  } catch (_) { setTimeout(conectar, wsEspera); }
}
setInterval(() => buscar(true), 15000);

// ── Painel ao lado: atualiza a cada 1 min e ~3s depois de cada mensagem nova ──
const PAINEL_API = TOKEN ? `/api/publico/telegram-tela/painel?token=${encodeURIComponent(TOKEN)}` : '/api/telegram-tela/painel';
const R$ = n => 'R$ ' + Math.round(Number(n) || 0).toLocaleString('pt-BR');
const R$2 = n => (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const varTxt = (a, b, fmt) => { if (!b) return `<em>(ontem ${fmt(b)})</em>`; const v = ((a - b) / b) * 100; return `<span class="${v >= 0 ? 'up' : 'dn'}">${v >= 0 ? '▲' : '▼'} ${Math.abs(Math.round(v))}%</span> <em>(ontem ${fmt(b)})</em>`; };
const FASES_PN = [['rankeando', '🚀', 'Em rankeam.'], ['catalogo', '🏆', 'Catálogo'], ['ranqueado', '🛡️', 'Ranqueado'], ['monitoramento', '👁️', 'Monitor.'], ['recuperacao', '❤️‍🩹', 'Recuper.']];
const corNota = n => n >= 80 ? '#f85149' : n >= 60 ? '#f0883e' : n >= 40 ? '#d29922' : '#388bfd';
let painelT = null;
async function carregarPainel() {
  try {
    const r = await fetch(PAINEL_API, { credentials: 'same-origin' });
    if (!r.ok) return;
    const d = await r.json();
    const p = d.placar, max = Math.max(1, ...p.lojas.map(l => l.fat));
    document.getElementById('pnPlacarSub').textContent = `até ${new Date(d.gerado_em).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', timeZone: 'America/Sao_Paulo' })} · vs ontem no mesmo horário`;
    document.getElementById('pnPlacar').innerHTML = `<div class="pl-big">
        <div><div class="k">🛒 PEDIDOS</div><div class="v">${p.pedidos}</div><div class="s">${varTxt(p.pedidos, p.pedidos_ontem, v => v)}</div></div>
        <div><div class="k">💰 FATURAMENTO</div><div class="v">${R$(p.fat)}</div><div class="s">${varTxt(p.fat, p.fat_ontem, R$)}</div></div></div>
      ${recordeHtml(d.recorde, p.fat)}
      <div class="ont"><span>📅 Ontem (dia inteiro)</span><span><b>${R$(d.ontem.fat)}</b> · ${d.ontem.pedidos} pedidos</span></div>
      <div class="lj">${p.lojas.length ? p.lojas.slice(0, 4).map(l => `<div class="l"><span class="n">${l.mkt === 'SHOPEE' ? '🟠 Shopee · ' : l.mkt === 'TIKTOK' ? '🎵 TikTok · ' : '🏪 '}${esc(l.loja)}</span><span class="q">${l.pedidos} ped.</span><span class="f">${R$(l.fat)}</span></div><div class="bar"><i style="width:${Math.round((l.fat / max) * 100)}%"></i></div>`).join('') + (p.lojas.length > 4 ? `<div class="pn-vazio" style="margin-top:4px">+${p.lojas.length - 4} empresa(s)</div>` : '') : '<div class="pn-vazio">Nenhuma venda ainda hoje.</div>'}</div>`;
    CAR_DADOS = d; renderSaude(d.saude);

      <div class="bb"><div class="g"><b>${bb.ganhando}</b>🟢 Ganhando</div><div class="e"><b>${bb.compartilhando}</b>🟡 Empatado</div><div class="p"><b>${bb.perdendo}</b>🔴 Perdendo</div></div>
      <div class="bb-sub">Placar de Buy Box dos anúncios de catálogo</div>`;
    CAR_DADOS = d; renderCarrossel();
    document.getElementById('painel').hidden = false;
  } catch (e) { console.warn('[tela-telegram] painel', e.message); }
}
// Recorde do mês: maior dia ANTES de hoje (dia 1 não tem com o que comparar → não mostra).
function recordeHtml(rec, fatHoje) {
  if (!rec) return '';
  if (fatHoje > rec.fat) return '<div class="rec novo">🏆 NOVO RECORDE DO MÊS! 🏆</div>';
  return `<div class="rec"><span>🏆 Recorde do mês: <b>${R$(rec.fat)}</b> (dia ${Number(rec.dia.slice(8, 10))})</span><span>faltam <b>${R$(rec.fat - fatHoje)}</b></span></div>`;
}
// Saúde: worker (heartbeat < 2 min), tokens do ML, última venda (8–22h: amarelo > 2h, vermelho > 4h).
function renderSaude(sd) {

      return com.length ? `<div class="sp-fat" style="margin:0 0 4px"><span>📆 ${esc(mes)}: <b>${tot} pedidos</b> em <b>${com.length}</b> estado(s)</span><span>💰 <b>${R$(com.reduce((a, e) => a + e.fat, 0))}</b></span></div>` + com.slice(0, 7).map((e, i) => `<div class="uf"><span class="n">${i === 0 ? '🏆 ' : ''}${esc(e.estado)}</span><span class="bar"><i style="width:${(e.pedidos / max) * 100}%"></i></span><span class="q" style="width:auto;min-width:6.2em">${e.pedidos} · ${Math.round((e.pedidos / tot) * 100)}%</span></div>`).join('') + (com.length > 7 ? `<div class="pn-vazio" style="margin-top:4px">+ ${com.length - 7} estado(s) com ${com.slice(7).reduce((a, e) => a + e.pedidos, 0)} pedido(s)</div>` : '') + (sem ? `<div class="pn-vazio" style="margin-top:4px">+ ${sem} pedido(s) sem estado identificado</div>` : '') : '<div class="pn-vazio">Estados ainda não identificados nas vendas do mês.</div>'; } },
  { tit: '😴 Anúncios parados — vendiam bem, 3+ dias sem venda', html: d => (d.carrossel.parados || []).length ? d.carrossel.parados.map(x => `<div class="tp"><div class="pos">😴</div><div class="t"><b>${esc(x.titulo)}</b><span>${esc(x.loja || '')} · ${x.vendas30} vendas em 30 dias${Number(x.estoque) <= 0 ? ' · <span style="color:#f85149">⛔ sem estoque</span>' : ''}</span></div><div class="v" style="color:#f0b429">${x.dias} dias<small>sem vender</small></div></div>`).join('') : '<div class="pn-vazio">✅ Nenhum anúncio forte parado.</div>' },
