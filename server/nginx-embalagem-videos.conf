# Pasta navegável dos vídeos de embalagem — acesso direto por pasta de data,
# fora do dashboard (não passa pelo login STAFF_AUTH, que só protege o que é
# servido pelo Node). Adicionar dentro do mesmo server{} já usado pra
# WebSocket/upload (ver nginx-websocket.conf). Ver .claude/embalagem.md e
# .claude/deployment.md pro passo a passo de criação do usuário/senha.
#
# SEM auth_basic aqui, QUALQUER PESSOA com a URL veria/baixaria vídeos com
# nome de comprador e produto — por isso o Basic Auth abaixo é obrigatório,
# não opcional. Usuário/senha ficam num arquivo separado do login do
# dashboard (não reaproveita staff_users).

location /embalagem-videos/ {
    alias /opt/ml-dashboard-novo/server/storage/embalagem-videos/;
    autoindex on;
    autoindex_exact_size off;   # mostra tamanho em KB/MB em vez de bytes exatos
    autoindex_localtime on;     # mostra data/hora no fuso do servidor, não UTC

    auth_basic "Vídeos de Embalagem";
    auth_basic_user_file /etc/nginx/.htpasswd-embalagem;
}
