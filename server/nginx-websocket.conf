# Configuração nginx para WebSocket — adicionar dentro do bloco location /ws
# (ou incluir este arquivo no seu server block)
#
# Sem isso, o nginx fecha conexões WS ociosas após 60s

# ─── Embalagem (upload de vídeo) — adicionar dentro do server{} ────────────
# Limite padrão do nginx é 1MB por corpo de requisição; um vídeo de
# conferência de embalagem já ultrapassa isso fácil. Sem isso, o upload
# trava sem erro claro (nginx corta a conexão, o navegador fica esperando
# uma resposta que nunca vem do jeito certo). Ver .claude/embalagem.md.
client_max_body_size 300m;

location /ws {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Manter WebSocket vivo — sem esses timeouts o nginx fecha em 60s
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 10s;
}
